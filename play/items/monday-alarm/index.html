<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>월요일 알람 끄기</title>
<style>
  :root { --ink:#29223c; --paper:#fff3dc; --pink:#ef8996; --butter:#ffdc7d; --lavender:#b6a5e6; color-scheme:light; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:#30263f; color:var(--ink); font:700 15px/1.35 system-ui,sans-serif; }
  main { width:min(100%, 520px); height:100vh; height:100dvh; min-height:460px; margin:auto; padding:clamp(12px,3.5vw,26px); background:var(--paper); display:grid; grid-template-rows:auto minmax(96px,1fr) auto; gap:clamp(8px,2vh,16px); }
  header { position:relative; padding-right:56px; }
  header p { margin:0 0 3px; font-size:13px; color:#66536c; }
  h1,h2,p { margin:0; }
  h1 { font-size:clamp(25px,8.4vw,58px); font-weight:950; line-height:1.04; letter-spacing:-.075em; }
  :lang(en) h1 { letter-spacing:-.07em; }
  button { font:inherit; color:inherit; min-width:44px; min-height:44px; border:2px solid var(--ink); border-radius:9px; background:#fff9ed; box-shadow:0 3px 0 var(--ink); cursor:pointer; touch-action:manipulation; }
  button:active { box-shadow:none; transform:translateY(3px); }
  button:focus-visible, textarea:focus-visible { outline:3px solid #6449a6; outline-offset:3px; }
  button:disabled { cursor:default; color:#5c4a64; box-shadow:none; background:#f1e5e0; }
  .sound { position:absolute; top:0; right:0; width:44px; padding:0; display:grid; place-items:center; }
  .sound svg { width:22px; height:22px; }
  .sound[aria-pressed="true"] .waves, .sound[aria-pressed="false"] .slash { display:none; }
  .room { isolation:isolate; position:relative; min-width:0; overflow:hidden; border:3px solid var(--ink); border-radius:22px 22px 13px 13px; background:#ac9bde radial-gradient(circle at 7px 7px,#9281c2 1px,transparent 1.5px) 0 0/30px 30px; }
  .room > svg { display:block; width:100%; height:100%; }
  .remark { position:absolute; top:4%; left:4%; z-index:1; max-width:85%; padding:6px 10px; border:2px solid var(--ink); border-radius:12px 13px 13px 3px; background:#fff9ea; box-shadow:2px 3px 0 #29223c50; font-size:clamp(12px,3.4vw,16px); }
  .cutoff { position:absolute; right:8%; top:24%; display:none; padding:10px 13px 8px; border:2px solid var(--ink); border-radius:4px 9px 5px 4px; background:var(--butter); box-shadow:3px 4px 0 #6e5a9a; transform:rotate(6deg); text-align:center; }
  .cutoff::before { content:""; position:absolute; top:-7px; left:calc(50% - 14px); width:28px; height:10px; background:#ffeab9; transform:rotate(-9deg); }
  .cutoff small { display:block; font-size:12px; }
  .cutoff strong { display:block; font-size:clamp(21px,6vw,32px); font-weight:950; line-height:1; }
  @media (min-height:710px) { .cutoff { display:block; } }
  .scene { stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .dream { display:none; }
  .room[data-dream="0"] .moon, .room[data-dream="1"] .coffee, .room[data-dream="2"] .train, .room[data-dream="3"] .office { display:inline; }
  .awake, .wild { opacity:0; }
  .room[data-mood="ring"] .awake, .room[data-mood="ouch"] .wild { opacity:1; }
  .room[data-mood="ring"] .asleep, .room[data-mood="ouch"] .asleep { opacity:0; }
  .room[data-mood="ouch"] { border-color:#9a3353; }
  .room[data-mood="nice"] { border-color:#6950ac; }
  .float { animation:drift 3.4s ease-in-out infinite alternate; }
  .breath { animation:breathe 2.2s ease-in-out infinite alternate; }
  .room[data-mood="ring"] .clock { animation:rattle .22s ease-in-out infinite alternate; }
  .room[data-mood="nice"] .spark { animation:glint .48s ease-out both; }
  @keyframes drift { to { transform:translateY(-7px); } }
  @keyframes breathe { to { transform:translateY(3px); } }
  @keyframes rattle { to { transform:translateX(3px); } }
  @keyframes glint { from { opacity:0; transform:translateY(8px); } 40% { opacity:1; } to { opacity:0; transform:translateY(-12px); } }
  .deck { display:grid; gap:8px; min-width:0; }
  .intro p { font-weight:650; }
  .major { background:var(--butter); font-weight:900; font-size:clamp(16px,4.8vw,22px); }
  .intro .major { min-height:53px; }
  .stats { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:9px; }
  .stat { line-height:1.07; }
  .stat small { display:block; font-size:11px; color:#66536c; margin-bottom:3px; }
  .stat strong { font-size:clamp(17px,5.2vw,25px); font-variant-numeric:tabular-nums; font-weight:950; white-space:nowrap; }
  .score { text-align:right; }
  .budget { display:flex; gap:3px; align-items:center; }
  .budget i { width:clamp(7px,2.5vw,12px); height:11px; border:1px solid var(--ink); border-radius:2px; background:#e9dbcf; }
  .budget i:last-child { border-color:#a02548; border-style:dashed; }
  .budget i.spent { background:#ad98df; }
  .budget i.spent:last-child { background:var(--pink); }
  .track { position:relative; height:22px; border:2px solid var(--ink); border-radius:7px; background:repeating-linear-gradient(90deg,#594a70 0,#594a70 calc(12.5% - 1px),#786689 calc(12.5% - 1px),#786689 12.5%); }
  .track[data-idle="true"] { opacity:.57; }
  .zone { position:absolute; border:solid #fff0ab; border-width:0 2px; background:var(--butter); top:0; bottom:0; }
  .needle { position:absolute; height:24px; width:6px; top:-3px; margin-left:-3px; border:1px solid var(--ink); border-radius:3px; background:#fff; }
  .actions { display:grid; grid-template-columns:1.25fr 1fr; gap:9px; }
  .actions button { padding:3px 6px; }
  .result { background:#fff9ed; border:2px solid var(--ink); border-radius:12px; padding:9px 11px 10px; }
  .result h2 { font-weight:950; font-size:clamp(18px,5.6vw,28px); line-height:1.13; letter-spacing:-.045em; }
  .result p { font-size:13px; }
  #record { color:#61488e; font-weight:900; }
  textarea { width:100%; height:44px; font:inherit; border:1px solid var(--ink); border-radius:5px; resize:none; }
  @media (max-height:510px) { main { padding:10px 12px; gap:7px; } .deck { gap:6px; } }
  @media (orientation:landscape) and (max-height:430px) {
    main { width:min(100%, 740px); height:auto; min-height:100vh; min-height:100dvh; grid-template-columns:minmax(120px, 1fr) minmax(0, 1fr); grid-template-rows:auto 1fr; }
    header { grid-column:1/-1; }
    h1 { font-size:32px; }
    .room { min-height:190px; }
    .deck { align-self:center; }
    .actions { grid-template-columns:1fr 1fr; }
    .major { font-size:16px; }
    .budget { gap:2px; }
    .budget i { width:7px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; } button:active { transform:none; } }
</style>
</head>

<script>
  'use strict';

  const copy = {
    ko: {
      brand:'하루한판', title:'월요일 알람 끄기', start:'이불 덮고 시작', retry:'다시 눕기',

      mute:'Mute sound', unmute:'Unmute sound', share:'Share result', copied:'Result copied', shareField:'Result to share',
      bell:n => 'Alarm ' + n + '/8', points:n => n + ' pts', best:n => 'Best ' + n + ' pts', budget:n => n + ' snoozes. Eight makes you late.',

  const t = copy[lang];

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const alarmLength = 4.5;

  const storageKey = 'monday-alarm:';
  let best = 0;
  let muted = false;
  try {

    if (muted) return;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;

      if (!audio) {

        volume = audio.createGain();
        volume.connect(audio.destination);

      if (audio.state === 'suspended') audio.resume().catch(() => {});
    } catch (e) {}
  }

  function tone(freq, length, type, delay, gain) {
    if (!audio || !volume || muted || audio.state !== 'running') return;
    const start = audio.currentTime + delay;
    const oscillator = audio.createOscillator();
    const envelope = audio.createGain();
    oscillator.type = type;
    oscillator.frequency.value = freq;
    envelope.gain.setValueAtTime(.001, start);
    envelope.gain.exponentialRampToValueAtTime(gain, start + .014);
    envelope.gain.exponentialRampToValueAtTime(.001, start + length);
    oscillator.connect(envelope);
    envelope.connect(volume);
    oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
    oscillator.start(start);
    oscillator.stop(start + length + .01);
  }

  function updateSound() {
    sound.setAttribute('aria-pressed', String(muted));
    sound.setAttribute('aria-label', muted ? t.unmute : t.mute);
    sound.title = muted ? t.unmute : t.mute;
    if (volume) volume.gain.value = muted ? 0 : 1;
  }

  function clockTime() {
    const minutes = 20 + 5 * spent;
    return minutes < 60 ? '07:' + minutes : '08:00';
  }

  function updateStats() {
    time.textContent = clockTime();
    score.textContent = t.points(points);
    bell.textContent = t.bell(index + 1);
    budget.setAttribute('aria-label', t.budget(spent));
    for (let i = 0; i < alarmCount; i++) budget.children[i].classList.toggle('spent', i < spent);
  }

  function setMood(mood, message) {
    room.dataset.mood = mood;
    remark.textContent = message;
  }

  function setHandled(value) {
    handled = value;
    snooze.disabled = value;
    peek.disabled = value;
    track.dataset.idle = String(value);
  }

  function ring() {
    age = 0;
    nextBeep = 0;
    left = offsets[index];
    width = .34 - index * .029;
    zone.style.left = left * 100 + '%';
    zone.style.width = width * 100 + '%';
    needle.style.left = '0%';
    peek.textContent = index === alarmCount - 1 ? t.wake : t.peek;
    setMood('ring', t.rings[index]);
    setHandled(false);
    updateStats();
  }

  function start() {
    if (mode === 'play') return;
    round++;
    unlockAudio();
    mode = 'play';
    intro.hidden = true;
    result.hidden = true;
    play.hidden = false;
    index = spent = points = dream = 0;
    room.dataset.dream = '0';
    last = null;
    ring();
    if (!document.hidden) frame = requestAnimationFrame(tick);
  }

  function needlePosition() {
    const position = age / alarmLength;
    return reduced.matches ? Math.floor(position * 100 / 3) * .03 : position;
  }

  function choose(wantsSleep) {
    if (mode !== 'play' || handled) return;
    if (!wantsSleep && index === alarmCount - 1) {
      finish();
      return;
    }
    setHandled(true);
    if (!wantsSleep) {
      setMood('sleep', t.hold);
      tone(270, .13, 'sine', 0, .10);
      return;
    }
    spent++;
    const position = needlePosition();
    if (position >= left && position <= left + width) {
      points += 100 + Math.round(50 * (1 - Math.abs(position - left - width / 2) / (width / 2)));
      room.dataset.dream = String([1, 2, 3, 3][dream % 4]);
      setMood('nice', t.dreams[dream % 4]);
      dream++;
      tone(523, .18, 'sine', 0, .14);
      tone(784, .25, 'sine', .07, .14);
    } else {
      setMood('ouch', t.rough);
      tone(128, .2, 'triangle', 0, .16);
    }
    updateStats();
  }

  function tick(now) {
    age += last === null ? 0 : Math.min(.1, (now - last) / 1000);
    last = now;
    if (age >= alarmLength) {
      if (!handled) spent++;
      if (index === alarmCount - 1) {
        finish();
        return;
      }
      const missed = !handled;
      index++;
      ring();
      if (missed) remark.textContent = t.missed + ' ' + t.rings[index];
    }
    if (!handled) {
      needle.style.left = needlePosition() * 100 + '%';
      if (age >= nextBeep) {
        const pitch = 432 + index * 52;
        tone(pitch, .14, index < 4 ? 'triangle' : 'square', 0, .095);
        if (index >= 2) tone(pitch + 58, .11, 'triangle', .16, .082);
        if (index >= 5) tone(pitch - 87, .09, 'square', .31, .065);
        nextBeep = age + 1.32 - index * .09;
      }
    }
    frame = requestAnimationFrame(tick);
  }

  function finish() {
    mode = 'result';
    cancelAnimationFrame(frame);
    const late = spent === 8;
    const entry = t.grades[late ? 3 : spent < 4 ? 2 : spent >= 6 && points >= 740 ? 0 : 1];
    const finalScore = Math.max(0, points - (late ? 450 : spent < 4 ? 150 : 0));
    if (finalScore > best) {
      best = finalScore;
      try { localStorage.setItem(storageKey + 'best', String(best)); } catch (e) {}
    }
    setMood(late ? 'ouch' : 'sleep', clockTime() + '  /  ' + t.points(finalScore));
    byId('grade').textContent = entry[0];
    byId('punchline').textContent = entry[1];
    byId('record').textContent = t.best(best);
    shareText.hidden = true;
    share.textContent = t.share;
    let url = location.href;
    try {
      if (window.parent !== window) url = window.parent.location.href;
    } catch (e) {
      if (document.referrer) url = document.referrer;
    }
    sharedResult = t.title + ' ⏰ ' + entry[0] + '\n' + clockTime() + ' · ' + t.points(finalScore) + '\n' + entry[1] + '\n' + url;
    play.hidden = true;
    result.hidden = false;
    byId('retry').focus();
    tone(late ? 160 : 440, .28, 'triangle', 0, .12);
    tone(late ? 110 : 659, .34, 'triangle', .15, .10);
  }

  async function shareResult() {
    const currentRound = round;
    const value = sharedResult;
    try {
      if (navigator.share) {
        await navigator.share({ title:t.title, text:value });
        return;
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
    if (mode !== 'result' || round !== currentRound) return;
    try {
      await navigator.clipboard.writeText(value);
      if (mode === 'result' && round === currentRound) share.textContent = t.copied;
    } catch (e) {
      if (mode !== 'result' || round !== currentRound) return;
      shareText.hidden = false;
      shareText.value = value;
      shareText.select();
    }
  }

  function bind(button, action) {
    button.addEventListener('pointerdown', event => {
      if (event.button === 0) event.preventDefault();
    });
    button.addEventListener('click', action);
  }

  bind(byId('start'), start);
  bind(byId('retry'), start);
  bind(snooze, () => choose(true));
  bind(peek, () => choose(false));
  bind(share, shareResult);
  bind(sound, () => {
    muted = !muted;
    unlockAudio();
    updateSound();
    try { localStorage.setItem(storageKey + 'mute', muted ? '1' : '0'); } catch (e) {}
  });
  document.addEventListener('keydown', event => {
    if (event.target.tagName === 'TEXTAREA') return;
    if (event.target.tagName === 'BUTTON' && (event.key === 'Enter' || event.key === ' ')) return;
    const primary = event.key === ' ' || event.key === 'Enter';
    const secondary = event.key === 'ArrowDown';
    if (!primary && !secondary) return;
    event.preventDefault();
    if (event.repeat) return;
    if (mode === 'play') choose(primary);
    else if (primary) start();
  });
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(frame);
    last = null;
    if (!document.hidden && mode === 'play') frame = requestAnimationFrame(tick);
  });

  shareText.setAttribute('aria-label', t.shareField);
  setMood('sleep', t.intro);
  updateSound();
</script>
</body>
</html>
