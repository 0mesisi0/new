<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102d30">
<link rel="icon" href="data:,">
<title></title>
<style>
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body { margin:0; background:#102d30; color:#162f30; font:700 15px/1.3 system-ui,"Malgun Gothic",sans-serif; }
  h1,h2,p,dl,dd { margin:0; }
  main { display:grid; grid-template-rows:auto minmax(0,1fr); width:100vw; max-width:580px; height:100vh; height:100dvh; margin:auto; overflow:hidden; background:#fff2d7; touch-action:none; }
  header { display:flex; align-items:center; gap:10px; justify-content:space-between; padding:9px 13px; background:#15383b; color:#fff2d7; border-bottom:2px solid #0a2629; }
  .heading { min-width:0; }
  .brand { display:flex; align-items:center; gap:6px; margin-bottom:3px; color:#ade3cf; font-size:11px; letter-spacing:.06em; }
  .brand svg { width:15px; height:15px; }
  h1 { font-size:25px; font-size:clamp(20px,5.7vw,34px); line-height:1.08; letter-spacing:-.06em; font-weight:950; }
  .game { display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:7px; min-height:0; padding:8px 11px 11px; }
  .scoreboard { display:grid; grid-template-columns:repeat(4,1fr); background:#163c40; color:#fff0cd; border:2px solid #0d292c; border-radius:9px; text-align:center; overflow:hidden; }
  .scoreboard div { padding:4px 2px 5px; }
  .scoreboard div + div { border-left:1px solid #4d7776; }
  dt { font-size:11px; font-weight:800; }
  .scoreboard dt { color:#b1dacb; }
  .scoreboard dd { font:900 22px/1.03 ui-monospace,monospace; }
  #lives,#count { color:#ffb591; font-size:19px; letter-spacing:2px; white-space:nowrap; }
  #count { color:#a7e4c9; }
  .arena { position:relative; min-height:0; overflow:hidden; background:#174d50; border:2px solid #122f31; border-radius:14px 14px 6px 6px; }
  .arena > svg { display:block; width:100%; height:100%; overflow:visible; }
  .pitch-chip,.replay-chip { position:absolute; z-index:1; top:8px; padding:4px 8px; border:1px solid #99d7c1; border-radius:4px; background:#102d30; color:#e1ffed; font-size:11px; font-weight:850; pointer-events:none; }
  .pitch-chip { left:8px; }
  .replay-chip { right:8px; background:#acecd1; color:#102d30; }
  #call-banner { position:absolute; z-index:1; left:50%; top:13%; transform:translateX(-50%) skew(-7deg); min-width:138px; padding:5px 15px 7px; text-align:center; white-space:nowrap; background:#15383b; color:#fff2d7; border:2px solid #8fc6b6; box-shadow:4px 4px #102d30; }
  #call-banner span,#call-banner strong { display:block; transform:skew(7deg); }
  #call-banner span { font-size:10px; letter-spacing:.08em; }
  #call-banner strong { font-size:27px; line-height:1; font-weight:950; }
  #call-banner[data-call="ball"] { border-color:#ffc19a; }
  .deck { display:grid; gap:7px; min-width:0; }
  #remark { display:flex; align-items:center; min-height:38px; padding:4px 8px; border-left:3px solid #3c8271; background:#f3e3bf; font-size:13px; }
  #remark[data-tone="bad"] { border-color:#a93829; background:#ffdcc7; }
  #remark[data-tone="good"] { background:#d2efdb; }
  .actions,.result-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  button { min-width:44px; min-height:44px; border:2px solid #163638; border-radius:8px; padding:3px 7px; background:#fdf4de; color:#153538; font:850 14px/1.1 system-ui,"Malgun Gothic",sans-serif; cursor:pointer; touch-action:manipulation; }
  button:focus { outline:3px solid #a43c1c; outline-offset:2px; }
  button:focus:not(:focus-visible) { outline:none; }
  button:active { transform:translateY(2px); }
  button:disabled { cursor:default; }
  #sound { flex:0 0 44px; padding:0; background:#254e50; border-color:#8fc6b6; color:#fff2d7; }
  #sound:focus { outline-color:#feca82; }
  #sound svg { width:22px; height:22px; vertical-align:middle; }
  #sound[aria-pressed="false"] .off,#sound[aria-pressed="true"] .on { display:none; }
  .primary,#challenge,#pass { min-height:51px; border-bottom-width:4px; font-size:19px; font-weight:950; }
  .primary { background:#ffd480; }
  .actions { grid-template-columns:2fr 1fr; }
  kbd { font:800 11px/1 ui-monospace,monospace; border:1px solid currentColor; padding:3px 4px; border-radius:3px; }
  #challenge { background:#ffd480; }
  #challenge:disabled,#pass:disabled { background:#f0e4c8; color:#52615a; }
  #pass { font-size:15px; display:flex; align-items:center; justify-content:center; gap:4px; padding:2px 4px; }
  .ring { width:28px; height:28px; flex-shrink:0; }
  #progress { stroke-dasharray:69.1; stroke-dashoffset:69.1; }
  .intro,.result { display:grid; gap:6px; }
  .intro p { font-size:13px; padding:2px 1px; }
  .result { padding:7px; background:#fffaeb; border:2px solid #163638; border-radius:9px; }
  .result h2 { font-weight:950; font-size:22px; line-height:1.08; letter-spacing:-.045em; }
  .result dl { display:grid; grid-template-columns:repeat(4,1fr); text-align:center; padding:4px 0; background:#e4efdb; border-radius:5px; }
  .result dl div + div { border-left:1px solid #b9ceb5; }
  .result dd { font:900 17px/1.13 ui-monospace,monospace; }
  #copy-text { width:100%; min-height:44px; resize:none; font:inherit; }
  .clip-buffer { position:fixed; top:0; left:0; opacity:0; pointer-events:none; }
  #copy-note { font-size:12px; }
  .shake { animation:shake .32s ease-out; }
  .pop { transform-origin:305px 312px; animation:pop .28s ease-out; }
  #throw-arm { transform-origin:207px 148px; transform:rotate(-54deg); }
  #pitcher.released #throw-arm { transform:rotate(0); transition:transform .15s ease-out; }
  #ump-arm path { visibility:hidden; }
  #ump-arm:not([data-call]) .rest-arm,#ump-arm[data-call="strike"] .strike-arm,#ump-arm[data-call="ball"] .ball-arm { visibility:visible; }
  @keyframes shake { 20%,60% { transform:translateX(-4px); } 40%,80% { transform:translateX(4px); } }
  @keyframes pop { 35% { transform:scale(1.24); } }
  @media (min-width:480px) and (orientation:landscape) {
    main { max-width:1040px; }
    .game { grid-template-columns:minmax(0,1.45fr) minmax(215px,1fr); grid-template-rows:auto minmax(0,1fr); gap:9px; }
    .arena { grid-column:1; grid-row:1/3; }
    .scoreboard { grid-column:2; }
    .deck { grid-column:2; align-self:center; }
  }
  @media (max-height:510px) {
    header { padding:5px 10px; }
    .game { padding:5px 8px 8px; gap:5px; }
    .deck { gap:5px; }
    .primary,#challenge,#pass { min-height:46px; }
  }
  @media (max-height:420px) and (orientation:landscape) {
    #call-banner { top:12%; }
    #call-banner strong { font-size:21px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation:none !important; transition:none !important; }
    button:active { transform:none; }
  }
</style>
</head>

  var intro = el('intro'), controls = el('controls'), result = el('result'), remark = el('remark');
  var passButton = el('pass'), challenge = el('challenge'), progress = el('progress');
  var arena = el('arena'), mitt = el('mitt'), arm = el('ump-arm'), baseball = el('baseball'), trail = el('trail');
  var marker = el('marker'), pitchLabel = el('pitch-label'), replayLabel = el('replay-label'), sound = el('sound');
  var zone = el('zone'), batter = el('batter'), heightMarks = el('height-marks'), banner = el('call-banner');
  var thumb = /[?&]thumb=1(?:&|$)/.test(location.search);
  el('copy-text').setAttribute('aria-label', t.share);
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var storageKey = 'strike-ball-challenge:';
  function load(key) {
    try { return localStorage.getItem(storageKey + key); } catch (error) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(storageKey + key, String(value)); } catch (error) {}
  }
  var best = Math.max(0, parseInt(load('best'), 10) || 0), muted = load('mute') === '1', audio;
  var phase = 'intro', elapsed = 0, lastFrame = null, frame = 0;
  var score = 0, streak = 0, longest = 0, lives = 3, charges = 2, attempts = 0, correct = 0;
  var pitch, shareText, particles = [], decisionTime, feedbackTime, revealDot, gameOver;
  var batterScales = [.90, 1, 1.11], batterIndex = 1, batterScale = 1;
  var pitchTypes = [
    { time:810, bendX:3, bendY:-4 },
    { time:1120, bendX:19, bendY:-49 },
    { time:940, bendX:45, bendY:-13 },
    { time:1240, bendX:12, bendY:-25 }
  ];
  var plateRadius = 8;
  var flightEnd = .965;

  function syncSound() {
    sound.setAttribute('aria-pressed', String(muted));
    sound.setAttribute('aria-label', muted ? t.sound : t.muted);
    sound.title = muted ? t.sound : t.muted;
  }
  function unlockAudio() {
    if (muted) return;
    var Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      if (!audio) audio = new Audio();
      if (audio.state === 'suspended') {
        var pending = audio.resume();
        if (pending && pending.catch) pending.catch(function () {});
      }
    } catch (error) {}
  }
  function tone(hz, end, length, volume, shape, delay) {
    var at = audio.currentTime + delay;
    var oscillator = audio.createOscillator(), gain = audio.createGain();
    oscillator.type = shape;
    oscillator.frequency.setValueAtTime(hz, at);
    oscillator.frequency.exponentialRampToValueAtTime(end, at + length);
    gain.gain.setValueAtTime(.001, at);
    gain.gain.linearRampToValueAtTime(volume, at + .019);
    gain.gain.exponentialRampToValueAtTime(.001, at + length);

    gain.connect(audio.destination);
    oscillator.start(at);
    oscillator.stop(at + length);
  }
  function playSound(kind) {
    if (muted || !audio || audio.state !== 'running') return;
    if (kind === 'mitt') tone(128, 47, .095, .24, 'triangle', 0);
    if (kind === 'boo') {
      tone(223, 134, .49, .16, 'sawtooth', .035);
      tone(194, 107, .56, .14, 'triangle', .083);
      tone(148, 92, .47, .14, 'triangle', .14);
      tone(270, 136, .35, .08, 'sine', .18);
    }
    if (kind === 'cheer') {
      tone(440, 505, .12, .10, 'triangle', .04);
      tone(660, 790, .18, .11, 'triangle', .13);
      tone(255, 330, .35, .08, 'sawtooth', 0);
      tone(310, 405, .38, .07, 'triangle', .07);
    }
  }
  function updateStats() {
    el('score').textContent = score;
    el('streak').textContent = streak;
    el('lives').textContent = '◆◆◆'.slice(0, lives) + '◇◇◇'.slice(lives);
    el('lives').setAttribute('aria-label', String(lives));
    el('count').textContent = '●●'.slice(0, charges) + '○○'.slice(charges);
    el('count').setAttribute('aria-label', charges + ' / 2');
  }
  function say(message, mood) {
    remark.textContent = message;
    remark.setAttribute('data-tone', mood || '');
  }
  function animate(node, name) {
    node.classList.remove(name);
    node.getBoundingClientRect();
    node.classList.add(name);
  }
  function showBall(x, y, radius) {
    baseball.setAttribute('transform', 'translate(' + x + ' ' + y + ') scale(' + radius + ')');
  }
  function pitchPoint(fraction) {
    var depth = Math.pow(fraction, 1.42);
    var bend = 5 * depth * Math.pow(1 - depth, 1.35);
    return {
      x:216 + (pitch.x - 216) * depth + pitch.bendX * bend,
      y:146 + (pitch.y - 146) * depth + pitch.bendY * bend
    };
  }
  function drawPitch(fraction) {
    var line = '';
    for (var step = 0; step <= 16; step++) {
      var point = pitchPoint(fraction * step / 16);
      line += (step ? 'L' : 'M') + point.x.toFixed(2) + ' ' + point.y.toFixed(2);
    }
    showBall(point.x, point.y, 2.4 + (plateRadius - 2.4) * fraction * fraction);
    trail.setAttribute('d', line);
  }
  function setBatter(scale) {
    var shift = 355 * (1 - scale);
    batter.setAttribute('transform', 'translate(0 ' + shift + ') scale(1 ' + scale + ')');
    zone.setAttribute('transform', 'translate(0 ' + shift + ') scale(1 ' + scale + ')');
    heightMarks.setAttribute('d', 'M133 ' + (204 * scale + shift) + 'h13 M129 ' + (306 * scale + shift) + 'h17');
  }
  function drawTimer(remaining) {
    progress.style.strokeDashoffset = 69.1 * (1 - remaining);
  }
  function showHero() {
    setBatter(1);
    pitch = { x:263, y:287, bendX:34, bendY:-44, call:'strike' };
    drawPitch(flightEnd);
    if (thumb) {
      intro.hidden = true;
      controls.hidden = false;
      pitchLabel.textContent = t.types[2];
      showCall();
      drawTimer(.74);
    } else pitchLabel.textContent = t.ready;
  }
  function prepare() {
    phase = 'ready';
    elapsed = 0;
    batterIndex = (batterIndex + (Math.random() < .5 ? 1 : 2)) % batterScales.length;
    batterScale = batterScales[batterIndex];
    setBatter(batterScale);
    zone.setAttribute('visibility', 'hidden');
    marker.setAttribute('visibility', 'hidden');
    baseball.setAttribute('visibility', 'hidden');
    replayLabel.hidden = true;
    banner.hidden = true;
    arm.removeAttribute('data-call');
    el('pitcher').classList.remove('released');
    drawTimer(0);
    challenge.disabled = passButton.disabled = true;
    pitchLabel.textContent = t.prepare;
    say(t.watch);
    trail.setAttribute('d', '');
  }
  function deliver() {
    var type = Math.floor(Math.random() * pitchTypes.length);
    var profile = pitchTypes[type];
    var inside = Math.random() < .52, horizontal = Math.random() < .56;
    var difficulty = Math.min(1, score / 165);
    var edge = Math.random() < .49 + .25 * difficulty;
    var sign = Math.random() < .5 ? -1 : 1;
    var top = 355 - 151 * batterScale, bottom = 355 - 49 * batterScale;
    var centerY = (top + bottom) / 2;
    var half = (horizontal ? 45 : (bottom - top) / 2) + plateRadius;
    var margin = edge ? 4 - 2 * difficulty + Math.random() * 10 : 18 + Math.random() * 15;
    var offset = sign * (half + (inside ? -margin : margin));
    var other = (Math.random() * 2 - 1) * 40;
    var x = 200 + (horizontal ? offset : other);
    var y = centerY + (horizontal ? other : offset);
    var dx = Math.max(155 - x, 0, x - 245);
    var dy = Math.max(top - y, 0, y - bottom);
    var actual = dx * dx + dy * dy <= plateRadius * plateRadius;
    var wrong = edge && Math.random() < .31 + .22 * difficulty;
    pitch = {
      x:x, y:y, time:profile.time * (1 - .28 * difficulty), bendX:profile.bendX * sign, bendY:profile.bendY,
      strike:actual, wrong:wrong, call:actual !== wrong ? 'strike' : 'ball'
    };
    elapsed = 0;
    phase = 'flight';
    pitchLabel.textContent = t.types[type];
    el('pitcher').classList.add('released');
    baseball.setAttribute('visibility', 'visible');
    drawPitch(reducedMotion ? flightEnd : 0);
  }
  function celebrate() {
    if (reducedMotion) return;
    var colors = ['#fbd17d','#a7ecd4','#ff9674','#fff4d3'];
    for (var n = 0; n < 30; n++) {
      var square = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      square.setAttribute('width', '5');
      square.setAttribute('height', '8');
      square.setAttribute('fill', colors[n % colors.length]);
      el('confetti').appendChild(square);
      particles.push({ node:square, x:200, y:225, vx:(Math.random() - .5) * 380, vy:-280 - Math.random() * 130, age:0 });
    }
  }
  function moveConfetti(delta) {
    for (var n = particles.length - 1; n >= 0; n--) {
      var piece = particles[n];
      piece.age += delta;
      if (piece.age > 1200) {
        piece.node.parentNode.removeChild(piece.node);
        particles.splice(n, 1);
      } else {
        var sec = delta / 1000;
        piece.x += piece.vx * sec;
        piece.y += piece.vy * sec;
        piece.vy += 720 * sec;
        piece.node.setAttribute('transform', 'translate(' + piece.x + ' ' + piece.y + ') rotate(' + (piece.age / 3 + n * 8) + ')');
      }
    }
  }
  function award(points) {
    score += points;
    if (score > best) {
      best = score;
      save('best', best);
    }
  }
  function showCall() {
    phase = 'choice';
    elapsed = 0;
    decisionTime = 2000 - Math.min(850, score * 5);
    challenge.disabled = charges === 0;
    passButton.disabled = false;
    drawTimer(1);
    arm.setAttribute('data-call', pitch.call);
    banner.setAttribute('data-call', pitch.call);
    el('call-text').textContent = t[pitch.call];
    banner.hidden = false;
    say(charges ? t.decide : t.empty);
    if (!thumb) {
      baseball.setAttribute('visibility', 'hidden');
      animate(mitt, 'pop');
      playSound('mitt');
    }
  }
  function showReplay() {
    var color = pitch.strike ? '#b1fbd6' : '#ffd099';
    revealDot = true;
    zone.setAttribute('visibility', 'visible');
    baseball.setAttribute('visibility', 'hidden');
    marker.setAttribute('stroke', color);
    marker.style.color = color;
    moveReplayDot();
    marker.setAttribute('visibility', 'visible');
    replayLabel.textContent = t.replay + ' · ' + t[pitch.strike ? 'strike' : 'ball'];
    replayLabel.hidden = false;
  }
  function moveReplayDot() {
    var fraction = reducedMotion ? 1 : .78 + .22 * Math.min(1, elapsed / 280);
    var point = pitchPoint(fraction);
    marker.setAttribute('transform', 'translate(' + point.x + ' ' + point.y + ')');
  }
  function decide(challenged) {
    if (phase !== 'choice' || thumb || document.hidden || (challenged && !charges)) return;
    phase = 'feedback';
    elapsed = 0;
    feedbackTime = challenged ? 1250 : (pitch.wrong ? 1000 : 440);
    revealDot = false;
    challenge.disabled = passButton.disabled = true;
    drawTimer(0);
    if (challenged || pitch.wrong) showReplay();
    if (challenged) attempts++;
    if (challenged && pitch.wrong) {
      correct++;
      streak++;
      longest = Math.max(streak, longest);
      var points = 20 + Math.min(streak - 1, 10) * 5;
      award(points);
      say(t.flip + ' · +' + points, 'good');
      playSound('cheer');
      if (streak % 3 === 0) celebrate();
    } else if (challenged) {
      charges--;
      streak = 0;
      say(t.upheld, 'bad');
      animate(arena, 'shake');
      playSound('boo');
    } else if (pitch.wrong) {
      lives--;
      streak = 0;
      say(t.missed, 'bad');
      animate(arena, 'shake');
      gameOver = lives === 0 || charges === 0;
    } else {
      award(2);
      say(t.safe, 'good');
    }
    updateStats();
  }
  function finish() {
    phase = 'over';
    controls.hidden = true;
    result.hidden = false;
    banner.hidden = true;
    var accuracy = (attempts ? Math.round(100 * correct / attempts) : 0);
    var title = t.grades[score >= 165 ? 2 : score >= 65 ? 1 : 0];
    el('grade').textContent = title;
    el('final-score').textContent = score;
    el('final-best').textContent = best;
    el('final-accuracy').textContent = accuracy + '%';
    el('final-streak').textContent = longest;
    el('retry').focus();
    shareText = t.title + ' — ' + title + '\n' + t.score + ' ' + score + ' · ' + t.best + ' ' + best +
      ' · ' + t.accuracy + ' ' + accuracy + '% · ' + t.longest + ' ' + longest;
  }
  function tick(now) {
    frame = 0;
    if (document.hidden) return;
    var delta = lastFrame === null ? 0 : Math.min(50, now - lastFrame);
    lastFrame = now;
    elapsed += delta;
    moveConfetti(delta);
    if (phase === 'ready' && elapsed >= 560) deliver();
    else if (phase === 'flight') {
      if (!reducedMotion) drawPitch(Math.min(flightEnd, flightEnd * elapsed / pitch.time));
      if (elapsed >= pitch.time) showCall();
    } else if (phase === 'choice') {
      drawTimer(Math.max(0, 1 - elapsed / decisionTime));
      if (elapsed >= decisionTime) decide(false);
    } else if (phase === 'feedback') {
      if (revealDot) {
        moveReplayDot();
        if (elapsed >= 280) revealDot = false;
      }
      if (elapsed >= feedbackTime) {
        if (gameOver) finish(); else prepare();
      }
    }
    schedule();
  }
  function schedule() {
    if (!frame && !document.hidden && ((phase !== 'intro' && phase !== 'over') || particles.length)) {
      frame = requestAnimationFrame(tick);
    }
  }
  function start() {
    if ((phase !== 'intro' && phase !== 'over') || document.hidden || thumb) return;
    unlockAudio();
    score = streak = longest = attempts = correct = 0;
    lives = 3;
    charges = 2;
    gameOver = false;
    batterIndex = 1;
    arena.classList.remove('shake');
    mitt.classList.remove('pop');
    particles = [];
    el('confetti').textContent = '';
    el('copy-note').hidden = el('copy-text').hidden = true;
    intro.hidden = result.hidden = true;
    controls.hidden = false;
    updateStats();
    prepare();
    lastFrame = null;
    schedule();
  }
  function bindButton(button, action) {

      button.addEventListener('pointerdown', function (event) {
        if (event.button !== 0 || !event.isPrimary || button.disabled) return;
        event.preventDefault();
      });
      button.addEventListener('pointerup', function (event) {
        if (event.button !== 0 || !event.isPrimary || button.disabled) return;
        action();
      });
      button.addEventListener('click', function (event) {
        if (event.detail === 0) action();
      });
    } else {
      button.addEventListener('click', action);
    }
  }
  bindButton(el('start'), start);
  bindButton(el('retry'), start);
  bindButton(challenge, function () { decide(true); });
  bindButton(passButton, function () { decide(false); });
  bindButton(sound, function () {
    muted = !muted;
    save('mute', muted ? '1' : '0');
    syncSound();
    if (muted && audio && audio.state === 'running') {
      var pending = audio.suspend();
      if (pending && pending.catch) pending.catch(function () {});
    } else if (!muted) unlockAudio();
  });
  el('copy').addEventListener('click', function () {
    var field = el('copy-text'), note = el('copy-note'), copied = false;
    field.value = shareText;
    field.hidden = false;
    field.className = 'clip-buffer';
    field.focus();
    field.select();
    field.setSelectionRange(0, field.value.length);
    try { copied = document.execCommand('copy'); } catch (error) {}
    field.className = '';
    field.hidden = copied;
    note.hidden = false;
    note.textContent = copied ? t.copied : t.manual;
    if (copied) el('copy').focus();
    else {
      field.focus();
      field.select();
      field.setSelectionRange(0, field.value.length);
    }
  });
  document.addEventListener('keydown', function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey || event.target.tagName === 'TEXTAREA') return;
    var key = (event.key || '').toLowerCase();
    if (!key) {
      var oldKeys = { 13:'enter', 32:' ', 67:'c' };
      key = oldKeys[event.keyCode];
    }
    var space = key === ' ' || key === 'spacebar';
    if (key === 'c' && phase === 'choice') {
      event.preventDefault();
      if (!event.repeat) decide(true);
    } else if (space && !controls.hidden && event.target !== sound) {
      event.preventDefault();
      if (!event.repeat) decide(false);
    } else if ((space || key === 'enter') && event.target.tagName !== 'BUTTON' &&
      (phase === 'intro' || phase === 'over')) {
      event.preventDefault();
      if (!event.repeat) start();
    }
  });
  document.addEventListener('visibilitychange', function () {
    lastFrame = null;
    if (document.hidden && frame) {
      cancelAnimationFrame(frame);
      frame = 0;
    } else schedule();
  });
  syncSound();
  updateStats();
  showHero();
}());
</script>

</html>
