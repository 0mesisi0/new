<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>겨울 간식 사다리</title>
<style>
*{box-sizing:border-box}
:root{--ink:#39271f;--cream:#fff4de;--paper:#fffcf5;--red:#943e2e;--green:#315a4a;--gold:#d88a16;--night:#193b3b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);-webkit-text-size-adjust:100%}
#app{position:relative;isolation:isolate;width:100vw;height:100vh;height:100dvh;display:flex;justify-content:center;overflow:hidden;background:linear-gradient(155deg,#193b3b,#315a4a 65%,#78918a);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.street{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.col{--rail-gap:6px;width:min(100%,480px);height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;padding:10px 12px;background:radial-gradient(ellipse at top,#fffcf2,var(--cream) 73%);box-shadow:0 0 0 2px var(--ink),0 0 55px #122d30a6}
header{position:relative;isolation:isolate;display:grid;place-items:center;min-height:68px;margin:2px 0 3px;padding:4px 38px 13px;color:var(--paper);text-align:center;background:var(--red);border:3px solid var(--ink);border-radius:12px 12px 5px 5px;box-shadow:inset 0 0 0 3px #e19a6d,0 3px 0 var(--ink)}
header::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-4px;height:15px;border:2px solid var(--ink);border-radius:3px 3px 8px 8px;background:repeating-linear-gradient(110deg,#f8d6a0 0 17px,#c45943 17px 34px)}
.sign-star{position:absolute;width:23px;height:23px;top:calc(50% - 15px)}
.sign-star:first-child{left:12px}.sign-star:last-child{right:12px}
h1,h2,p{margin:0}
h1{font-size:clamp(22px,6.6vw,34px);font-weight:950;letter-spacing:-.06em;line-height:1.02;text-wrap:balance;text-shadow:0 2px #6c2e26}
h2{font-size:21px;line-height:1.2;letter-spacing:-.035em;font-weight:850}
.sub{font-size:14px;line-height:1.25;text-align:center}
.hint{font-weight:750}
.summary{color:#5a4133;text-wrap:pretty}
.card,.tasting-card{flex-shrink:0}
#main{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:5px}
footer,#act{display:grid;gap:6px}
#act:empty{display:none}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.btn{min-height:46px;padding:6px 10px;border-radius:6px;border:2px solid var(--ink);background:#ffe9bd;font-size:16px;font-weight:800;line-height:1.2;box-shadow:0 3px 0 var(--ink)}
.btn:active:not(:disabled),.tg:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn.big{min-height:50px;font-size:18px}
#st{min-height:1.3em;font-size:14px;line-height:1.3;text-align:center;color:var(--green);font-weight:650}
#main:not(.edit):not(.result)+footer #st:empty{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.stage{flex:1 0 auto;min-height:0;position:relative;isolation:isolate;display:grid;grid-template-rows:auto minmax(76px,1fr) auto;gap:3px;padding:5px 7px 7px;border:3px solid var(--ink);border-radius:10px 10px 6px 6px;background:linear-gradient(#204744,#315a4a);box-shadow:0 3px 0 #a87751,inset 0 0 0 2px #638578}
.stage-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.stall-keeper{position:absolute;right:12%;bottom:16%;width:clamp(70px,25%,124px);height:auto;pointer-events:none;z-index:-1}
.stage .window-snow{opacity:.7}
.bags,.slots{display:grid;gap:var(--rail-gap)}
.bag{position:relative;min-width:48px;min-height:48px;height:clamp(54px,11dvh,76px);width:100%;max-width:88px;margin:0 auto;border:0;background:none;padding:0}
.bag svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 95%}
.bag b{position:absolute;inset:50% 0 auto;font-size:17px;line-height:1;font-weight:900}
@media(hover:hover){.bag:not([aria-disabled=true]):hover svg{transform:rotate(-5deg) translateY(-2px)}}
.bag:not([aria-disabled=true]):active svg{transform:scale(.94,.88)}
.bag.sel svg{animation:bag-drop .37s ease-out}
.bag.sel .seal{fill:#ffd56c}
.bag[aria-disabled=true]{cursor:default}
@keyframes bag-drop{0%{transform:translateY(-5px) scale(.94,1.04)}40%{transform:translateY(2px) scale(1.15,.84)}70%{transform:scale(.94,1.09)}}
#lad{position:relative;min-height:0;touch-action:none}
#lad svg{position:absolute;left:0;top:0;display:block;overflow:visible}
.ladder-rail{stroke:#e5b879}
.ladder-rung{stroke:#cf9d6c}
.route-ember{filter:drop-shadow(0 0 4px #ffcb4b)}
.slot{min-height:43px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 1px;border-radius:4px 4px 9px 9px;border:2px solid #a87952;background:#fff4de;font-size:13px;line-height:1.08;text-align:center;font-weight:750;overflow-wrap:anywhere}
.slot svg{width:28px;height:28px;flex:none}
.slot.cov{background:repeating-linear-gradient(135deg,#fff4de 0 6px,#f8e1b4 6px 8px);border:2px dashed #805337;justify-content:center;font-size:19px;font-weight:900}
.slot.win{color:#4c2d1f;background:#ffdf83;border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.slot.pop{animation:slot-pop .45s ease-out}
@keyframes slot-pop{35%{transform:scale(1.08,.88)}65%{transform:scale(.98,1.09)}}

.result .stage{flex:1 0 auto;grid-template-rows:auto minmax(65px,1fr) auto}
.result #rh{position:relative;z-index:1;align-self:center;padding:2px 14px;color:var(--paper);background:var(--green);border:2px solid var(--ink);border-radius:4px;box-shadow:0 2px var(--ink);transform:rotate(-2deg);margin-bottom:-14px}
.card{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,43%) minmax(0,1fr);align-items:center;min-height:clamp(114px,27dvh,194px);gap:8px;overflow:hidden;padding:13px 12px 8px;border:3px solid var(--ink);border-radius:10px 10px 23px 11px;background:radial-gradient(ellipse at 20% 45%,#ffe384,#ffd984 45%,#eda65f);box-shadow:0 4px 0 #874932}
.card::before{content:"";position:absolute;inset:4px;z-index:-1;border:1px dashed #a55235;border-radius:6px 6px 18px 8px}
.card .ill{position:relative;display:grid;place-items:center;min-width:0;height:clamp(90px,23dvh,156px)}
.ill .liner,.ill .food{position:absolute;height:100%;width:100%;overflow:visible}
.ill .food{width:84%;height:87%;transform:translateY(-3%) rotate(-9deg);transform-origin:center 70%;filter:drop-shadow(3px 5px 0 #8e492757)}
.card.fresh .food{animation:serve .6s cubic-bezier(.2,.7,.28,1)}
@keyframes serve{0%{transform:translateY(12%) scale(.65,.55) rotate(-20deg)}30%{transform:translateY(-18%) scale(.9,1.12) rotate(4deg)}58%{transform:translateY(1%) scale(1.12,.88) rotate(-11deg)}}
.card .nm{font-size:clamp(24px,6.1vw,39px);font-weight:950;line-height:.99;letter-spacing:-.07em;text-wrap:balance}
.card .cp{font-size:14px;font-weight:650;line-height:1.25;margin-top:6px;text-wrap:pretty}
.steam{fill:none;stroke:#fff9dc;stroke-width:3;stroke-linecap:round}
.card.fresh .steam{animation:steam-rise .92s ease-out}
@keyframes steam-rise{0%{opacity:0;transform:translateY(9px)}55%{opacity:1;transform:translateY(-4px)}}
.spark{position:absolute;z-index:2;left:21%;top:48%;width:var(--s);height:var(--s);opacity:0;pointer-events:none;animation:scatter .65s cubic-bezier(.12,.65,.34,1) both}
@keyframes scatter{12%{opacity:1}73%{opacity:.95}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(90deg) scale(.38)}}
.pill{z-index:1;justify-self:start;background:var(--green);border:1px solid var(--ink);color:#fff;font-size:14px;font-weight:750;border-radius:4px;padding:1px 9px}

.tasting-card{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 7px;border:1px dashed #885942;border-radius:5px;background:#fffaf0;color:#533626;font-size:14px;font-weight:750;line-height:1.14}
.tasting-card.complete{border-style:solid;border-color:var(--green);color:#234c3c;background:#edf0dc}
.stamps{display:flex;gap:4px;flex:none}
.stamp{display:grid;place-items:center;width:27px;height:25px;border:1px dashed #976f50;border-radius:50%;background:#f1e3cb}
.stamp svg{width:22px;height:22px}
.stamp:not(.visited) svg{opacity:.32;filter:grayscale(1)}
.stamp.visited{background:#ffdc84;border:1px solid #875734}
.stamp.new{animation:stamp-in .44s .12s backwards}
@keyframes stamp-in{0%{transform:scale(1.65) rotate(-16deg);opacity:.4}70%{transform:scale(.9) rotate(5deg)}}

.edit h2,.copy h2{color:var(--red);margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tg{position:relative;min-height:65px;display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:9px;border:2px solid var(--ink);background:var(--paper);font-size:16px;font-weight:750;text-align:left;line-height:1.12;box-shadow:0 2px #986b4b}
.tg svg{width:36px;height:36px;flex:none}
.tg i{display:none;position:absolute;right:-4px;top:-5px;border:2px solid var(--ink);font-style:normal;color:#fff;background:var(--green);border-radius:50%;width:20px;height:20px;line-height:16px;text-align:center;font-size:13px}
.tg[aria-pressed=true]{background:#ffe5aa;box-shadow:inset 0 0 0 2px var(--ink)}
.tg[aria-pressed=true] i{display:block}
.cnt{font-size:14px;font-weight:750;color:var(--green)}
textarea{width:100%;min-height:125px;flex:1 1 auto;border:2px solid var(--ink);border-radius:6px;padding:10px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink);resize:none}
h2:focus{outline:none}
.awake .eyes{transform-box:fill-box;transform-origin:center;animation:blink-once 1.5s both}
.awake .keeper-steam{animation:steam-rise 1.5s ease-out both}
@keyframes blink-once{48%,63%{transform:scaleY(1)}55%{transform:scaleY(.12)}}
body.suspended *{animation-play-state:paused!important}
@media(max-width:360px){html[lang=en] .summary{margin-inline:-5px;letter-spacing:-.04em}}
@media(max-height:560px){
  .col{--rail-gap:4px;gap:4px;padding:6px 12px}
  header{min-height:46px;padding:3px 29px 10px;margin:0 0 2px}
  header::after{height:10px}.sign-star{width:16px;height:16px;top:calc(50% - 10px)}
  .sign-star:first-child{left:7px}.sign-star:last-child{right:7px}
  h1{font-size:22px}
  #main{gap:5px;padding:4px}
  h2{font-size:16px}
  .stage{padding:3px 4px 4px}
  .bag{height:48px}
  .result .stage{grid-template-rows:auto minmax(52px,1fr) auto;gap:2px}
  .slot{min-height:33px;font-size:12px}.slot svg{width:18px;height:18px}
  .result #rh{margin-bottom:-22px;padding-block:0}
  .result .pill{line-height:1.1}
  .result .slot svg{width:16px;height:16px}
  .card{min-height:84px;gap:5px;padding:13px 8px 4px;grid-template-columns:minmax(0,32%) minmax(0,1fr)}
  .card .ill{height:60px}
  .card .nm{font-size:22px;text-wrap:wrap}
  .card .cp{line-height:1.16;margin-top:3px;text-wrap:wrap}
  .stamp{width:23px;height:22px}.stamp svg{width:19px;height:19px}
  .tg{min-height:57px}.tg svg{width:26px;height:26px}
  .btn,.btn.big{min-height:44px;font-size:16px}
  footer,#act{gap:4px}
  #main.edit+footer #st{min-height:2.6em}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

};
function icon(id,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 120 120" aria-hidden="true" focusable="false"><g stroke="#3b2418" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">'+ART[id]+'</g></svg>'}

var DEMO=location.hash==='#demo'||new URLSearchParams(location.search).get('thumb')==='1';
function loadCands(){
  if(DEMO)return DEF.slice();
  try{
    var a=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(a)&&a.length>=2&&a.length<=4&&new Set(a).size===a.length&&a.every(function(x){return POOL.indexOf(x)>=0}))
      return POOL.filter(function(x){return a.indexOf(x)>=0});
  }catch(e){}
  return DEF.slice();
}
function saveCands(c){try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}

function rnd(n){
  try{
    var lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);
    do{crypto.getRandomValues(a)}while(a[0]>=lim);
    return a[0]%n;
  }catch(e){return Math.floor(Math.random()*n)}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function step(pos,p){return pos===p?p+1:pos===p+1?p:pos}

var DUR=1600;
var cands=loadCands(),view='ready',prev='ready',draft=[],draw=null;
var stamps=new Set();
var elapsed=0,last=0,raf=0,copying=null,ct=0,trail=null;
var $=function(s){return document.querySelector(s)};
var main=$('#main'),act=$('#act'),status=$('#st'),announcement=$('#announcement');
$('#ttl').textContent=L.appTitle;
var rmq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};

function setStatus(t){clearTimeout(ct);status.textContent=t||''}

function startDraw(bag){
  if(view!=='ready'||bag<0||bag>=cands.length)return;
  view='draw';
  var N=cands.length,rows=[];
  for(var k=0;k<12;k++)rows.push(rnd(N-1));
  setDraw(bag,rows,shuffle(cands.slice()));
  elapsed=0;
  if(rmq.matches){finish(false);return}
  render('.bag.sel');
  announcement.textContent=L.drawing;
  run();
}
function setDraw(bag,rows,bottom){
  var pos=bag;rows.forEach(function(p){pos=step(pos,p)});
  draw={bag:bag,rows:rows,bottom:bottom,end:pos,win:bottom[pos],pop:false};
}
function finish(anim){
  if(raf){cancelAnimationFrame(raf);raf=0}
  draw.stamped=!stamps.has(draw.win);
  stamps.add(draw.win);
  view='result';draw.pop=anim;
  render('#rh');
  announcement.textContent=f(L.resultAnnouncement,{n:draw.bag+1,snack:L.names[draw.win]})
    +(draw.stamped&&stamps.size===cands.length?' '+L.tastingComplete:'');
  draw.pop=false;
}
function tick(t){
  raf=0;
  if(view!=='draw'||document.hidden)return;
  var dt=last?Math.min(50,t-last):0;last=t;elapsed+=dt;
  if(elapsed>=DUR){finish(true);return}
  paintTrail();
  raf=requestAnimationFrame(tick);
}
function run(){if(raf||view!=='draw'||document.hidden)return;last=0;raf=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',function(){
  document.body.classList.toggle('suspended',document.hidden);
  if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0}}else run();
});
document.body.classList.toggle('suspended',document.hidden);
if(rmq.addEventListener)rmq.addEventListener('change',function(){if(rmq.matches&&view==='draw')finish(false)});
window.addEventListener('resize',ladder);

var STAR='<path d="m10 1 2.5 6.5L19 10l-6.5 2.5L10 19l-2.5-6.5L1 10l6.5-2.5Z" fill="#fff6cf" stroke="#9d572c" stroke-width="1.5" stroke-linejoin="round"/>';
var WINDOW_ART=`<svg class="stage-art" viewBox="0 0 400 170" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <path d="M0 126 55 98l36 12 58-34 48 35 39-13 58 25 58-29 48 26v50H0Z" fill="#497468"/>
  <path d="M0 151q66-31 136-11t133-1q69-20 131 6v25H0Z" fill="#659083"/>
  <g fill="#a8c5b1" class="window-snow"><circle cx="28" cy="35" r="1.7"/><circle cx="81" cy="58" r="1.2"/><circle cx="104" cy="21" r="1.5"/><circle cx="147" cy="44" r="2"/><circle cx="183" cy="74" r="1.4"/><circle cx="218" cy="25" r="1.6"/><circle cx="273" cy="48" r="2"/><circle cx="315" cy="79" r="1.5"/><circle cx="359" cy="28" r="1.6"/><circle cx="382" cy="66" r="2"/><path d="M30 80v10m-5-5h10m230-58v8m-4-4h8m85 52v12m-6-6h12" fill="none" stroke="#a8c5b1" stroke-width="1.5"/></g>
</svg>`;
var KEEPER=`<svg class="stall-keeper" viewBox="0 0 126 109" aria-hidden="true" focusable="false">
  <g stroke="#39271f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

</svg>`;
var LINER=`<svg class="liner" viewBox="0 0 140 120" aria-hidden="true" focusable="false">
  <path d="M10 43 36 25l85 7 12 52-23 24-88-9Z" fill="#a75836" opacity=".42"/>
  <path d="m5 37 30-18 88 6 12 54-25 23-88-9Z" fill="#fff7db" stroke="#77422c" stroke-width="2.5" stroke-linejoin="round"/>

function bagSvg(){return `<svg viewBox="0 0 69 73" aria-hidden="true" focusable="false">
  <g stroke="#39271f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 22 17 9l38-2 7 13 3 43-9 6-49-1-3-6Z" fill="#e5b879"/>
    <path d="m50 21 12-1 3 43-9 6-4-7Z" fill="#b97b4c"/>

    <path class="seal" d="M15 37q0-5 5-6l25 1 3 4-1 19-4 4-23-1-5-4Z" fill="#fff2c7" stroke="#995a3d" stroke-width="1.7"/>
    <path d="m17 63 13 1m4 0 5-1" fill="none" stroke="#ad744c" stroke-width="1.7"/>
  </g>
</svg>`}

function ladder(){
  trail=null;
  var lad=$('#lad');if(!lad)return;
  var w=lad.clientWidth,h=lad.clientHeight;if(!w||!h)return;
  var N=cands.length,cm=h<150,rw=h<80?2.5:cm?3:4;
  var xs=[],ys=[],k;
  var cs=lad.nextElementSibling.children,lr=lad.getBoundingClientRect();
  for(k=0;k<N;k++){
    var cr=cs[k].getBoundingClientRect();
    xs.push(cr.left+cr.width/2-lr.left);
  }
  var inset=h<80?5:cm?9:11;
  for(k=0;k<12;k++)ys.push(inset+(k+.5)*(h-2*inset)/12);
  var s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" '+(view==='ready'?'role="img" aria-label="'+L.readyDiagramLabel+'"':view==='result'?'role="img" aria-label="'+f(L.resultDiagramLabel,{n:draw.bag+1,snack:L.names[draw.win]})+'"':'aria-hidden="true"')+'><g stroke="#39271F" stroke-linecap="round" fill="none">';
  xs.forEach(function(x){s+='<line class="ladder-rail" x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke-width="'+rw+'"/>'});
  if(draw){
    draw.rows.forEach(function(p,i){s+='<line class="ladder-rung" x1="'+xs[p]+'" y1="'+ys[i]+'" x2="'+xs[p+1]+'" y2="'+ys[i]+'" stroke-width="'+rw+'"/>'});
    var pos=draw.bag,pts=[[xs[pos],inset]];
    draw.rows.forEach(function(p,i){pts.push([xs[pos],ys[i]]);pos=step(pos,p);pts.push([xs[pos],ys[i]])});
    pts.push([xs[pos],h-inset]);
    var d='M'+pts.map(function(p){return p[0]+' '+p[1]}).join(' L');
    s+='<path class="trail" d="'+d+'" pathLength="1000" stroke-width="'+(cm?7:11)+'" stroke-linejoin="round"/>';
    s+='<path class="trail" d="'+d+'" pathLength="1000" stroke="#D88A16" stroke-width="'+(cm?4:7)+'" stroke-linejoin="round"/>';
    s+='<circle class="route-ember" r="'+(cm?6:9)+'" fill="#fff0a6" stroke-width="2.5"/>';
  }
  lad.innerHTML=s+'</g></svg>';
  if(draw){
    var paths=lad.querySelectorAll('.trail');
    trail={paths:paths,marker:lad.querySelector('circle'),length:paths[0].getTotalLength()};
    paintTrail();
  }
}
function paintTrail(){
  if(!trail)return;
  var progress=view==='draw'?elapsed/DUR:1;
  var point=trail.paths[0].getPointAtLength(progress*trail.length);
  var dash=(progress*1000)+' 1000';
  trail.paths.forEach(function(path){path.setAttribute('stroke-dasharray',dash)});
  trail.marker.setAttribute('cx',point.x);
  trail.marker.setAttribute('cy',point.y);
}

function slotsHtml(){
  var N=cands.length,s='<div class="slots" style="grid-template-columns:repeat('+N+',minmax(0,1fr))">';
  for(var i=0;i<N;i++){
    if(view==='ready')s+='<div class="slot cov" role="img" aria-label="'+L.coveredSlotLabel+'">'+L.coveredMark+'</div>';
    else{var id=draw.bottom[i],win=view==='result'&&i===draw.end;
      var shortName=L.slotNames&&L.slotNames[id];
      var label=shortName?'<span aria-hidden="true">'+shortName+'</span><span class="sr-only">'+L.names[id]+'</span>':'<span>'+L.names[id]+'</span>';
      s+='<div class="slot'+(win?' win'+(draw.pop?' pop':''):'')+'">'+icon(id)+label+'</div>'}
  }
  return s+'</div>';
}
function bagsHtml(){
  var N=cands.length,s='<div class="bags" style="grid-template-columns:repeat('+N+',minmax(0,1fr))">';
  for(var i=0;i<N;i++){
    var sel=view==='draw'&&draw.bag===i;
    s+='<button class="bag'+(sel?' sel':'')+'" data-act="bag" data-i="'+i+'"'+(view==='draw'?' aria-disabled="true" tabindex="-1"':'')+' aria-label="'+f(L.bagLabel,{n:i+1})+'">'+bagSvg()+'<b>'+f(L.bagNumber,{n:i+1})+'</b></button>';
  }
  return s+'</div>';
}
function stageHtml(top){
  return '<div class="stage'+(view==='ready'?' awake':'')+'">'+WINDOW_ART
    +(view==='result'?'':KEEPER)+top+'<div id="lad"></div>'+slotsHtml()+'</div>';
}
function resultCard(){
  var sparks='';
  if(draw.pop){
    var burst=[[-47,-28,11],[-35,21,7],[-16,-41,8],[17,-46,12],[43,-24,8],[55,5,12],[28,34,8],[-3,37,6]];
    sparks=burst.map(function(p){
      return '<svg class="spark" viewBox="0 0 20 20" style="--x:'+p[0]+'px;--y:'+p[1]+'px;--s:'+p[2]+'px" aria-hidden="true" focusable="false">'+STAR+'</svg>';
    }).join('');
  }
  return '<div class="card'+(draw.pop?' fresh':'')+'">'+sparks+'<div class="ill">'+LINER+icon(draw.win,'food')+'</div>'
    +'<div><div class="nm">'+L.names[draw.win]+'</div><div class="cp">'+L.caps[draw.win]+'</div></div></div>';
}
function tastingCard(){
  var complete=stamps.size===cands.length;
  var label=complete?L.tastingComplete:f(L.tasting,{n:stamps.size,total:cands.length});
  var icons=cands.map(function(id){
    var visited=stamps.has(id),fresh=draw&&draw.pop&&draw.stamped&&id===draw.win;
    return '<span class="stamp'+(visited?' visited':'')+(fresh?' new':'')+'" role="img" aria-label="'
      +f(visited?L.stamped:L.unstamped,{snack:L.names[id]})+'">'+icon(id)+'</span>';
  }).join('');
  return '<div class="tasting-card'+(complete?' complete':'')+'"><span>'+label+'</span><div class="stamps">'+icons+'</div></div>';
}
function btn(a,t,c,x){return '<button class="btn '+(c||'')+'" data-act="'+a+'"'+(x||'')+'>'+t+'</button>'}
function shareText(){
  return f(L.share,{snack:L.names[draw.win],n:draw.bag+1,caption:L.caps[draw.win]});
}

function render(focus){
  copying=null;
  announcement.textContent='';
  setStatus('');
  var m='',a='';
  if(view==='ready'||view==='draw'){
    m=view==='ready'?'<p class="sub hint">'+L.readyHint+'</p>':'<p class="sub hint" aria-hidden="true">'+L.drawing+'</p>';
    if(view==='ready')m+='<p class="sub summary">'+f(L.candidateSummary,{names:cands.map(function(c){return L.names[c]}).join(' · ')})+'</p>';
    m+=stageHtml(bagsHtml());
    if(view==='ready')a=btn('edit',L.changeSnacks);
  }else if(view==='result'){
    m='<h2 id="rh" tabindex="-1">'+L.resultHeading+'</h2>'+resultCard()
      +stageHtml('<div class="pill">'+f(L.chosenBag,{n:draw.bag+1})+'</div>')+tastingCard();
    a='<div class="row">'+btn('copy',L.copy)+btn('again',L.again,'pri big')+'</div>'+btn('edit',L.changeSnacks);
  }else if(view==='edit'){
    m='<h2 id="editor-title" tabindex="-1" aria-describedby="editor-hint">'+L.editorTitle+'</h2><p id="editor-hint" class="sub" style="text-align:left">'+L.editorHint+'</p><p class="cnt" id="cnt"></p><div class="grid">';
    POOL.forEach(function(id){m+='<button class="tg" data-act="tg" data-id="'+id+'" aria-pressed="false">'+icon(id)+'<span>'+L.names[id]+'</span><i aria-hidden="true">✓</i></button>'});
    m+='</div>';
    a='<div class="row">'+btn('back',L.back)+btn('apply',L.applySelection,'pri',' id="ap"')+'</div>';
  }else{
    m='<h2>'+L.copyFallbackTitle+'</h2><p class="sub" style="text-align:left">'+L.copyFallbackHint+'</p><textarea id="ta" readonly aria-label="'+L.shareTextLabel+'"></textarea>';
    a=btn('back-result',L.backToResult,'pri');
  }
  main.className=view;
  main.innerHTML=m;
  act.innerHTML=a;
  if(view==='edit')syncEdit();
  if(view==='copy')$('#ta').value=shareText();
  ladder();
  if(focus){var el=$(focus);if(el){el.focus();if(focus==='#ta'){el.select();try{el.setSelectionRange(0,el.value.length)}catch(e){}}}}
}
function syncEdit(){
  document.querySelectorAll('.tg').forEach(function(b){b.setAttribute('aria-pressed',draft.indexOf(b.dataset.id)>=0?'true':'false')});
  $('#cnt').textContent=f(L.selectionCount,{n:draft.length});
  $('#ap').disabled=draft.length<2;
}
function toggle(id){
  var i=draft.indexOf(id);
  if(i>=0){draft.splice(i,1);syncEdit();setStatus(draft.length<2?L.selectionMin:'')}
  else if(draft.length>=4){setStatus(L.selectionMax)}
  else{draft.push(id);syncEdit();setStatus(draft.length<2?L.selectionMin:'')}
}
function openEdit(){
  if(view!=='ready'&&view!=='result')return;
  prev=view;draft=cands.slice();view='edit';render('#editor-title');
}
function backEdit(){
  if(view!=='edit')return;
  view=prev;render('[data-act=edit]');
}
function apply(){
  if(view!=='edit'||draft.length<2)return;
  cands=POOL.filter(function(x){return draft.indexOf(x)>=0});
  stamps.forEach(function(id){if(cands.indexOf(id)<0)stamps.delete(id)});
  saveCands(cands);draw=null;view='ready';render('.bag');
}
function again(){if(view!=='result')return;draw=null;view='ready';render('.bag')}
function fallback(){view='copy';render('#ta')}
function copy(){
  if(copying||view!=='result')return;
  var p;
  try{p=navigator.clipboard.writeText(shareText())}catch(e){fallback();return}
  copying=p;
  p.then(function(){
    if(copying!==p)return;
    copying=null;
    setStatus(L.copied);
    ct=setTimeout(function(){setStatus('')},2500);
  },function(){
    if(copying===p)fallback();
  });
}
function backResult(){if(view!=='copy')return;view='result';render('[data-act=copy]')}

document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='bag')startDraw(+b.dataset.i);
  else if(a==='edit')openEdit();
  else if(a==='tg')toggle(b.dataset.id);
  else if(a==='back')backEdit();
  else if(a==='apply')apply();
  else if(a==='again')again();
  else if(a==='copy')copy();
  else if(a==='back-result')backResult();
});
document.addEventListener('keydown',function(e){
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(k==='Escape'&&view==='copy'){e.preventDefault();backResult();return}
  if(e.target&&e.target.tagName==='TEXTAREA')return;
  if(k==='Escape'){
    if(view==='edit'){e.preventDefault();backEdit()}
  }else if(view==='ready'&&/^[1-4]$/.test(k)){
    if(+k<=cands.length){e.preventDefault();startDraw(+k-1)}
  }else if(view==='result'){
    if(k==='r'||k==='R'){e.preventDefault();again()}
    else if(k==='c'||k==='C'){e.preventDefault();copy()}
  }
});

if(DEMO){
  setDraw(1,[0,1,2,1,0,2,1,0,2,1,0,2],DEF.slice());
  stamps.add(draw.win);
  view='result';
}
render();
})();
</script>
