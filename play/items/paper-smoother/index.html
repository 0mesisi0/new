<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='2' fill='%23D9EDF0'/%3E%3Cpath d='M2 12Q7 8 12 12T22 12V18Q22 20 20 20H4Q2 20 2 18Z' fill='%233A7D84'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:#292A25;font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 0%,#fff9e9,transparent 65%),repeating-linear-gradient(2deg,#35271908 0 1px,transparent 1px 5px),#F4F0E8}
.shell{width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr);place-items:center;overflow:auto}
.col{--mat:#205651;--mat-deep:#103936;--ink:#292A25;--accent:#a03f28;--glint:#f7d082;
 width:100%;max-width:440px;height:100%;max-height:660px;display:flex;flex-direction:column;gap:10px;padding:16px}
.col[data-paper=rain]{--mat:#514664;--mat-deep:#302844;--accent:#694582;--glint:#efd3ff}
.col[data-paper=ginkgo]{--mat:#665020;--mat-deep:#3a2f18;--accent:#8b4b1b;--glint:#ffdf80}
.heading{position:relative;padding-top:9px;border-top:2px solid var(--ink)}
.heading::before{content:"";position:absolute;top:-4px;left:0;width:49px;height:6px;background:var(--accent)}
h1{margin:0;font-size:clamp(28px,8.9vw,45px);line-height:1.05;font-weight:950;letter-spacing:-.075em}
:lang(ko) h1{letter-spacing:-.09em}
#inst{height:2.6em;margin:5px 0 0;display:flex;align-items:center;font-size:14px;line-height:1.3;font-weight:560}
#inst.fin{color:var(--accent);font-weight:760}
.choose{display:flex;gap:7px;width:100%}
.choose button{flex:1 1 0;min-width:44px;min-height:46px;padding:4px;border:1px solid #827561;border-radius:5px;background:#fff9e9;color:inherit;font:inherit;font-size:13px;font-weight:750;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.choose button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),0 2px 0 var(--ink);background:var(--paper)}
.swatch{position:relative;flex:none;display:grid;place-items:center;width:23px;height:22px;border:1px solid currentColor;border-radius:3px;background:var(--paper);color:#292A25}
.swatch svg{width:16px;height:16px;display:block}
.ck{display:none;font-weight:900}
[aria-pressed=true] .swatch svg{display:none}
[aria-pressed=true] .ck{display:block}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.area{flex:1 1 0;min-height:208px;width:100%;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;padding-top:56px}
.mat{position:absolute;inset:0;z-index:-2;border:1px solid var(--mat-deep);border-radius:11px;overflow:hidden;background:
 radial-gradient(ellipse at 48% 31%,#fff3c214,transparent 70%),
 repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 16px),
 repeating-linear-gradient(90deg,#fff1 0 1px,transparent 1px 16px),var(--mat);
 box-shadow:inset 0 0 0 4px #fff1,inset 0 0 26px #1816124a,0 4px 0 var(--mat-deep),0 8px 13px #342c1a24}
.mat::before,.mat::after{content:"";position:absolute;inset:7px;border:1px solid #fff4;border-radius:6px}
.mat::after{inset:11px;border-style:dotted;border-color:#fff3}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:11px}
.cat{position:absolute;width:94px;height:83px;left:9%;bottom:calc(50% + var(--half-sheet) - 32px);overflow:visible;filter:drop-shadow(2px 4px 0 #18272765);animation:breathe 4.8s ease-in-out infinite;transform-origin:bottom center}
.eyes{transform-origin:0 44px;animation:blink 6s linear infinite}
.smile,.happy{display:none}
.area[data-stage="1"] .smile,.area[data-stage="2"] .smile,.area[data-stage="3"] .happy{display:block}
.area[data-stage="3"] .eyes,.area[data-stage="3"] .mouth{display:none}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035) translateY(-2px)}}
@keyframes blink{0%,44%,49%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.1)}}
.tools{position:absolute;width:103px;height:56px;right:8%;bottom:calc(50% + var(--half-sheet) - 22px);filter:drop-shadow(3px 4px 0 #18272765)}
.dust{position:absolute;inset:0;color:var(--glint)}
.dust i{position:absolute;width:4px;height:4px;left:var(--x);top:var(--y);background:currentColor;opacity:.55;transform:rotate(45deg);animation:drift 5s ease-in-out infinite alternate;animation-delay:var(--delay)}
@keyframes drift{to{opacity:.95;transform:translate(5px,-8px) rotate(115deg)}}
#sheet{position:relative;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));width:176px;height:132px;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;--base:#D9EDF0;box-shadow:0 0 0 1px #292A25,0 3px 0 #e1cba4,0 14px 21px #1a191975}
#sheet.done{box-shadow:0 0 0 1px #292A25,0 3px 0 #e1cba4,0 0 0 5px #ffefbd59,0 14px 21px #1a191975}
#art{position:absolute;inset:0;pointer-events:none}
#art svg{width:100%;height:100%;display:block}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-height:0}
.row > div{position:relative}
.cell{display:block;position:relative;width:100%;height:100%;padding:0;border:0;overflow:hidden;background:none;cursor:pointer}
.cell::before{content:"";position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(var(--l),transparent 47%,#37292257 48.5%,#fff9edcf 50.5%,transparent 53%),
 linear-gradient(var(--l2),transparent 59%,#3b2f3140 60.5%,#fffbedaa 62%,transparent 65%),
 conic-gradient(from var(--r) at var(--x) var(--y),#fffc 0 15%,#3b2f3138 15% 38%,#fffc 38% 50%,#fff2 50% 66%,#382d3750 66% 83%,#fff5 83% 100%),var(--base);
 box-shadow:inset 0 0 0 1px #42392e37}
.cell.on::before{opacity:0;transition:opacity .12s}
.cell.on::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,#fff7deea,transparent 70%);animation:press .34s ease-out both}
@keyframes press{0%{opacity:.95;transform:scale(.44,.7)}40%{transform:scale(1.36,.82)}100%{opacity:0;transform:scale(1.2,1.2)}}
.row > div:has(.cell:focus-visible){z-index:1}
.row > div:has(.cell:focus-visible)::after{content:"";position:absolute;inset:0;pointer-events:none;outline:3px solid #292A25;outline-offset:-3px;box-shadow:inset 0 0 0 5px #fff}
.cell:focus-visible{outline:none}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:11px;z-index:2}
.fleck{position:absolute;width:var(--size);aspect-ratio:1;background:var(--color);border-radius:var(--corner);animation:scatter .66s cubic-bezier(.12,.69,.36,1) both}
@keyframes scatter{0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}24%{opacity:1}100%{opacity:0;transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) rotate(var(--turn)) scale(.4)}}
.ripple{position:absolute;inset:0;border:3px solid var(--glint);border-radius:3px;pointer-events:none;animation:rebound .6s ease-out both}
@keyframes rebound{0%{opacity:1;transform:translateX(-3px) scale(.96,1.035)}17%{transform:translateX(3px) scale(1.025,.98)}35%{transform:translateX(-1px) scale(1.01,1.02)}70%{opacity:.4}100%{opacity:0;transform:scale(1.055)}}
.seal{position:absolute;left:48%;bottom:calc(50% + var(--half-sheet) - 21px);width:51px;height:51px;transform:rotate(12deg);color:var(--glint);display:none;filter:drop-shadow(2px 2px 0 #241b13)}
.area[data-stage="3"] .seal{display:block}
.area.celebrate .seal{animation:stamp .42s cubic-bezier(.2,.7,.28,1.25) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(1.8)}65%{opacity:1;transform:rotate(14deg) scale(.94)}100%{transform:rotate(12deg) scale(1)}}
.area.celebrate .mat,.area.celebrate .scene{animation:desk-settle .34s ease-out both}
@keyframes desk-settle{0%,100%{transform:translateX(0)}19%{transform:translateX(-3px)}37%{transform:translateX(2px)}60%{transform:translateX(-1px)}}
.foot{display:flex;flex-direction:column;gap:5px;padding-top:1px}
.progress,.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
#cnt{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.bar{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.bar i{height:9px;border:1px solid #b6a78b;border-radius:2px;background:#ded5c3}
.bar i:nth-child(4n){margin-right:3px}
.bar i:nth-child(12){margin-right:0}
.bar i.inked{border-color:var(--mat-deep);background:var(--mat)}
.bar i.inked:nth-child(4n){background:var(--accent)}
.collection{display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.15;font-weight:800}
.prints{display:flex;align-items:center;gap:4px}
.prints .swatch{width:21px;height:18px;background:#f4ecdb;border:1px dashed #857861;color:#776951}
.prints .swatch svg{width:12px;height:12px}
.prints .swatch.earned{background:var(--paper);border:1px solid var(--ink);color:var(--ink)}
#act{min-height:44px;padding:5px 14px;border:1px solid var(--ink);border-radius:5px;background:var(--ink);color:#fff8e8;font:inherit;font-size:14px;font-weight:800;box-shadow:0 2px 0 #7d6c54;cursor:pointer}
#act:disabled{background:#e2d8c4;border-color:#9a8b71;box-shadow:none;color:#5a5040;cursor:default}
.col[data-finished=true] #act{background:var(--accent);border-color:var(--accent)}
#act:active:not(:disabled),.choose button:active{transform:translateY(1px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:520px){
 .col{gap:7px;padding:10px 12px}.heading{padding-top:6px}h1{font-size:clamp(25px,8.7vw,34px)}
 #inst{margin-top:2px}.area{padding-top:44px;min-height:196px}.cat{width:78px;height:68px;bottom:calc(50% + var(--half-sheet) - 26px)}
 .tools{width:82px;bottom:calc(50% + var(--half-sheet) - 24px)}.seal{width:40px;height:40px}
}
@media (forced-colors:active){.cell:not(.on)::before{border:1px solid CanvasText}.row > div:has(.cell:focus-visible)::after{outline-color:Highlight}.bar i.inked,.prints .swatch.earned{forced-color-adjust:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cell.on::after,.fleck,.ripple{display:none}#act:active:not(:disabled),.choose button:active{transform:none}}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
</style>
</head>

  return `

   <path d="M-5 201q76-20 129-6t110 0q80-22 171 5M19 275q54-7 85 1m203-2q41-8 74-1" fill="none" stroke="#8276a5" stroke-width="1.8"/>
   `+inkLines(drops,'#62578B',2.6)+`
   <g fill="none" stroke="#62578B" stroke-width="2.5">
    <ellipse cx="109" cy="238" rx="68" ry="21"/><ellipse cx="211" cy="218" rx="72" ry="23"/><ellipse cx="286" cy="241" rx="79" ry="25"/>
    <ellipse cx="109" cy="238" rx="36" ry="10"/><ellipse cx="211" cy="218" rx="37" ry="11"/><ellipse cx="286" cy="241" rx="42" ry="12"/>
   </g>
   <path d="M62 235q20-10 42-10m71-12q13-8 33-8m63 49q18 2 33-1m-58 27q32 7 77-2" fill="none" stroke="#fff5e6" stroke-width="3" stroke-linecap="round"/>
   <g transform="translate(208 155) rotate(-8)" stroke="#554365" stroke-width="1.8" stroke-linejoin="round">
    <path d="M-72 3-45 34 45 36 70 3 34 11 4-23-39 12Z" fill="#fff1d4"/>
    <path d="m-39 12 43-35L1 21 34 11M-72 3l36 13 37 5L70 3M1 21l-14 13m49-23-13 23" fill="none"/>
    <path d="m-58 19 22 5m50 2 27-6" fill="none" stroke="#b66c79"/>
   </g>
  `;
 },
 ginkgo:function(){
  var leaves=[[43,229,-33,1.08],[106,204,132,1.25],[171,163,-28,1.43],[264,129,140,1.28],[330,87,-24,1.33]];
  var s=`
   <circle cx="306" cy="84" r="55" fill="#efd49a"/>
   <path d="M-12 255C76 226 130 180 204 154s129-49 208-123" fill="none" stroke="#684527" stroke-width="7" stroke-linecap="round"/>
   <path d="M-7 254C74 227 132 184 211 154S343 101 411 36" fill="none" stroke="#be8451" stroke-width="1.8" stroke-linecap="round"/>
  `;
  leaves.forEach(function(l,i){
   s+='<g transform="translate('+l[0]+' '+l[1]+') rotate('+l[2]+') scale('+l[3]+')">'+
    '<path d="M0 0q-6-16-4-27" stroke="#684527" stroke-width="2.1" fill="none"/>'+
    '<path d="M-4-25c-17 7-37-4-42-23q6-4 8-9 7 2 13-6 7 3 13-4 4 1 9 7 4-7 11-7 4 6 13 3 3 6 12 5 2 7 9 10c-5 15-24 24-46 24Z" fill="'+(i%2?'#d8a243':'#C28724')+'" stroke="#714a25" stroke-width="1.3"/>'+
    inkLines('M-4-25Q-24-29-41-48M-4-25Q-21-36-32-54M-4-25Q-16-40-19-58M-4-25Q-11-39-11-60M-4-25v-31M-4-25Q6-43 8-61M-4-25Q13-36 18-57M-4-25Q19-32 30-54M-4-25Q24-31 36-47','#795020',.9)+
    '</g>';
  });
  return s+inkLines('M45 96q9-8 15 4-9 5-15-4Zm94-41q6-9 14-4-4 8-14 4Zm155 168q12-7 18 1-9 8-18-1Zm42 28q15-3 17 5-11 5-17-5Z','#ad7239',1.5);
 }
};
function drawArt(p){
 var speckles='';
 for(var i=0;i<230;i++){
  speckles+='M'+(rnd(i,10)*400).toFixed(1)+' '+(rnd(i,11)*300).toFixed(1)+'h.6';
 }
 var border=inkLines('M11 34V12h22m334 0h22v22m0 232v22h-22m-334 0H11v-22','#292A25',1.3);
 art.innerHTML='<svg viewBox="0 0 400 300" preserveAspectRatio="none" focusable="false"><rect width="400" height="300" fill="'+PAPERS[p]+'"/>'+ART[p]()+border+'<g opacity=".2">'+inkLines(speckles,'#473a2c',1.1)+'</g></svg>';
}

/* ---- cells ---- */
var cells=[];
function rnd(i,k){var v=Math.sin(i*127.1+k*311.7)*43758.5453;return v-Math.floor(v)}
for(var r=0;r<R;r++){
 var row=document.createElement('div');row.className='row';row.setAttribute('role','row');
 for(var c=0;c<C;c++){
  var i=r*C+c,slot=document.createElement('div'),el=document.createElement('button');
  slot.setAttribute('role','gridcell');
  el.type='button';el.className='cell';el.tabIndex=i===0?0:-1;el.dataset.i=i;
  el.style.setProperty('--r',Math.round(rnd(i,1)*360)+'deg');
  el.style.setProperty('--x',Math.round(25+rnd(i,2)*50)+'%');
  el.style.setProperty('--y',Math.round(25+rnd(i,3)*50)+'%');
  el.style.setProperty('--l',Math.round(rnd(i,4)*180)+'deg');
  el.style.setProperty('--l2',Math.round(rnd(i,5)*180)+'deg');
  slot.appendChild(el);row.appendChild(slot);cells.push(el);
  bar.appendChild(document.createElement('i'));
 }
 sheet.appendChild(row);
}
/* ---- state ---- */
var paper='waves',mask=0,count=0,cur=0,stroke=null,frame=null;
var collected=new Set();
if(!demo){try{var sv=localStorage.getItem(KEY);if(sv==='waves'||sv==='rain'||sv==='ginkgo')paper=sv}catch(e){}}

function pname(){return T(paper)}
function label(i){var on=(mask>>i)&1;cells[i].setAttribute('aria-label',T(on?'smoothSquare':'creasedSquare',{row:Math.floor(i/C)+1,col:i%C+1}))}
function view(){
 cnt.textContent=T('progress',{done:count,total:N});
 inst.textContent=count===N?T('complete'):T('instruction');
 act.textContent=count===N?T('again'):T('reset');
 act.disabled=count===0;
 for(var i=0;i<N;i++)bar.children[i].classList.toggle('inked',i<count);
 area.dataset.stage=Math.floor(count/C);
 studio.dataset.finished=count===N;
 sheet.classList.toggle('done',count===N);inst.classList.toggle('fin',count===N);
}
function viewCollection(){
 var summary=T('collection',{done:collected.size,total:Object.keys(PAPERS).length});
 $('collection').textContent=summary;
 Array.from(prints.children).forEach(function(stamp){
  var earned=collected.has(stamp.dataset.p);
  stamp.classList.toggle('earned',earned);
  stamp.setAttribute('aria-label',T(earned?'printEarned':'printEmpty',{paper:T(stamp.dataset.p)}));
 });
}
function collectPrint(){
 collected.add(paper);
 viewCollection();
}
function queueView(){
 if(frame!==null)return;
 frame=requestAnimationFrame(function(){frame=null;view()});
}
function say(t){status.textContent=t}
function sayProgress(){say(T('progressAccessible',{done:count,total:N}))}
function setCur(i){
 if(i===cur)return;
 cells[cur].tabIndex=-1;cur=i;cells[i].tabIndex=0;
}
function clearAll(){
 endStroke(false);
 if(frame!==null){cancelAnimationFrame(frame);frame=null}
 mask=0;count=0;
 for(var i=0;i<N;i++){cells[i].classList.remove('on');label(i)}
 clearEffects();
 area.classList.remove('celebrate');
}
function setPaper(p){
 paper=p;sheet.style.setProperty('--base',PAPERS[p]);drawArt(p);
 studio.dataset.paper=p;
 sheet.setAttribute('aria-label',T('gridLabel',{paper:pname()}));
 var bs=choose.children;for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].dataset.p===p?'true':'false');
}
Object.keys(PAPERS).forEach(function(p){
 var b=document.createElement('button');b.type='button';b.dataset.p=p;
 b.style.setProperty('--paper',PAPERS[p]);
 b.innerHTML='<span class="swatch" aria-hidden="true">'+icon(p)+'<span class="ck">✓</span></span><span></span>';
 b.lastChild.textContent=T(p);
 b.addEventListener('click',function(){
  if(p===paper)return;
  if(!demo){try{localStorage.setItem(KEY,p)}catch(e){}}
  clearAll();setPaper(p);view();sayProgress();
 });
 choose.appendChild(b);
 var stamp=document.createElement('span');
 stamp.className='swatch';stamp.dataset.p=p;
 stamp.setAttribute('role','img');
 stamp.style.setProperty('--paper',PAPERS[p]);stamp.innerHTML=icon(p);
 prints.appendChild(stamp);
});

/* Only the decorations move; pointer geometry remains stationary. */
function revealEffects(i){
 if(motion.matches||document.hidden)return;
 var x=sheet.offsetLeft+sheet.offsetWidth*(i%C+.5)/C;
 var y=sheet.offsetTop+sheet.offsetHeight*(Math.floor(i/C)+.5)/R;
 var milestone=count%C===0;
 var burst=document.createDocumentFragment();
 var amount=count===N?22:milestone?11:4;
 for(var k=0;k<amount;k++){
  var fleck=document.createElement('i');
  fleck.className='fleck';
  var angle=(k/amount+rnd(i,k)*.075)*2*Math.PI;
  var distance=(milestone?58:32)*(1+rnd(i,k+31));
  var color=['var(--glint)','#fff4db','#f28c67'][k%3];
  fleck.style.cssText='left:'+x+'px;top:'+y+'px;--size:'+(3+rnd(i,k+9)*5)+'px;--color:'+color+
   ';--corner:'+(k%2?'50%':'1px')+';--dx:'+Math.round(Math.cos(angle)*distance)+'px;--dy:'+
   Math.round(Math.sin(angle)*distance-12)+'px;--turn:'+(k%2?-125:145)+'deg';
  burst.appendChild(fleck);
 }
 if(milestone){
  var ripple=document.createElement('i');
  ripple.className='ripple';
  ripple.style.inset=sheet.offsetTop+'px auto auto '+sheet.offsetLeft+'px';
  ripple.style.width=sheet.style.width;
  ripple.style.height=sheet.style.height;
  burst.appendChild(ripple);
 }
 fx.appendChild(burst);
}
fx.addEventListener('animationend',function(e){e.target.remove()});

function endStroke(announce){
 if(!stroke)return;
 var ended=stroke;stroke=null;
 if(sheet.hasPointerCapture&&sheet.hasPointerCapture(ended.id))sheet.releasePointerCapture(ended.id);
 if(announce&&count>ended.startCount&&count<N)sayProgress();
}
function smooth(i){
 if((mask>>i)&1)return false;
 mask|=1<<i;count++;
 cells[i].classList.add('on');label(i);
 revealEffects(i);
 if(stroke)queueView();else view();
 if(count===N){
  endStroke(false);
  collectPrint();
  area.classList.add('celebrate');
  cells[i].focus({preventScroll:true});
  say(T('complete'));
 }
 return true;
}

/* ---- pointer ---- */
function cellAt(x,y,w,h){
 var col=Math.min(C-1,Math.max(0,Math.floor(x/(w/C))));
 var row=Math.min(R-1,Math.max(0,Math.floor(y/(h/R))));
 return row*C+col;
}
function clip(x0,y0,x1,y1,xa,ya,xb,yb){
 var t0=0,t1=1,dx=x1-x0,dy=y1-y0,P=[-dx,dx,-dy,dy],Q=[x0-xa,xb-x0,y0-ya,yb-y0];
 for(var k=0;k<4;k++){
  if(P[k]===0){if(Q[k]<0)return null}
  else{var t=Q[k]/P[k];if(P[k]<0){if(t>t1)return null;if(t>t0)t0=t}else{if(t<t0)return null;if(t<t1)t1=t}}
 }
 return[t0,t1];
}
function hit(x0,y0,x1,y1,W,H){
 if(x0===x1&&y0===y1)return;
 var cw=W/C,ch=H/R;
 var hs=[];
 for(var r=0;r<R;r++)for(var c=0;c<C;c++){
  var k=clip(x0,y0,x1,y1,c*cw,r*ch,(c+1)*cw,(r+1)*ch);
  if(!k||k[1]-k[0]<1e-9)continue; // corner contact only
  var i=r*C+c,t=(k[0]+k[1])/2;
  if(cellAt(x0+(x1-x0)*t,y0+(y1-y0)*t,W,H)===i)hs.push([t,i]);
 }
 hs.sort(function(a,b){return a[0]-b[0]}); // pointer crossing order
 for(var j=0;j<hs.length;j++){if(!stroke)return;smooth(hs[j][1])}
}
sheet.addEventListener('pointerdown',function(e){
 if(!e.isPrimary||stroke||e.button!==0)return;
 var rect=sheet.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
 if(!rect.width||!rect.height||x<0||x>rect.width||y<0||y>rect.height)return;
 e.preventDefault();
 stroke={id:e.pointerId,rect:rect,x:x,y:y,startCount:count,viewportWidth:innerWidth,viewportHeight:innerHeight};
 try{sheet.setPointerCapture(e.pointerId)}catch(_){}
 var idx=cellAt(x,y,rect.width,rect.height);
 cells[idx].focus({preventScroll:true});
 smooth(idx);
});
function moveStroke(e){
 if(stroke.viewportWidth!==innerWidth||stroke.viewportHeight!==innerHeight){
  endStroke(true);
  return;
 }
 var rect=stroke.rect,x=e.clientX-rect.left,y=e.clientY-rect.top;
 var px=stroke.x,py=stroke.y;
 stroke.x=x;stroke.y=y;
 hit(px,py,x,y,rect.width,rect.height);
}
sheet.addEventListener('pointermove',function(e){
 if(!stroke||e.pointerId!==stroke.id)return;
 var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
 for(var i=0;i<evs.length&&stroke;i++)moveStroke(evs[i]);
 if(stroke)moveStroke(e);
});
window.addEventListener('pointerup',function(e){
 if(!stroke||e.pointerId!==stroke.id)return;
 moveStroke(e);
 endStroke(true);
});
function up(e){if(stroke&&e.pointerId===stroke.id)endStroke(true)}
window.addEventListener('pointercancel',up);
window.addEventListener('blur',function(){endStroke(true)});
area.closest('.shell').addEventListener('scroll',function(){endStroke(true)});
sheet.addEventListener('lostpointercapture',up);
sheet.addEventListener('pointerleave',function(e){
 if(stroke&&e.pointerId===stroke.id&&(!sheet.hasPointerCapture||!sheet.hasPointerCapture(e.pointerId)))endStroke(true);
});
document.addEventListener('visibilitychange',function(){
 document.documentElement.classList.toggle('paused',document.hidden);
 if(document.hidden)endStroke(true);
});

/* ---- keyboard ---- */
sheet.addEventListener('focusin',function(e){if(e.target.matches('.cell'))setCur(+e.target.dataset.i)});
sheet.addEventListener('click',function(e){
 if(e.detail!==0||!e.target.matches('.cell'))return; // pointer input is handled by the stroke
 var i=+e.target.dataset.i;
 cells[i].focus({preventScroll:true});
 if(smooth(i)&&count<N)sayProgress();
});
sheet.addEventListener('keydown',function(e){
 var c=e.target;if(!c.matches('.cell'))return;
 var i=+c.dataset.i,r=Math.floor(i/C),col=i%C,k=e.key;
 if(k==='ArrowLeft'){col=Math.max(0,col-1)}
 else if(k==='ArrowRight'){col=Math.min(C-1,col+1)}
 else if(k==='ArrowUp'){r=Math.max(0,r-1)}
 else if(k==='ArrowDown'){r=Math.min(R-1,r+1)}
 else if(k==='Enter'||k===' '){
  e.preventDefault();
  c.click();
  return;
 }else return;
 e.preventDefault();
 cells[r*C+col].focus({preventScroll:true});
});

/* ---- action ---- */
act.addEventListener('click',function(){
 clearAll();cells[0].focus({preventScroll:true});view();sayProgress();
});

/* ---- layout ---- */
function fit(){
 var headroom=parseFloat(getComputedStyle(area).paddingTop);
 var w=Math.max(C*44,Math.min(area.clientWidth-28,(area.clientHeight-headroom-20)*4/3,Math.max(232,area.clientWidth*.82)));
 if(sheet.style.width===w+'px')return;
 endStroke(true);
 clearEffects();
 sheet.style.width=w+'px';sheet.style.height=(w*3/4)+'px';
 area.style.setProperty('--half-sheet',(w*3/8)+'px');
}
window.addEventListener('resize',function(){endStroke(true);fit()});
if(window.ResizeObserver)new ResizeObserver(fit).observe(area);

/* ---- init ---- */
setPaper(paper);clearAll();
if(demo){
 for(var i=0;i<N;i++){mask|=1<<i;cells[i].classList.add('on');label(i)}
 count=N;
 collectPrint();
}else{
 viewCollection();
}
view();fit();
if(demo)say(T('complete'));else sayProgress();
})();
</script>
</body>
</html>
