<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라면 3분 참기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffda69'/%3E%3Cpath d='M5 11h22l-4 14H9z' fill='%23e54431' stroke='%232d1a1a' stroke-width='2'/%3E%3Cpath d='M6 11h20' stroke='%232d1a1a' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --ink: #322018;
    --paper: #fff4d7;
    --egg: #ffde72;
    --red: #e74430;
    --green: #d6ea9f;
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    color: var(--ink);
    background: repeating-linear-gradient(120deg, #632922 0 24px, #6d2e25 24px 48px);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  [hidden] { display: none !important; }
  #game {
    position: relative; isolation: isolate; display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; max-width: 590px; margin: auto;
    padding: clamp(9px, 2.3vh, 22px) clamp(17px, 5vw, 34px);
    overflow: hidden; touch-action: none;
    background: radial-gradient(circle at 50% 48%, #f45d3d, transparent 74%), var(--red);
    border-inline: 2px solid #a72d24; box-shadow: 0 0 60px #32171274;
  }
  #game::before {
    content: ""; position: absolute; z-index: -1; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 3px, #4c221512 3px 4px);
    mask-image: linear-gradient(#000, transparent 35%, transparent 57%, #000);
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #issue {
    display: inline-block; background: var(--paper); border: 2px solid var(--ink);
    padding: 4px 10px; font-size: 13px; font-weight: 900; transform: rotate(-3deg);
    box-shadow: 2px 2px var(--ink);
  }
  #mute {
    width: 44px; height: 44px; padding: 10px; border: 2px solid var(--ink);
    border-radius: 50%; background: var(--egg); box-shadow: 0 2px var(--ink); flex: none;
  }
  #mute svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; }
  .mute-line, #mute[aria-pressed="true"] .waves { display: none; }
  #mute[aria-pressed="true"] .mute-line { display: block; }
  .masthead { text-align: center; margin: clamp(1px, 1.2vh, 13px) 0 0; }
  h1 {
    margin: 0; color: var(--paper); font-size: clamp(42px, 8.6vh, 76px);
    font-weight: 1000; line-height: .98; letter-spacing: -.09em;
    transform: rotate(-3deg); text-shadow: 2px 2px var(--ink), 4px 4px var(--ink), -1px -1px var(--ink);
  }
  h1 span { display: block; }
  h1 span:last-child { color: var(--egg); }
  :lang(en) h1 { font-size: clamp(37px, 7.6vh, 68px); letter-spacing: -.07em; }
  .art { display: grid; place-items: center; flex: 1; min-height: 72px; position: relative; }
  #scene { position: absolute; width: 100%; height: 100%; overflow: visible; }
  #cup { transform-box: fill-box; transform-origin: center bottom; animation: breathe 3s ease-in-out infinite; }
  #steam { transform-box: fill-box; transform-origin: bottom; animation: waft 2.4s ease-in-out infinite alternate; }
  #eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  #foil { transform-box: fill-box; transform-origin: right bottom; transition: transform .3s cubic-bezier(.16,1.4,.5,1); }
  #finish-face, #miss-face, #noodles, #burst, .visitor { display: none; }
  [data-state="result"] #foil { transform: translate(-5px, -35px) rotate(22deg); }
  [data-state="result"] #finish-face, [data-state="result"] #noodles, [data-state="result"] #burst { display: block; }
  [data-state="result"] #eyes, [data-state="result"] #mouth { display: none; }
  [data-off="true"] #finish-face { display: none; }
  [data-off="true"] #miss-face { display: block; }
  [data-state="result"] #burst { transform-origin: 210px 174px; animation: pop .42s ease-out; }
  [data-mood="friend"] #friend, [data-mood="ping"] #phone, [data-mood="belly"] #growl {
    display: block; transform-box: fill-box; transform-origin: center; animation: pop .32s ease-out;
  }
  [data-mood="belly"] #cup { animation: wobble .42s ease-out 2; }
  @keyframes breathe { 50% { transform: scale(1.012, .982); } }
  @keyframes waft { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: translateY(-5px); } }
  @keyframes blink { 0%, 44%, 49%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.12); } }
  @keyframes pop { from { opacity: 0; transform: scale(.62); } 68% { transform: scale(1.08); } }
  @keyframes wobble { 30% { transform: rotate(-3deg); } 68% { transform: rotate(2deg); } }
  .ticket {
    position: relative; z-index: 1; margin: -2px 3px 0; text-align: center;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 9px 15px 10px 13px;
    box-shadow: 3px 4px var(--ink); padding: clamp(6px, 1.2vh, 12px) 8px;
  }
  .ticket::before {
    content: ""; position: absolute; right: 17%; top: -9px; width: 13px; height: 13px;
    background: inherit; border: solid var(--ink); border-width: 2px 0 0 2px; transform: rotate(45deg);
  }
  [data-mood="ping"] .ticket { background: #ffdf87; }
  [data-mood="friend"] .ticket { background: #ffcbc0; }
  [data-mood="belly"] .ticket, [data-grade="S"] .ticket { background: var(--green); }
  #label { display: block; font-size: 12px; font-weight: 850; color: #793825; }
  #line { margin: 2px 0 0; font-size: clamp(15px, 2.55vh, 21px); line-height: 1.22; font-weight: 900; word-break: keep-all; }
  #detail { margin: 3px 0 0; font-size: clamp(12px, 1.9vh, 15px); font-weight: 620; line-height: 1.25; }
  footer { display: grid; gap: 6px; margin-top: clamp(9px, 2vh, 17px); }
  #action {
    min-height: 49px; border: 2px solid var(--ink); border-radius: 11px 14px 12px 9px;
    background: var(--egg); box-shadow: 0 4px var(--ink);
    font-size: clamp(18px, 3.2vh, 24px); font-weight: 950; padding: 6px 12px;
  }
  #action:active { transform: translateY(3px); box-shadow: 0 1px var(--ink); }
  .footline {
    min-height: 32px; display: flex; align-items: center; justify-content: space-between;
    gap: 6px; padding-inline: 3px; font-size: 13px; font-weight: 850;
  }
  #best, #hint { background: var(--paper); border-radius: 4px; padding: 2px 6px; }
  #share {
    min-height: 44px; border: 2px solid var(--ink); border-radius: 8px;
    background: var(--paper); padding: 3px 10px; font-size: 13px;
  }
  #share-text { width: 100%; min-height: 44px; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; }
  #hint { text-align: right; }
  @media (max-height: 530px) {
    h1, :lang(en) h1 { font-size: clamp(32px, 7.7vh, 42px); }
    .masthead { margin-top: 0; }
  }
  @media (orientation: landscape) and (max-height: 420px) {
    #game {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(min-content, 1fr) auto;
      gap: 5px 12px; overflow-y: auto; touch-action: pan-y;
    }
    header { grid-column: 1 / -1; }
    .masthead { align-self: center; }
    .art { grid-area: 2 / 2; }
    footer { grid-area: 3 / 2; align-self: end; margin-top: 0; }
    .ticket { margin-bottom: 4px; }
    button { touch-action: manipulation; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

</main>
<script>
(() => {
  'use strict';
  const words = {
    ko: {
      title: ['라면 3분', '참기'],
      levels: ['1단계 · 점심시간', '2단계 · 점심 겸 회의', '3단계 · 점심 반납 위기'],
      startLabel: '조리법',
      intro: '딱 3분 같을 때 뚜껑을 여세요.',
      scale: seconds => `실제 ${seconds}초가 라면 속 3분이에요.`,
      pour: '물 붓기',
      open: '뚜껑 열기',
      again: '한 컵 더',
      next: '다음 단계 · 물 붓기',
      waiting: '뚜껑 아래서 면이 익는 중',
      quiet: '뚜껑을 지키는 중입니다.',
      best: '최고',
      key: '스페이스 키',
      mute: '음소거',
      share: '결과 복사',
      copied: '복사됨!',
      manual: '공유할 결과 · 선택한 텍스트를 복사하세요.',
      result: (time, score, offset) => `${time} · ${offset} · ${score}점`,
      offset: (gap, amount) => gap === 0 ? '정각' : `${amount}초 ${gap < 0 ? '빠름' : '늦음'}`,
      shareLine: (grade, title, details) => `라면 3분 참기 — ${grade}급 ${title}\n${details}`,
      grade: grade => `${grade}급 · 조리 결과`,
      awards: ['컵라면 명예 과장', '면발 품질팀 대리', '바삭면 조기 수확상', '면발 퇴근 완료'],
      distractions: {
        belly: ['배꼽시계', '꾸르륵. 점심 결재 올렸습니다.', '꾸르륵. 결재 독촉드립니다.', '위장입니다. 전사 공지 올립니다.'],
        friend: ['옆자리 동료', '한 입만. 젓가락은 제가 챙겼어요.', '뚜껑 좀 열어 봐. 면한테 물어보게.', '반만 줘. 국물부터 반.'],
        ping: ['팀 채팅', '과장님: “점심 먹기 전에 딱 하나만…”', '팀장님: “밥은 먹으면서 들으세요.”', '회의 초대: 점심시간 활용 방안']
      }
    },
    en: {
      title: ['Three-Minute', 'Ramen'],
      levels: ['Level 1 · Lunch break', 'Level 2 · Lunch meeting', 'Level 3 · What lunch break?'],
      startLabel: 'Cooking instructions',
      intro: 'Lift the lid when it feels like 3:00.',
      scale: seconds => `${seconds} real seconds = 3 ramen minutes.`,
      pour: 'Pour water',
      open: 'Lift the lid',
      again: 'Cook another cup',
      next: 'Next level · Pour water',
      waiting: 'Cooking under the lid',
      quiet: 'You are now on lid duty.',
      best: 'Best',
      key: 'Space key',
      mute: 'Mute',
      share: 'Copy result',
      copied: 'Copied!',
      manual: 'Share result · Copy the selected text.',
      result: (time, score, offset) => `${time} · ${offset} · ${score} pts`,
      offset: (gap, amount) => gap === 0 ? 'on time' : `${amount}s ${gap < 0 ? 'early' : 'late'}`,
      shareLine: (grade, title, details) => `Three-Minute Ramen — Grade ${grade}, ${title}\n${details}`,
      grade: grade => `Grade ${grade} · Cooking report`,
      awards: ['Honorary Ramen Manager', 'Noodle Quality Associate', 'Crunch Noodle Early Harvester', 'Noodles Clocked Out'],
      distractions: {
        belly: ['Stomach', 'Grrr. Lunch submitted for approval.', 'Grrr. Following up on my lunch request.', 'Stomach here. Replying all.'],
        friend: ['Desk neighbor', 'One bite? I brought my own chopsticks.', 'Let’s lift the lid and ask the noodles.', 'Just half. Starting with half the broth.'],
        ping: ['Team chat', 'Boss: “Quick thing before you eat…”', 'Boss: “You can eat while you listen.”', 'Meeting invite: Optimizing the Lunch Break']
      }
    }
  };
  const lang = (new URLSearchParams(location.search).get('lang') || navigator.language).startsWith('ko') ? 'ko' : 'en';
  const t = words[lang];
  const $ = id => document.getElementById(id);
  const game = $('game');
  const action = $('action');
  const mute = $('mute');
  const share = $('share');
  const shareText = $('share-text');
  const scoreKey = 'ramen-wait-best';
  const muteKey = 'ramen-wait-muted';
  const targets = [30, 36, 42];
  const patterns = [
    ['belly', 'friend', 'ping'],
    ['friend', 'ping', 'belly', 'friend', 'ping'],
    ['ping', 'belly', 'friend', 'ping', 'friend', 'belly', 'ping']
  ];
  const sounds = {
    pour: [260, 390, 530], belly: [108, 74], friend: [392, 460], ping: [740, 980],
    win: [523, 659, 784, 1047], miss: [330, 262, 165], share: [540, 780]
  };
  let best = 0;
  let muted = false;
  try {
    best = Math.max(0, Math.min(1000, Number(localStorage.getItem(scoreKey)) || 0));
    muted = localStorage.getItem(muteKey) === '1';
  } catch {}
  let state = 'start', autoFinishedAt = -Infinity;
  let level = 0;
  let nextLevel = 0;
  let elapsedBeforePause = 0;
  let runningSince = null;
  let frame = 0;
  let events = [];
  let activeEvent = null;
  let audio;
  let resultText = '';

  document.documentElement.lang = lang;
  document.title = t.title.join(' ');
  $('title-top').textContent = t.title[0];
  $('title-bottom').textContent = t.title[1];
  $('hint').textContent = t.key;
  mute.setAttribute('aria-label', t.mute);
  updateMute();
  updateBest();
  $('issue').textContent = t.levels[level];
  action.textContent = t.pour;
  ticket(t.startLabel, t.intro, t.scale(targets[level]));

  function updateBest() {
    $('best').textContent = `${t.best} ${best}`;
  }

  function updateMute() {
    mute.setAttribute('aria-pressed', String(muted));
  }

  function unlockAudio() {
    if (muted) return;
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (Audio && !audio) audio = new Audio();
      if (audio?.state === 'suspended') audio.resume().catch(() => {});
    } catch {}
  }

  function sound(name) {
    if (muted || !audio || document.hidden) return;
    sounds[name].forEach((pitch, index) => {
      const note = audio.createOscillator();
      const gain = audio.createGain();
      const at = audio.currentTime + index * .075;
      note.type = name === 'belly' ? 'triangle' : 'sine';
      note.frequency.value = pitch;
      gain.gain.setValueAtTime(.001, at);
      gain.gain.exponentialRampToValueAtTime(.14, at + .025);
      gain.gain.exponentialRampToValueAtTime(.001, at + .14);
      note.connect(gain).connect(audio.destination);
      note.start(at);
      note.stop(at + .15);
    });
  }

  function ticket(label, line, detail) {
    $('label').textContent = label;
    $('line').textContent = line;
    $('detail').textContent = detail;
  }

  function distraction(event) {
    activeEvent = event;
    const kind = event?.kind || '';
    game.dataset.mood = kind;
    if (event) {
      const [label, ...lines] = t.distractions[kind];
      ticket(label, lines[event.line], t.scale(targets[level]));
      sound(kind);
    } else {
      ticket(t.waiting, t.quiet, t.scale(targets[level]));
    }
  }

  function start() {
    autoFinishedAt = -Infinity;
    level = nextLevel;
    state = game.dataset.state = 'play';
    delete game.dataset.grade;
    delete game.dataset.off;
    $('issue').textContent = t.levels[level];
    share.hidden = shareText.hidden = true;
    $('hint').hidden = false;
    action.textContent = t.open;
    elapsedBeforePause = 0;
    const pattern = patterns[level];
    events = pattern.map((kind, i) => ({
      kind,
      line: (level + pattern.slice(0, i).filter(previous => previous === kind).length) % 3,
      at: 4 + (targets[level] - 10) * i / (pattern.length - 1) + Math.random() * 3,
      duration: 2.6
    }));
    distraction(null);
    runningSince = document.hidden ? null : performance.now();
    if (runningSince !== null) frame = requestAnimationFrame(tick);
    sound('pour');
  }

  function elapsed(now) {
    return elapsedBeforePause + (runningSince === null ? 0 : (now - runningSince) / 1000);
  }

  function tick(now) {
    if (state !== 'play' || runningSince === null) return;
    const seconds = elapsed(now);
    if (seconds >= targets[level] + 15) {
      autoFinishedAt = performance.now();
      finish(targets[level] + 15);
      return;
    }
    const event = events.find(({ at, duration }) => seconds >= at && seconds < at + duration) || null;
    if (event !== activeEvent) distraction(event);
    frame = requestAnimationFrame(tick);
  }

  function finish(seconds) {
    cancelAnimationFrame(frame);
    runningSince = null;
    const tenths = Math.round(seconds / targets[level] * 1800);
    const gap = tenths - 1800;
    const error = Math.abs(gap);
    const penalty = error * (2 + level);
    const score = Math.max(0, 1000 - penalty);
    const grade = penalty <= 20 ? 'S' : penalty <= 100 ? 'A' : penalty <= 400 ? 'B' : 'C';
    const award = grade === 'S' ? 0 : grade === 'A' ? 1 : gap < 0 ? 2 : 3;
    nextLevel = Math.min(level + 1, targets.length - 1);
    state = game.dataset.state = 'result';
    game.dataset.mood = '';
    game.dataset.grade = grade;
    game.dataset.off = String(award >= 2);
    const time = `${Math.floor(tenths / 600)}:${String(Math.floor(tenths / 10) % 60).padStart(2, '0')}.${tenths % 10}`;
    const details = t.result(time, score, t.offset(gap, (error / 10).toFixed(1)));
    ticket(t.grade(grade), t.awards[award], details);
    if (score > best) {
      best = score;
      try { localStorage.setItem(scoreKey, String(best)); } catch {}
    }
    updateBest();
    action.textContent = nextLevel === level ? t.again : t.next;
    $('hint').hidden = true;
    share.textContent = t.share;
    share.hidden = false;
    resultText = t.shareLine(grade, t.awards[award], details);
    if (location.protocol === 'https:' || location.protocol === 'http:') {
      resultText += `\n${location.origin}/${lang}/ramen-wait/`;
    }
    sound(award < 2 ? 'win' : 'miss');
  }

  function playAction() {
    unlockAudio();
    if (state === 'play') finish(Math.min(elapsed(performance.now()), targets[level] + 15));
    else start();
  }

  // Native button clicks cover touch, mouse, and keyboard activation.
  action.addEventListener('pointerdown', unlockAudio);
  action.addEventListener('click', () => {
    if (state === 'result' && performance.now() - autoFinishedAt < 600) return;
    playAction();
  });
  window.addEventListener('keydown', event => {
    if (event.code !== 'Space' && event.code !== 'Enter') return;
    if (event.target.closest('input') || event.target.closest('button:not(#action)')) return;
    event.preventDefault();
    if (!event.repeat) playAction();
  });

  mute.addEventListener('click', () => {
    muted = !muted;
    updateMute();
    try { localStorage.setItem(muteKey, muted ? '1' : '0'); } catch {}
    if (!muted) {
      unlockAudio();
      sound('share');
    }
  });

  share.addEventListener('click', async () => {
    const text = resultText;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      if (state !== 'result' || text !== resultText) return;
      shareText.value = text.replaceAll('\n', ' ');
      shareText.setAttribute('aria-label', t.manual);
      shareText.hidden = false;
      shareText.focus();
      shareText.select();
      try {
        if (!document.execCommand('copy')) return;
      } catch { return; }
      shareText.hidden = true;
      share.focus();
    }
    if (state === 'result' && text === resultText) {
      share.textContent = t.copied;
      sound('share');
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (state !== 'play') return;
    if (document.hidden && runningSince !== null) {
      elapsedBeforePause = elapsed(performance.now());
      runningSince = null;
      cancelAnimationFrame(frame);
    } else if (!document.hidden && runningSince === null) {
      runningSince = performance.now();
      frame = requestAnimationFrame(tick);
    }
  });
})();
</script>
</body>
</html>
