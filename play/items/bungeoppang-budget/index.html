<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>붕어빵 예산 계산기</title>
<link rel="icon" href="data:," />
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#302A25;background:#20343D}
[hidden]{display:none!important}
.app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;display:flex;justify-content:center;
 background:radial-gradient(ellipse at 50% 26%,#426068,#20343D 70%)}
.street{position:absolute;inset:auto 0 0;width:100%;height:75%;pointer-events:none;touch-action:none}
.panel{z-index:1;width:100%;max-width:480px;height:100%;background:#FFF7E8;display:flex;flex-direction:column;min-height:0;
 box-shadow:0 0 0 2px #17292e,0 18px 70px #102329bb}
header{position:relative;flex:none;text-align:center;padding:27px 15px 12px;background:#20343D;color:#FFF7E8;border-bottom:3px solid #ecac68}
header::before{content:"";position:absolute;inset:0 0 auto;height:16px;
 background:repeating-linear-gradient(100deg,#fae3b4 0 28px,#78a89a 28px 56px);
 border-bottom:3px solid #121f23;box-shadow:0 3px 0 #102329}
h1{margin:0;font-size:clamp(24px,6vw,28px);font-weight:900;line-height:1.08;letter-spacing:-.045em;text-wrap:balance}
#intro{margin:7px 0 0;color:#e2eee6;text-wrap:balance}
#editScreen,#resultScreen{display:flex;flex-direction:column;flex:1;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 16px 12px;touch-action:pan-y;overscroll-behavior:contain;scroll-padding:8px}
.art{pointer-events:none;touch-action:none;display:block;margin:-10px -16px 10px;width:calc(100% + 32px);height:auto;background:#20343D}
.hero-fish{transform-box:fill-box;transform-origin:center;animation:rise .65s cubic-bezier(.2,.75,.25,1) both;--blink:blink 2s .4s both}
.hero-fish.second{animation-delay:.1s;--blink:blink 2s .9s both}
.fish-eye{transform-box:fill-box;transform-origin:center;animation:var(--blink,none)}
@keyframes rise{from{opacity:.55;transform:translateY(7px) scale(.94,1.04)}to{opacity:1;transform:none}}
@keyframes blink{0%,82%,95%,100%{transform:none}88%{transform:scaleY(.12)}}
.field{margin:0 0 9px;display:grid;grid-template-columns:minmax(0,1fr) minmax(105px,1fr);gap:2px 10px;align-items:center}
label{display:block;font-weight:800}
.row{position:relative;display:flex;align-items:center}
input[type=text]{width:100%;min-width:0;min-height:46px;font:inherit;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
 padding:5px 3.1em 5px 10px;border:1.5px solid #846c54;border-radius:6px;background:#fffdf6;color:#302A25;box-shadow:inset 0 2px 0 #e9dcc8}
input[type=text]:focus{border-color:#155D63}
input[type=text][aria-invalid=true]{border-color:#A02F32;background:#fff4f3}
.unit{position:absolute;right:9px;color:#62594E;pointer-events:none}
.hint{grid-column:1/-1;font-size:16px;color:#62594E}
.err{grid-column:1/-1;color:#A02F32;font-weight:650}
.err:empty{display:none}
button{font:inherit;font-weight:800;min-height:48px;min-width:48px;padding:7px 12px;border-radius:8px;border:1.5px solid #155D63;
 background:#FFF7E8;color:#155D63;cursor:pointer;touch-action:manipulation}
button.primary{background:#155D63;color:#fff;box-shadow:inset 0 -4px 0 #0c444a}
@media(hover:hover){button:not(:disabled):hover{filter:brightness(.94)}}
button:disabled,button[aria-disabled=true]{opacity:.45;cursor:not-allowed}
button.press{transform:scale(.97,.94)}
button:focus-visible,input:focus-visible,textarea:focus-visible,h2:focus-visible{outline:3px solid #155D63;outline-offset:2px}
.preview{margin:0 16px 6px;padding:8px 12px 8px 15px;border-radius:4px 12px 12px 4px;background:#d8e9dd;
 border:1px solid #91aba0;border-left:5px solid #155D63}
.preview b{display:block}
.preview .sum{font-size:16px;font-variant-numeric:tabular-nums}
.preview .sum span{white-space:nowrap}
.preview .emp{float:left;margin:2px 8px 0 0;width:36px;height:auto;pointer-events:none}
.preview .fade{animation:fade .12s linear}
@keyframes fade{from{opacity:.78}to{opacity:1}}
.note{color:#62594E;margin:8px 0 0}
.bar{display:flex;gap:8px;padding:6px 16px;background:#FFF7E8}
.bar button{flex:1}
.bar #viewBag{flex:1.5}
#status{flex:none;height:44px;padding:2px 16px;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
#status.fail{color:#A02F32;font-weight:650}

/* The bag sits under the awning, with its handles against the shop window. */
#resScroll{position:relative;background:linear-gradient(#20343D 0 90px,#FFF7E8 90px);padding-inline:20px}
.window{position:absolute;top:0;left:0;width:100%;height:103px;pointer-events:none;touch-action:none}
.bag{position:relative;isolation:isolate;margin-bottom:16px}
.handles{display:block;width:clamp(140px,58%,245px);height:46px;margin:0 auto -2px;pointer-events:none;overflow:visible}
.card{position:relative;padding:0 16px 13px;border:2px solid #704929;border-radius:6px 7px 19px 16px;
 background:linear-gradient(99deg,#a1643828 0 4%,transparent 4.3% 94%,#99603740 94.3%),repeating-linear-gradient(93deg,#7e4b1d0d 0 1px,transparent 1px 7px),linear-gradient(#f0cb91,#DBAD73);
 box-shadow:0 5px 0 #9b6e44,0 8px 0 #302a2525}
.card::after{content:"";position:absolute;inset:12px 6px 8px;border:1px solid #794e292b;border-top:0;border-radius:0 0 13px 13px;pointer-events:none}
.fold{height:18px;margin:0 -16px;background:linear-gradient(177deg,#ffe5ad 0 32%,#e5ab70 34%);border-radius:3px 4px 0 0;border-bottom:2px dashed #87552f}
.card h2{margin:9px 0 6px;font-size:clamp(24px,6vw,28px);font-weight:900;line-height:1.13;text-align:center;letter-spacing:-.045em;text-wrap:balance}
.bag.pop{transform-origin:50% 22%;animation:land .16s ease-out}
@keyframes land{0%{transform:scale(.98,1.025)}55%{transform:scale(1.006,.99)}100%{transform:scale(1)}}
.seals{position:absolute;inset:30px 0 auto;z-index:2;pointer-events:none;touch-action:none}
.seals path{opacity:0;transform-box:fill-box;transform-origin:center}
.bag.pop .seals path{animation:fleck .16s ease-out both}
@keyframes fleck{0%{opacity:.95;transform:translateY(7px) scale(.4)}65%{opacity:.78}100%{opacity:0;transform:translateY(-8px) scale(1)}}
.flavors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grp{min-width:0;position:relative;text-align:center;padding:5px 4px 7px;
 border:1px solid #94633e;border-bottom:3px solid #77465A;border-radius:50% 50% 9px 9px / 12px 12px 9px 9px;background:#fff0cfb3}
.grp.c{border-bottom-color:#b27b27;background:#ffe4a7bc}
.tray{height:70px;display:grid;place-items:center;pointer-events:none;touch-action:none}
.tray svg{display:block;width:100%;height:100%;max-height:70px;filter:drop-shadow(0 2px 0 #894a233c)}
.cnt{font-size:clamp(17px,4.4vw,23px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.035em}
.up{margin-top:2px;font-variant-numeric:tabular-nums}
dl.sum{margin:0;padding-top:6px;border-top:1px dashed #87552f}
dl.sum div{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
dl.sum dt,dl.sum dd{margin:0}
dl.sum dd{font-weight:800;white-space:nowrap}
dl.sum .tot{font-size:24px;font-weight:900;background:#ffe9bd;border-radius:5px;padding:2px 8px;margin:3px -2px}
.fill{height:8px;display:flex;overflow:hidden;margin-top:7px;background:#fff1d2;outline:1px solid #825a36;border-radius:10px}
.fill span:first-child{background:repeating-linear-gradient(115deg,#77465A 0 5px,#9b6478 5px 8px)}
.fill span:nth-child(2){background:radial-gradient(circle at 2px 2px,#997128 1px,#E5B647 1.3px);background-size:5px 5px}
.exact{display:table;margin:7px 0 0 auto;padding:1px 7px;border:1px solid #155D63;border-radius:4px;color:#124f54;font-weight:800;background:#e1ecda}
.card .note{color:#302A25;margin-top:6px}
.sig{text-align:right;font-size:16px;font-weight:850;margin-top:6px}
h3{margin:14px 0 6px;font-size:18px;font-weight:850}
#combos{display:flex;flex-direction:column;gap:6px}
#combos button{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:#fffdf6;border-color:#a08868;color:#302A25;font-variant-numeric:tabular-nums}
#combos button[aria-pressed=true]{border-color:#155D63;box-shadow:inset 4px 0 #155D63;background:#d8e9dd}
#combos .ck{display:inline-block;width:1.1em;font-weight:900;color:#155D63}
#combos .lf{flex:none;font-weight:650;color:#62594E}
.resultActions{position:sticky;bottom:-12px;background:#FFF7E8;border-top:1px solid #d3b998;margin:12px -5px 0;padding:7px 5px}
#resScroll{scroll-padding-bottom:125px}
#resScroll:has(#fb:not([hidden])){scroll-padding-bottom:8px}
#resScroll:has(#fb:not([hidden])) .resultActions{position:static}
.two{display:flex;gap:8px}
.two button{flex:1}
#editBtn{width:100%;margin-top:5px}
#fb{margin-top:12px;padding:10px;border:2px solid #155D63;border-radius:8px;background:#fffdf6}
#fb p{margin:0 0 6px}
#fb textarea{width:100%;min-height:150px;font:inherit;padding:8px;border:2px solid #846c54;border-radius:6px;touch-action:pan-y}
#fb button{margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.paused *{animation-play-state:paused!important}
.nomotion *{animation:none!important;transition:none!important}
.demo #status,.demo #comboSection,.demo .resultActions{display:none}
.demo #resScroll{padding:22px 30px 18px;background:linear-gradient(0deg,#906047 0 20px,#c48d5e 20px 25px,transparent 25px),radial-gradient(ellipse at 50% 30%,#45646b,#20343D 74%)}
.demo .window{height:142px}
.demo .bag{max-width:410px;margin-inline:auto}
.demo .handles{height:48px}
.demo .tray,.demo .tray svg{height:76px;max-height:76px}
@media(max-height:670px){
 .art{height:94px}
}
@media(max-height:520px){
 header{padding-block:21px 8px}
 #intro{margin-top:4px;line-height:1.2}
 .art{display:none}
 .hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 #resScroll{scroll-padding-top:5px}
 .handles{height:30px}
 .tray,.tray svg{height:43px;max-height:43px}
}
@media(max-width:360px){
 .scroll,#resScroll,.bar,#status{padding-inline:12px}
 #status{height:64px}
 .art{margin-inline:-12px;width:calc(100% + 24px)}
 .preview{margin-inline:12px}
 .card{padding-inline:11px}
 .fold{margin-inline:-11px}
 .bar button,#combos button{padding-inline:8px}
 .demo #resScroll{padding-inline:12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}button.press{transform:none}}
</style>
</head>

<script>
(function(){

function parse(s,max,rk){
 s=String(s);
 if(s.length>12)return{e:'invalidInteger'};
 s=s.trim();
 if(!s)return{e:'required'};
 if(!(/^\d+$/.test(s)||/^[1-9]\d{0,2}(,\d{3})+$/.test(s)))return{e:'invalidInteger'};
 var n=+s.replace(/,/g,'');
 if(n<100||n>max)return{e:rk};
 if(n%100)return{e:'invalidStep'};
 return{n:n};
}
function combosFor(b,rp,cp){
 var a=[];
 for(var r=0;r<=Math.floor(b/rp);r++){
  var max=Math.floor((b-r*rp)/cp);
  // For a fixed red count, every lower custard count ranks behind these three.
  for(var c=max;c>=Math.max(0,max-2)&&r+c>0;c--){
   var tot=r*rp+c*cp;
   a.push({red:r,custard:c,total:tot,left:b-tot,count:r+c,imb:Math.abs(r-c)});
  }
 }
 a.sort(function(x,y){return y.count-x.count||x.imb-y.imb||x.left-y.left||y.red-x.red});
 return a.slice(0,3);
}
