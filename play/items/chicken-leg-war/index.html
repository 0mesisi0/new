<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9bf50">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f9bf50'/%3E%3Cpath d='M12 20 7 25m0-4c-7 0-5 9 0 6 4 4 9-2 5-5' fill='%23fff4d7' stroke='%23341d30' stroke-width='2'/%3E%3Cpath d='M10 20c0-2 2-4 3-8 2-8 12-9 15-2 4 9-6 13-11 12-3 0-5 2-7-2Z' fill='%23e47a3b' stroke='%23341d30' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    color: #341d30;
    font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --ink: #341d30;
    --paper: #fff4d7;
    --gold: #f9bf50;
    --pink: #f6a39d;
    --green: #bce1a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: repeating-linear-gradient(135deg, #321d33 0 10px, #3c243c 10px 12px); }
  [hidden] { display: none !important; }
  h1, h2, p { margin: 0; }
  button, textarea { color: inherit; font: inherit; }
  button {
    min-width: 44px; min-height: 44px; border: 2px solid var(--ink);
    border-radius: 10px 8px 11px 7px; background: var(--paper);
    touch-action: manipulation; cursor: pointer; font-weight: 900;
  }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #773c85; outline-offset: 2px; }
  #app {
    width: min(100%, 550px); height: 100vh; height: 100dvh; margin: auto;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
    background: var(--gold); box-shadow: 0 0 55px #1e1025ab;
    isolation: isolate;
  }
  header {
    min-height: 50px; display: flex; justify-content: space-between; align-items: center;
    gap: 6px; padding: 3px clamp(10px, 4vw, 22px);
    background: var(--paper); border-bottom: 2px solid var(--ink);
  }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 900; }
  .brand svg { width: 26px; height: 26px; }
  .tools { display: flex; gap: 5px; }
  .tools button { padding: 0 8px; font-size: 12px; }
  #mute svg { width: 22px; height: 22px; display: block; }
  #mute[aria-pressed="true"] .waves, #mute[aria-pressed="false"] .slash { display: none; }
  .heading { padding: 9px 14px 4px; text-align: center; }
  #premise { font-size: clamp(12px, 3.8vw, 17px); font-weight: 850; }
  h1 {
    font-size: clamp(29px, 10vw, 59px); line-height: 1.03; font-weight: 1000;
    letter-spacing: -.075em; text-shadow: 2px 2px var(--paper);
  }
  html:lang(en) h1 { font-style: italic; letter-spacing: -.075em; }
  #hud { padding: 8px clamp(12px, 4vw, 24px) 4px; }
  .numbers { display: flex; justify-content: space-between; align-items: baseline; gap: 5px; font-size: 12px; font-weight: 850; }
  .numbers strong { font-size: clamp(17px, 5.2vw, 25px); font-variant-numeric: tabular-nums; }
  .track { height: 8px; margin-top: 4px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--paper); overflow: hidden; }
  #time-bar { height: 100%; background: var(--ink); transform-origin: left; }
  #stage { position: relative; display: grid; place-items: center; min-height: 0; min-width: 0; overflow: hidden; }
  #art { width: 100%; height: 100%; min-height: 0; display: block; }
  .stage-line {
    position: absolute; top: 3%; left: 50%; transform: translateX(-50%); width: max-content;
    max-width: 94%; padding: 5px 10px; border: 2px solid var(--ink);
    border-radius: 13px 11px 11px 3px; background: var(--paper); box-shadow: 2px 3px var(--ink);
    text-align: center; font-size: clamp(12px, 3.5vw, 16px); line-height: 1.2; font-weight: 900;
    pointer-events: none;
  }
  .stage-line:empty { display: none; }
  #stage[data-phase="strike"] .stage-line { background: var(--green); }
  #stage[data-phase="mash"] .stage-line, #stage[data-phase="miss"] .stage-line { background: var(--pink); }
  .face { animation: bob 3.2s ease-in-out infinite; }
  .dad .face { animation-delay: -.8s; }
  .sib .face { animation-delay: -1.7s; }
  .blink { animation: blink 4.7s linear infinite; }
  .mom .blink { animation-delay: -1.5s; }
  .sib .blink { animation-delay: -3s; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  @keyframes blink { 0%, 94%, 100% { opacity: 1; } 96%, 98% { opacity: 0; } }
  .look, .reach, .burst, .gone, .marker { display: none; }
  #stage[data-person="dad"] .dad .look,
  #stage[data-person="mom"] .mom .look,
  #stage[data-person="sib"] .sib .look { display: inline; }
  #stage[data-person="dad"] .dad .calm,
  #stage[data-person="mom"] .mom .calm,
  #stage[data-person="sib"] .sib .calm { display: none; }
  #stage[data-person="dad"] .reach.dad,
  #stage[data-person="mom"] .reach.mom,
  #stage[data-person="sib"] .reach.sib { display: inline; }
  .reach path { transition: transform .17s ease-out; }
  #stage[data-phase="windup"] .reach.dad path,
  #stage[data-phase="swat"] .reach.dad path { transform: translate(-36px, -22px); }
  #stage[data-phase="windup"] .reach.mom path,
  #stage[data-phase="swat"] .reach.mom path { transform: translateY(-30px); }
  #stage[data-phase="windup"] .reach.sib path,
  #stage[data-phase="swat"] .reach.sib path { transform: translate(34px, -23px); }
  #stage[data-phase="miss"] #my-leg { opacity: 0; }
  #stage[data-phase="miss"] .gone, #stage[data-phase="swat"] .burst,
  #stage[data-phase="strike"] .marker, #stage[data-phase="mash"] .marker { display: inline; }
  .burst { transform-origin: 167px 257px; animation: impact .25s ease-out; }
  @keyframes impact { 0% { opacity: .35; transform: rotate(-13deg) translateY(7px); } }
  .bottom {
    min-width: 0; padding: 9px clamp(12px, 4vw, 23px) 13px; border-top: 2px solid var(--ink);
    text-align: center; background: var(--paper);
  }
  .bottom p { font-size: clamp(12px, 3.6vw, 16px); font-weight: 750; line-height: 1.25; }
  .primary {
    width: 100%; min-height: 52px; margin-top: 7px; padding: 5px 9px;
    background: var(--gold); box-shadow: 0 4px var(--ink);
    font-size: clamp(16px, 5vw, 24px); line-height: 1.08;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px var(--ink); }
  #action { touch-action: none; user-select: none; min-height: 58px; }
  #action[data-phase="strike"] { background: var(--green); }
  #action[data-phase="mash"] { background: var(--pink); }
  #action small { display: block; margin-top: 3px; font-size: 11px; }
  #cue { min-height: 2.5em; display: grid; place-items: center; }
  #result h2 { font-size: clamp(20px, 6vw, 34px); line-height: 1.05; letter-spacing: -.05em; }
  #record { margin: 5px 0 3px; font-weight: 900; }
  .result-actions { display: grid; grid-template-columns: 1.1fr 1fr; align-items: stretch; gap: 7px; margin-top: 7px; }
  .result-actions button { padding: 5px; min-height: 46px; margin: 0; }
  #share { background: var(--green); }
  #share-text { width: 100%; min-height: 44px; height: 58px; margin-top: 9px; resize: none; padding: 4px; background: #fffdf4; font-size: 12px; }
  @media (max-height: 510px) and (orientation: portrait) {
    .heading { padding-top: 5px; }
    .bottom { padding-block: 6px 10px; }
  }
  @media (max-height: 440px) and (orientation: landscape) {
    html, body { overflow: auto; }
    #app {
      width: min(100%, 760px); height: auto; min-height: 100vh; min-height: 100dvh;
      grid-template-columns: minmax(0, 1fr) minmax(175px, .83fr);
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    header { grid-column: 1 / -1; }
    .heading, #hud { grid-column: 2; grid-row: 2; }
    h1 { font-size: clamp(24px, 6vw, 38px); }
    #premise { font-size: 12px; }
    #stage { grid-column: 1; grid-row: 2 / 4; min-height: 237px; }
    .bottom { grid-column: 2; grid-row: 3; align-self: end; border-left: 2px solid var(--ink); }
    .bottom p { font-size: 12px; }
    .primary { font-size: 17px; }
    .stage-line { font-size: 11px; }
    #app[data-mode="result"] .heading { display: none; }
    #app[data-mode="result"] .bottom { align-self: center; }
    #result h2 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .primary:active { transform: none; }
  }
</style>
</head>

      windups: ["“난 목이면 돼.” (목은 반대쪽)", "“잘 먹나 보려고.” (손도 같이 봄)", "“나 닭가슴살만 먹어.” (시선 불일치)"],
      dodges: ["“아빠는 원래 껍질만 먹어.”", "“엄마는 그냥 옮겨준 거야.”", "“이게 다리였어?”"],
      steals: ["“아빠가 월급날에 사온 거야.”", "“엄마가 발라줄게.” (본인 입으로)", "“단백질 보충 완료.”"],
      streak: function (n) { return n + "연속"; },
      points: function (n) { return n + "점"; },
      record: function (score, best, saves) { return score + "점 · 최고 " + best + "점 · " + saves + "번 사수"; },
      grades: [
        ["무 국물 수석", "치킨은 못 먹었지만 무 국물 리필은 결재 났습니다."],
        ["닭가슴살 대리", "다리 결재 올렸다가 ‘가슴살 2조각 지급’으로 반려."],
        ["다리 방어팀 과장", "가족 단톡방에 ‘다리 담당자’로 저장됐습니다."],
        ["닭다리 본부장", "내일부터 메뉴는 순살입니다. 가족 만장일치."]
      ]
    },
    en: {
      brand: "Daily Toybox", title: "Chicken Leg War", premise: "Four people. Two drumsticks.",
      poster: "Can anyone sign off on the breast meat?",
      how: "Tap on green. When Mom objects, tap four times.",
      start: "Play 42 seconds", reset: "Restart", retry: "Play again", share: "Copy result", copied: "Copied",
      shareText: "Result to share", score: "Score", best: "Best", seconds: "s", mute: "Mute sound", unmute: "Turn sound on",
      ready: "Wait for green", wait: "Hold it!", strike: "Swat now!", mash: "Tap four times!",
      key: "Space / Enter", early: "Too soon! Wait for the grab.", safe: "Leg secured!", miss: "Leg stolen!",
      mom: "“You already had a drumstick.”", denial: "I'd like to see the minutes.", denialFail: "Family vote: you ate it.",
      fresh: "Fresh plate. Breast meat still available.",
      people: ["Dad", "Mom", "Your sibling"],
      windups: ["“I only want the neck.” (Wrong side, Dad.)", "“Just checking if you're eating well.” (With her hand.)", "“I only eat breast meat.” (Eyes say otherwise.)"],
      dodges: ["“I only wanted the skin anyway.”", "“I was just moving it for you.”", "“Wait, THAT was a drumstick?”"],
      steals: ["“Who paid for dinner again?”", "“I'll debone it for you.” (Into her mouth.)", "“Protein target met.”"],
      streak: function (n) { return n + " in a row"; },
      points: function (n) { return n + " pts"; },
      record: function (score, best, saves) { return score + " pts · Best " + best + " · " + saves + " saves"; },
      grades: [
        ["Radish Brine Intern", "Your chicken request was denied. Another brine refill was approved."],
        ["Breast Meat Associate", "Requested one drumstick. Approved for two pieces of breast meat."],
        ["Drumstick Defense Manager", "You've been saved as ‘Drumstick Contact’ in the family chat."],
        ["Director of Drumsticks", "Family vote: we're ordering boneless tomorrow."]
      ]
    }
  };
  const requested = new URLSearchParams(location.search).get("lang") || navigator.language;
  const lang = /^ko/i.test(requested) ? "ko" : "en";
  const t = copy[lang];
  const el = function (id) { return document.getElementById(id); };
  document.documentElement.lang = lang;
  document.title = t.title;
  Array.prototype.forEach.call(document.querySelectorAll("[data-text]"), function (node) {
    node.textContent = t[node.dataset.text];
  });
  el("share-text").setAttribute("aria-label", t.shareText);

  const roundLength = 42;
  const actors = ["dad", "mom", "sib"];
  const key = "daily-toybox:chicken-leg-war:";
  const stage = el("stage");
  const action = el("action");
  const cue = el("cue");
  const mute = el("mute");
  const line = el("line");
  let mode = "intro", phase = "", frame = 0, previous = 0;
  let elapsed = 0, deadline = 0, opensAt = 0, score = 0, saves = 0, streak = 0;
  let actor = 0, encounters = 0, taps = 0, lastTap = 0, lastSecond = 0, whiffUntil = 0;
  let best = 0, muted = false, audio;
  let shareRun = 0;
  try {
    best = Math.max(0, parseInt(localStorage.getItem(key + "best"), 10) || 0);
    muted = localStorage.getItem(key + "mute") === "1";
  } catch (error) {}
  line.textContent = t.poster;

  function renderMute() {
    mute.setAttribute("aria-pressed", String(muted));
    mute.setAttribute("aria-label", muted ? t.unmute : t.mute);
  }
  function unlock() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (muted || !Audio) return;
    try {
      if (!audio) audio = new Audio();
      if (audio.state === "suspended") audio.resume().catch(function () {});
    } catch (error) {}
  }
  function sound(from, to, duration, type) {
    if (muted || !audio || audio.state !== "running") return;
    const now = audio.currentTime;
    const tone = audio.createOscillator();
    const gain = audio.createGain();
    tone.type = type;
    tone.frequency.setValueAtTime(from, now);
    tone.frequency.exponentialRampToValueAtTime(to, now + duration);
    gain.gain.setValueAtTime(.12, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + duration);
    tone.connect(gain);
    gain.connect(audio.destination);
    tone.start(now);
    tone.stop(now + duration);
  }
  renderMute();
  mute.addEventListener("click", function () {
    muted = !muted;
    try { localStorage.setItem(key + "mute", muted ? "1" : "0"); } catch (error) {}
    renderMute();
    unlock();
  });

  function showPhase(next, duration, bubble, instruction, verb, hint) {
    phase = next;
    deadline = elapsed + duration;
    stage.dataset.phase = next;
    stage.dataset.person = next === "rest" ? "" : actors[actor];
    action.dataset.phase = next;
    line.textContent = bubble;
    cue.textContent = instruction;
    el("verb").textContent = verb;
    el("hint").textContent = hint || t.key;
  }

  function nextHand() {
    encounters += 1;
    const difficulty = elapsed / roundLength;
    if (encounters % 5 === 4) {
      actor = 1;
      taps = 0;
      lastTap = -1;
      showPhase("mash", 1.56 - .42 * difficulty, t.mom, t.mash, t.mash, "0 / 4");
      sound(290, 105, .19, "triangle");
      return;
    }
    actor = (actor + 1 + Math.floor(Math.random() * 2)) % actors.length;
    showPhase("windup", .53 - .27 * difficulty + Math.random() * .3, t.windups[actor], t.ready, t.wait);
  }

  function resolve(saved, objection) {
    if (saved) {
      saves += 1;
      streak += 1;
      const points = (objection ? 22 : 10 + Math.floor(6 * Math.max(0, 1 - (elapsed - opensAt) / (deadline - opensAt)))) + Math.min(streak - 1, 8);
      score += points;
      el("score").textContent = score;
      showPhase("swat", .34, objection ? t.denial : t.dodges[actor], t.safe + " +" + t.points(points), t.safe, t.streak(streak));
      sound(170, 540, .13, "triangle");
    } else {
      streak = 0;
      showPhase("miss", .46, objection ? t.denialFail : t.steals[actor], t.miss, t.miss);
      sound(225, 65, .20, "sine");
    }
  }

  function updateRound() {
    if (elapsed < deadline) return;
    if (phase === "rest") {
      nextHand();
    } else if (phase === "windup") {
      opensAt = elapsed;
      showPhase("strike", .86 - .42 * (elapsed / roundLength), t.people[actor], t.strike, t.strike);
      sound(450, 610, .07, "sine");
    } else if (phase === "strike" || phase === "mash") {
      resolve(false, phase === "mash");
    } else {
      showPhase("rest", .46 - .27 * (elapsed / roundLength) + Math.random() * .28, "", t.ready, t.wait);
    }
  }

  function playTap() {
    if (mode !== "play" || document.hidden || elapsed < whiffUntil) return;
    if (phase === "strike") {
      resolve(true, false);
    } else if (phase === "mash" && elapsed - lastTap >= .055) {
      lastTap = elapsed;
      taps += 1;
      if (taps === 4) {
        resolve(true, true);
      } else {
        el("hint").textContent = taps + " / 4";
        sound(170 + 75 * taps, 90 + 72 * taps, .07, "triangle");
      }
    } else if (phase === "rest" || phase === "windup") {
      streak = 0;
      whiffUntil = elapsed + .27;
      cue.textContent = t.early;
      sound(115, 75, .08, "sine");
    }
  }

  function tick(now) {
    frame = 0;
    if (mode !== "play" || document.hidden) return;
    elapsed += previous ? Math.min((now - previous) / 1000, .08) : 0;
    previous = now;
    const time = Math.max(0, roundLength - elapsed);
    const seconds = Math.ceil(time);
    if (lastSecond !== seconds) {
      lastSecond = seconds;
      el("seconds").textContent = seconds;
    }
    el("time-bar").style.transform = "scaleX(" + (time / roundLength) + ")";
    if (!time) {
      finish();
      return;
    }
    updateRound();
    frame = requestAnimationFrame(tick);
  }

  function start() {
    unlock();
    cancelAnimationFrame(frame);
    shareRun += 1;
    mode = "play";
    el("app").dataset.mode = mode;
    previous = 0;
    elapsed = 0;
    score = 0;
    saves = 0;
    streak = 0;
    actor = 1;
    encounters = 0;
    taps = 0;
    lastTap = -1;
    opensAt = 0;
    whiffUntil = 0;
    lastSecond = roundLength;
    el("seconds").textContent = roundLength;
    el("time-bar").style.transform = "scaleX(1)";
    el("score").textContent = score;
    el("best").textContent = best;
    el("heading").hidden = true;
    el("hud").hidden = false;
    el("intro").hidden = true;
    el("result").hidden = true;
    el("controls").hidden = false;
    el("reset").hidden = false;
    showPhase("rest", .72, t.fresh, t.ready, t.wait);
    action.focus({ preventScroll: true });
    if (!document.hidden) frame = requestAnimationFrame(tick);
  }

  function finish() {
    mode = "result";
    el("app").dataset.mode = mode;
    if (score > best) {
      best = score;
      try { localStorage.setItem(key + "best", String(best)); } catch (error) {}
    }
    const grade = t.grades[score >= 335 ? 3 : score >= 190 ? 2 : score >= 65 ? 1 : 0];
    el("hud").hidden = true;
    el("heading").hidden = false;
    el("controls").hidden = true;
    el("reset").hidden = true;
    el("result").hidden = false;
    stage.dataset.phase = "";
    stage.dataset.person = "";
    line.textContent = "";
    el("grade").textContent = grade[0];
    el("quip").textContent = grade[1];
    el("record").textContent = t.record(score, best, saves);
    el("share").textContent = t.share;
    el("share-text").hidden = true;
    const link = new URL("../../" + lang + "/chicken-leg-war/", location.href);
    el("share-text").value = t.title + "\n" + grade[0] + " · " + t.points(score) + "\n" + link.href;
    el("retry").focus({ preventScroll: true });
    sound(290, 680, .25, "triangle");
  }

  ["start", "retry", "reset"].forEach(function (id) { el(id).addEventListener("click", start); });
  action.addEventListener("pointerdown", function (event) {
    if (!event.isPrimary || event.button !== 0) return;
    event.preventDefault();
    unlock();
    playTap();
  });
  action.addEventListener("click", function (event) {
    if (event.detail === 0) playTap();
  });
  document.addEventListener("keydown", function (event) {
    if (event.key !== " " && event.key !== "Enter") return;
    if (event.ctrlKey || event.metaKey || event.altKey || event.target === el("share-text")) return;
    if (event.target.tagName === "BUTTON" && event.target !== action) {
      if (event.repeat) event.preventDefault();
      return;
    }
    event.preventDefault();
    if (event.repeat) return;
    if (mode === "play") {
      unlock();
      playTap();
    } else {
      start();
    }
  });
  document.addEventListener("visibilitychange", function () {
    cancelAnimationFrame(frame);
    frame = 0;
    previous = 0;
    if (document.hidden) {
      if (audio && audio.state === "running") audio.suspend().catch(function () {});
    } else if (mode === "play") {
      unlock();
      frame = requestAnimationFrame(tick);
    }
  });
  el("share").addEventListener("click", async function () {
    const run = ++shareRun;
    const field = el("share-text");
    try {
      await navigator.clipboard.writeText(field.value);
      if (shareRun !== run || mode !== "result") return;
      el("share").textContent = t.copied;
      field.hidden = true;
    } catch (error) {
      if (shareRun !== run || mode !== "result") return;
      field.hidden = false;
      field.focus({ preventScroll: true });
      field.select();
    }
  });
})();
</script>
</body>
</html>
