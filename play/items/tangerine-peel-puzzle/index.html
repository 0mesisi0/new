<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>귤껍질 한 줄 퍼즐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF7E8;color:#30231B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif}
body{height:100vh;height:100dvh;width:100vw}
#app{height:100%;max-width:440px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.top{display:flex;justify-content:space-between;width:100%;font-size:14px;font-weight:700}
.score{font-size:20px;font-weight:800;min-height:24px}
h1{margin:0;font-size:26px}
h2{margin:0;font-size:20px;line-height:1.2}
.hint{font-size:14px;margin:0;min-height:34px;display:flex;align-items:center;justify-content:center}
.badge{display:inline-block;background:#2F6347;color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;min-height:24px}
.plate{background:#FFFDF7;border-radius:26px;padding:10px;box-shadow:0 3px 0 #E8D5B0,0 8px 18px rgba(48,35,27,.12)}
.board{position:relative;isolation:isolate;display:grid;gap:3px;width:var(--b);height:var(--b);touch-action:none;user-select:none;-webkit-user-select:none;border-radius:14px}
.board:focus-visible{outline:3px solid #1E6FD9;outline-offset:5px}
.cell{position:relative;background:#F69A35;border-radius:10px;min-width:0;min-height:0;box-shadow:inset 0 0 0 2px #B8620F}
.cell.v{background:#FBE3B8}
.cell.e:not(.v){background:#F69A35}
.cell::after{content:"";position:absolute;inset:2px;border-radius:9px;pointer-events:none;z-index:3}
.cell.a::after{border:2px dashed #30231B}
.cell.t::after{border:4px double #30231B}
.cell svg.mark{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.gap{background:transparent}
.rib{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.curl{transform-box:fill-box;transform-origin:center;animation:curl .12s ease-out}
@keyframes curl{from{transform:scale(.4)}to{transform:scale(1)}}
.seg{stroke-dasharray:1;animation:seg .24s ease-out}
@keyframes seg{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pop{transform-origin:center;animation:pop .3s .12s ease-out}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
html.hid .curl,html.hid .seg,html.hid .pop{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.curl,.seg,.pop{animation:none}}
button.cell{display:block;padding:0;min-width:0;min-height:0;flex:none;border:0;border-radius:10px;font:inherit;color:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px #B8620F}
button.cell:active{transform:none;box-shadow:inset 0 0 0 2px #B8620F}
.foot{display:flex;gap:10px;width:100%}
button{font:inherit;font-weight:800;font-size:16px;min-height:48px;min-width:44px;border:0;border-radius:14px;background:#F69A35;color:#30231B;padding:0 14px;cursor:pointer;box-shadow:0 3px 0 #C4741B;flex:1}
button.sec{background:#FFFDF7;box-shadow:0 3px 0 #E8D5B0}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #1E6FD9;outline-offset:3px}
button.big{min-height:56px;font-size:20px;width:100%;flex:none}
@media (max-height:420px) and (max-width:479px){
#app{padding:4px 16px;gap:3px}
h1{font-size:20px}h2{font-size:17px;line-height:1.1}
.score{font-size:17px;min-height:20px}
.hint{font-size:12px;min-height:0}
.plate{padding:5px}
.top{font-size:12px}
button{min-height:44px}button.big{min-height:44px;font-size:18px}
.bd{min-height:0!important}.badge{min-height:20px;padding:1px 10px}
.plate[aria-hidden=true] .board{width:140px;height:140px}
}
@media (max-height:420px) and (min-aspect-ratio:1/1) and (min-width:480px){
#app{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:0;align-content:center;align-items:center;max-width:640px;padding:8px 16px}
#app>.plate{grid-column:1;grid-row:1/span 8;align-self:center}
#app>:not(.plate){grid-column:2;margin:3px 0}
h1{font-size:22px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(function(){
var I18N={
ko:{title:'귤껍질 한 줄 퍼즐',startHint:'귤껍질을 한 줄로 이어 꼭지까지 벗겨 보세요.',start:'벗기기 시작',boardNumber:'{n} / {total}판',boardLabel:'귤껍질 퍼즐판',score:'벗긴 칸 {score}/{max}',best:'최고 기록 {best}/{max}',playHint:'옆 칸을 누르거나 방향키로 움직이세요.',stuck:'갈 수 있는 칸이 없어요. 되돌리거나 다시 시작하세요.',undo:'되돌리기',restart:'다시 시작',retry:'다시 도전',next:'다음 판',complete:'꼭지까지 벗겼어요!',perfect:'껍질을 한 줄로 다 벗겼어요!',newBest:'새 최고 기록!',cellLabel:'{row}행 {col}열, {state}',cellTab:'시작 칸',cellPeel:'껍질',cellStem:'꼭지',cellPeeled:'벗긴 칸',cellTip:'현재 위치',cellAvailable:'이동 가능'},
en:{title:'Tangerine Peel Puzzle',startHint:'Peel one continuous strip all the way to the stem.',start:'Start peeling',boardNumber:'Board {n} of {total}',boardLabel:'Tangerine peel board',score:'Peeled {score}/{max}',best:'Best {best}/{max}',playHint:'Tap a neighboring square or use the arrow keys.',stuck:'No moves left. Undo or restart.',undo:'Undo',restart:'Restart',retry:'Try again',next:'Next board',complete:'You reached the stem!',perfect:'You peeled it all in one strip!',newBest:'New best!',cellLabel:'Row {row}, column {col}, {state}',cellTab:'cut tab',cellPeel:'peel',cellStem:'stem',cellPeeled:'peeled square',cellTip:'current tip',cellAvailable:'available'}
};
var lang=new URLSearchParams(location.search).get('lang');
if(lang!=='ko'&&lang!=='en')lang=((navigator.language||'en').split('-')[0].toLowerCase()==='ko')?'ko':'en';
var D=I18N[lang];
document.documentElement.lang=lang;document.title=D.title;
function t(k,v){var s=D[k];for(var x in v)s=s.replace('{'+x+'}',v[x]);return s}

var KEY='tangerine-peel-puzzle:v1:best';
var RAW=[['S..','...','..E'],['S...','....','....','..E.'],['#S..','....','....','#E..']];
var BOARDS=RAW.map(function(rows){
  var cells=rows.join('').split(''),cols=rows[0].length;
  return{rows:rows.length,cols:cols,cells:cells,s:cells.indexOf('S'),e:cells.indexOf('E'),cap:cells.filter(function(c){return c!=='#'}).length};
});
var bests=[0,0,0];
try{var a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))bests=BOARDS.map(function(b,i){var n=a[i];return(Number.isInteger(n)&&n>=0&&n<=b.cap)?n:0})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(bests))}catch(e){}}

var S={screen:'start',bi:0,route:[],newBest:false,fresh:false};
var app=document.getElementById('app'),live=document.getElementById('live');

var sayTimer=0;
function say(m){live.textContent='';clearTimeout(sayTimer);sayTimer=setTimeout(function(){live.textContent=m},30)}
function B(){return BOARDS[S.bi]}
function tip(){return S.route[S.route.length-1]}
function legal(){
  if(S.screen!=='play')return[];
  var b=B(),p=tip(),r=Math.floor(p/b.cols),c=p%b.cols,out=[];
  [[-1,0],[0,1],[1,0],[0,-1]].forEach(function(d){
    var nr=r+d[0],nc=c+d[1];
    if(nr<0||nc<0||nr>=b.rows||nc>=b.cols)return;
    var i=nr*b.cols+nc;
    if(b.cells[i]!=='#'&&S.route.indexOf(i)<0)out.push(i);
  });
  return out;
}

function ribbon(b,route,animate){
  var n=route.length;if(!n)return'';
  var P=route.map(function(i){return[(i%b.cols)*100+50,Math.floor(i/b.cols)*100+50]});
  var d='M'+P[0][0]+' '+P[0][1],cur=P[0];
  if(n===1)d+=' L'+P[0][0]+' '+P[0][1];
  var dBefore=d;
  for(var k=1;k<n;k++){
    if(k<n-1){
      var p=P[k],q=P[k-1],r=P[k+1];
      var ax=Math.sign(p[0]-q[0]),ay=Math.sign(p[1]-q[1]),bx=Math.sign(r[0]-p[0]),by=Math.sign(r[1]-p[1]);
      d+=' L'+(p[0]-ax*32)+' '+(p[1]-ay*32)+' Q'+p[0]+' '+p[1]+' '+(p[0]+bx*32)+' '+(p[1]+by*32);
      cur=[p[0]+bx*32,p[1]+by*32];dBefore=d;
    }else{dBefore=d+(n===2?' L'+cur[0]+' '+cur[1]:'');d+=' L'+P[k][0]+' '+P[k][1]}
  }
  var e=P[n-1];
  // final move: draw everything but the last segment, then slide the last segment in against the stem
  var fin=animate&&n>1&&route[n-1]===b.e;
  function pair(dd,cls,extra){return '<path d="'+dd+'" fill="none" stroke="#D96F12" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"'+extra+'/><path d="'+dd+'" fill="none" stroke="#F69A35" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"'+extra+'/>'}
  var body;
  if(fin)body=pair(dBefore,'','')+pair('M'+cur[0]+' '+cur[1]+' L'+e[0]+' '+e[1],'',' class="seg" pathLength="1"');
  else body=pair(d,'','')+(animate?'<circle class="curl" cx="'+e[0]+'" cy="'+e[1]+'" r="17" fill="#FFB866"/>':'');
  return '<svg class="rib" viewBox="0 0 '+b.cols*100+' '+b.rows*100+'" aria-hidden="true">'+body+'</svg>';
}
var TABSVG='<svg class="mark" viewBox="0 0 100 100"><path d="M8 8h34l10 12H8z" fill="#FFFDF7" stroke="#30231B" stroke-width="5" stroke-linejoin="round"/></svg>';
var STEMSVG='<svg class="mark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="#2F6347" stroke="#30231B" stroke-width="4"/><path d="M50 30V12" stroke="#2F6347" stroke-width="9" stroke-linecap="round"/><path d="M54 18q18-8 26 6q-18 8-26-6z" fill="#3E8A5F" stroke="#30231B" stroke-width="3"/></svg>';

// mode: 'play' (interactive), 'static' (labels, no focus), 'deco' (hidden preview)
function boardHTML(mode){
  var b=B(),route=S.route,lg=mode==='play'?legal():[],tp=mode==='deco'?-1:tip(),h='';
  var attrs=mode==='play'?' id="board" tabindex="0" role="group" aria-label="'+t('boardLabel')+'"':mode==='deco'?' aria-hidden="true"':' role="group" aria-label="'+t('boardLabel')+'"';
  h+='<div class="plate"'+(mode==='deco'?' aria-hidden="true"':'')+'><div class="board"'+attrs+' style="grid-template-columns:repeat('+b.cols+',1fr);grid-template-rows:repeat('+b.rows+',1fr)">';
  b.cells.forEach(function(ch,i){
    if(ch==='#'){h+='<div class="gap" aria-hidden="true"></div>';return}
    var v=route.indexOf(i)>=0,a=lg.indexOf(i)>=0,isT=i===tp&&mode!=='deco';
    var cls='cell'+(v?' v':'')+(a?' a':'')+(isT?' t':'')+(ch==='E'?' e':'');
    var parts=[];
    if(isT)parts.push(t('cellTip'));
    parts.push(ch==='S'?t('cellTab'):ch==='E'?t('cellStem'):v?t('cellPeeled'):t('cellPeel'));
    if(a)parts.push(t('cellAvailable'));
    var label=t('cellLabel',{row:Math.floor(i/b.cols)+1,col:i%b.cols+1,state:parts.join(', ')});
    var stem=STEMSVG;
    if(ch==='E'&&mode==='static'&&S.fresh)stem=STEMSVG.replace('class="mark"','class="mark pop"');
    var inner=(ch==='S'?TABSVG:ch==='E'?stem:'');
    if(a)h+='<button type="button" class="'+cls+'" data-i="'+i+'" tabindex="-1" aria-label="'+label+'">'+inner+'</button>';
    else h+='<div class="'+cls+'" data-i="'+i+'"'+(mode==='deco'?'':' role="img" aria-label="'+label+'"')+'>'+inner+'</div>';
  });
  h+=ribbon(b,route,mode!=='deco'&&S.fresh&&route.length>1)+'</div></div>';
  return h;
}

function render(){
  var b=B(),h='',n=S.bi;
  var best=t('best',{best:bests[n],max:b.cap});
  if(S.screen==='start'){
    h='<h1>'+t('title')+'</h1><p class="hint">'+t('startHint')+'</p>'+boardHTML('deco')+'<button class="big" id="go">'+t('start')+'</button>';
  }else if(S.screen==='play'){
    var stuck=legal().length===0;
    h='<div class="top"><span>'+t('boardNumber',{n:n+1,total:3})+'</span><span>'+best+'</span></div>'+
      '<div class="score">'+t('score',{score:S.route.length,max:b.cap})+'</div>'+boardHTML('play')+
      '<p class="hint">'+(stuck?t('stuck'):t('playHint'))+'</p>'+
      '<div class="foot"><button class="sec" id="undo"'+(S.route.length<2?' disabled':'')+'>'+t('undo')+'</button><button class="sec" id="restart">'+t('restart')+'</button></div>';
  }else{
    var sc=S.route.length;
    h='<div class="top"><span>'+t('boardNumber',{n:n+1,total:3})+'</span><span>'+best+'</span></div>'+
      '<h2 id="res-h">'+t(sc===b.cap?'perfect':'complete')+'</h2>'+
      '<div class="score" id="res-s">'+t('score',{score:sc,max:b.cap})+'</div>'+
      '<div class="bd" style="min-height:24px">'+(S.newBest?'<span class="badge">'+t('newBest')+'</span>':'')+'</div>'+boardHTML('static')+
      '<div class="foot"><button id="retry" aria-describedby="res-h res-s">'+t('retry')+'</button><button class="sec" id="next">'+t('next')+'</button></div>';
  }
  app.innerHTML=h;
  S.fresh=false;
}
function focusId(id){var e=document.getElementById(id);if(e)e.focus({preventScroll:true})}

function open(bi){S.screen='play';S.bi=bi;S.route=[BOARDS[bi].s];S.newBest=false;S.fresh=false;render();focusId('board');say(t('score',{score:1,max:BOARDS[bi].cap}))}
function restart(){open(S.bi)}
function undo(){
  if(S.screen!=='play'||S.route.length<2)return;
  var f=document.activeElement&&document.activeElement.id;
  S.route.pop();render();
  say(t('score',{score:S.route.length,max:B().cap})+(legal().length?'':'. '+t('stuck')));
  focusId(f==='undo'&&S.route.length>1?'undo':'board');
}
function move(i){
  if(S.screen!=='play'||legal().indexOf(i)<0)return;
  S.route.push(i);S.fresh=true;
  var b=B();
  if(i===b.e){
    S.screen='result';var sc=S.route.length;
    if(sc>bests[S.bi]){bests[S.bi]=sc;S.newBest=true;save()}
    render();focusId('retry');
    say(t(sc===b.cap?'perfect':'complete')+' '+t('score',{score:sc,max:b.cap}));
    return;
  }
  render();focusId('board');
  say(t('score',{score:S.route.length,max:b.cap})+(legal().length?'':'. '+t('stuck')));
}
function step(dr,dc){
  var b=B(),p=tip(),r=Math.floor(p/b.cols)+dr,c=p%b.cols+dc;
  if(r<0||c<0||r>=b.rows||c>=b.cols)return;
  move(r*b.cols+c);
}

// available squares are real buttons: one click = one move (primary tap/click, keyboard, or screen-reader activation).
// A press on one square released on another fires no click on either, so drags make no move.
app.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b)return;
  var id=b.id;
  if(b.dataset&&b.dataset.i!==undefined&&b.classList.contains('cell')){move(+b.dataset.i);return}
  if(id==='go')open(0);
  else if(id==='undo')undo();
  else if(id==='restart'||id==='retry')restart();
  else if(id==='next')open((S.bi+1)%3);
});
var ARROWS={ArrowUp:[-1,0],ArrowRight:[0,1],ArrowDown:[1,0],ArrowLeft:[0,-1]};
document.addEventListener('keydown',function(e){
  var tg=e.target;
  if(tg&&tg.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' ')&&e.repeat){e.preventDefault();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.repeat)return;
  if(S.screen==='start'&&e.key==='Enter'&&!(tg&&tg.tagName==='BUTTON')){e.preventDefault();open(0);return}
  if(S.screen!=='play')return;
  if(ARROWS[e.key]&&tg&&tg.closest&&tg.closest('#board')){e.preventDefault();step(ARROWS[e.key][0],ARROWS[e.key][1]);return}
  if(e.key==='z'||e.key==='Z'||e.code==='KeyZ'){e.preventDefault();undo()}
  else if(e.key==='r'||e.key==='R'||e.code==='KeyR'){e.preventDefault();restart()}
});

function size(){
  var land=matchMedia('(max-height:420px) and (min-aspect-ratio:1/1) and (min-width:480px)').matches;
  var tiny=!land&&matchMedia('(max-height:420px) and (max-width:479px)').matches;
  var w=land?innerWidth-32-20-16-190:Math.min(innerWidth,440)-32-20,hh=land?innerHeight-16-20-4:tiny?innerHeight-139:innerHeight-272;
  var b=Math.max(tiny?185:192,Math.min(w,hh,380)); // 185+ keeps 4-column tiles >= 44px
  document.documentElement.style.setProperty('--b',Math.floor(b)+'px');
}
document.addEventListener('visibilitychange',function(){document.documentElement.className=document.hidden?'hid':''});
addEventListener('resize',size);size();
render();focusId('go');
})();
</script>
</body>
</html>
