<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칼퇴 버튼 · Clock Out!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23167a47'/%3E%3Cpath d='M8 16h16m-6-6 6 6-6 6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #dce8f2;
    color: #1d1a14;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { display: flex; align-items: center; gap: 8px; padding: 2px 6px 2px 10px; min-height: 48px; background: #1d1a14; color: #fff; font-weight: 700; z-index: 9; }
  #clock { font-variant-numeric: tabular-nums; font-size: 1.15rem; letter-spacing: 1px; background: #000; color: #ff7a70; padding: 2px 8px; border-radius: 6px; text-shadow: 0 0 6px #ff3b30; }
  #progress { flex: 1; display: grid; justify-items: center; gap: 3px; min-width: 0; font-size: .75rem; line-height: 1.1; }
  #dots { display: flex; gap: 4px; }
  #dots i { width: 9px; height: 4px; border-radius: 4px; background: #817868; display: block; transition: background .2s; }
  #dots i.on { background: #ffcf33; }
  #dots i.now { background: #fff; box-shadow: 0 0 0 3px #ffcf3388; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.4em; text-align: right; display: inline-block; transform-origin: right center; }
  #time.bad { animation: tpop .45s; }
  @keyframes tpop { 0% { color: #ff7a70; transform: scale(1.35); } 100% { color: #fff; transform: scale(1); } }
  #mute { background: none; border: 0; font-size: 1.3rem; cursor: pointer; flex: 0 0 44px; min-height: 44px; border-radius: 50%; color: #fff; }
  button:focus-visible { outline: 4px solid #ffcf33; outline-offset: 3px; }
  #field {
    position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none;
    background: linear-gradient(#cfe3f5, #f2f6f9 66%, #b0bfc9 66% 67%, #bfaf9a 67%);
  }
  #field::before { /* window */
    content: ""; position: absolute; left: 8%; top: 12%; width: 34%; height: 26%;
    background: linear-gradient(90deg, transparent 49%, #fff 49% 51%, transparent 51%),
      linear-gradient(transparent 48%, #fff 48% 52%, transparent 52%),
      var(--win, linear-gradient(135deg, #ffd9a0, #ffb46b));
    border: 6px solid #fff; border-radius: 6px; box-shadow: 0 5px 0 #76899e40; opacity: .9;
  }
  #field::after { /* desk */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
    background: linear-gradient(#ffffff20, transparent 22px), repeating-linear-gradient(90deg, #a07a52 0 40px, #9a744d 40px 80px);
    border-top: 6px solid #7d5c3b;
  }
  #door {
    position: absolute; right: 10%; bottom: 22%; width: 26%; height: 45%;
    border: 5px solid #797b76; background: linear-gradient(90deg, #a49d89, #c1b69f 5% 95%, #a49d89);
    box-shadow: 4px 0 0 #33444d24;
  }
  #door::before {
    content: ""; position: absolute; inset: 11% 15% 43%; border: 3px solid #8f8978; border-radius: 4px;
    background: linear-gradient(145deg, #b8d8e4, #e4eff5);
  }
  #door::after {
    content: ""; position: absolute; width: 16%; height: 5px; left: 10%; top: 63%;
    border-radius: 4px; background: #625d50;
  }
  #deco { position: absolute; left: 0; width: 64%; bottom: 22%; display: flex; justify-content: space-around; align-items: flex-end; font-size: clamp(28px, 9vw, 54px); line-height: 1; pointer-events: none; z-index: 1; }
  .btn {
    position: absolute; left: 0; top: 0; border: 0; border-radius: 16px; font: inherit; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; z-index: 2;
    box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 10px 18px rgba(0,0,0,.18); will-change: transform; white-space: nowrap;
  }
  .btn.leave { background: #167a47; color: #fff; }
  .btn.ot { background: #cf2f26; color: #fff; }
  .btn:active { box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn:focus-visible { outline: 4px solid #1d1a14; outline-offset: 3px; box-shadow: 0 0 0 7px #fff, 0 6px 0 7px rgba(0,0,0,.3); }
  #boss {
    position: absolute; left: 0; right: 0; top: 0; z-index: 4; pointer-events: none;
    text-align: center; font-weight: 800; font-size: .95rem; line-height: 1.25; color: #fff; padding: 8px 10px; background: #c62828;
    transform: translateY(-110%); transition: transform .2s;
  }
  #boss.warn { transform: translateY(0); background: #ffb300; color: #1d1a14; }
  #boss.on { transform: translateY(0); }
  #boss.safe { transform: translateY(0); background: #12643c; }
  #tint { position: absolute; inset: 0; background: rgba(198, 40, 40, .2); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 1; }
  #tint.on { opacity: 1; }
  #eyes { position: absolute; right: 6%; top: 22%; font-size: clamp(40px, 12vw, 90px); opacity: 0; transition: opacity .2s, transform .2s; transform: scale(.6); z-index: 1; pointer-events: none; }
  #eyes.on { opacity: 1; transform: scale(1); }
  #toast {
    position: absolute; left: 50%; top: 48px; width: max-content; max-width: calc(100% - 20px);
    transform: translate(-50%, -5px); z-index: 5; pointer-events: none;
    background: #1d1a14; color: #fff; padding: 5px 12px; border-radius: 14px; text-align: center;
    font-size: .9rem; line-height: 1.15; font-weight: 800; opacity: 0; transition: opacity .15s, transform .15s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { background: #c62828; }
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  .shake { animation: shake .3s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
  #screen {
    position: absolute; left: 0; right: 0; bottom: 0; top: var(--hud, 48px); z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; justify-content: safe center;
    gap: 10px; padding: 16px; text-align: center; background: linear-gradient(160deg, #fffaf0f5, #fae5c9f5);
    overflow-y: auto; touch-action: manipulation;
  }
  #screen[hidden] { display: none; }
  #screen > * { animation: pop .4s backwards; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } }
  #screen h1 { font-size: clamp(2rem, 9vw, 3.4rem); line-height: 1.1; }
  #screen .em { font-size: clamp(44px, 13vw, 76px); line-height: 1.1; }
  #screen .big { font-size: clamp(2.6rem, 12vw, 4.2rem); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.05; color: #12643c; }
  #screen .rank { display: inline-block; background: #ffcf33; padding: 4px 14px; border-radius: 999px; font-weight: 800; transform: rotate(-3deg); }
  #screen p { max-width: 26em; color: #4d473c; font-size: .95rem; }
  #screen .sm { color: #4d473c; font-size: .9rem; }
  #screen .go { margin-top: 4px; min-height: 52px; min-width: 200px; background: #167a47; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font: inherit; font-weight: 800; font-size: 1.15rem; box-shadow: 0 5px 0 #0f5a33; cursor: pointer; }
  #screen .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f5a33; }
  #screen .go:focus-visible { outline-color: #1d1a14; }
  #screen .nb { color: #c62828; font-weight: 900; font-size: 1.15rem; }
  @media (max-height: 520px) {
    #screen { gap: 6px; padding: 10px; }
    #screen .em { font-size: 36px; }
    #screen h1 { font-size: 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><div id="clock" aria-hidden="true">18:00</div><div id="progress"><span id="stage"></span><div id="dots" aria-hidden="true"></div></div><div id="time" role="timer"></div><button id="mute" type="button" aria-pressed="false">🔊</button></div>
  <div id="field"><div id="door" aria-hidden="true"></div><div id="deco" aria-hidden="true"><span>🖥️</span><span>☕</span><span>🪴</span></div><div id="tint"></div><div id="eyes" aria-hidden="true">👀</div><div id="boss" role="status"></div><div id="toast" role="status"></div></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <section id="screen" aria-labelledby="screen-title"></section>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search).get('lang');
  const LANG = (qs || navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
  document.documentElement.lang = LANG;
  const T = {
    ko: {
      title: '칼퇴 버튼', sub: '6시 정각. 도망치는 퇴근 버튼을 잡아라!',
      howto: '초록 퇴근 버튼을 누르면 다음 단계. 빨간 야근 버튼은 +3초, 부장님이 보고 있을 때 누르면 +5초.',
      start: '출근하기', leave: '퇴근', ot: '야근', bossWarn: '…발소리가 들린다', boss: '부장님 순찰 중! 누르지 마세요',
      bossSafe: '부장님이 지나갔어요. 지금 누르세요!', stage: '단계', controls: '키보드: Tab으로 이동, Enter 또는 스페이스바로 선택.',
      caught: '부장님: 어디 가나? +5초', decoy: '야근 확정! +3초', clear: ['좋아!', '한 단계 더', '거의 다 왔다', '마지막!'],
      done: '퇴근 성공!', time: '걸린 시간', best: '최고 기록', newBest: '🎊 신기록! 🎊', retry: '다시 출근하기', sec: '초',
      base: '플레이 시간', pen: '추가 시간', sound: '음소거',
      ranks: [[10, '칼퇴의 신'], [16, '칼퇴 장인'], [26, '평범한 직장인'], [40, '눈치 없는 신입'], [Infinity, '야근 요정']],
    },
    en: {
      title: 'Clock Out!', sub: "It's 6 PM. Catch the runaway Leave button!",
      howto: 'Hit Leave to clear a stage. Overtime adds 3 seconds. Acting while the boss watches adds 5.',
      start: 'Clock in', leave: 'Leave', ot: 'Overtime', bossWarn: '…footsteps in the hall', boss: 'Boss watching! Wait to press.',
      bossSafe: 'Boss gone. Press now!', stage: 'Stage', controls: 'Keyboard: Tab to move, Enter or Space to select.',
      caught: 'Boss: Going somewhere? +5s', decoy: 'Overtime confirmed! +3s', clear: ['Nice!', 'Keep going', 'Almost there', 'Last one!'],
      done: 'You clocked out!', time: 'Time', best: 'Best', newBest: '🎊 New best! 🎊', retry: 'Clock in again', sec: 's',
      base: 'Play time', pen: 'Penalty', sound: 'Mute sound',
      ranks: [[10, 'Clock-out legend'], [16, 'Seasoned escapee'], [26, 'Average employee'], [40, 'Clueless new hire'], [Infinity, 'Overtime fairy']],
    },
  }[LANG];
  const RANK_EMOJI = ['🏆', '🥇', '🙂', '😅', '🧚'];
  document.title = T.title;

  const STAGES = [
    { speed: 240, radius: 110, size: 1.00, decoys: 0, boss: false, jump: 1.3, shuffle: 0 },
    { speed: 320, radius: 130, size: 0.95, decoys: 2, boss: false, jump: 1.1, shuffle: 0 },
    { speed: 380, radius: 140, size: 0.85, decoys: 3, boss: false, jump: 1.0, shuffle: 1.9 },
    { speed: 400, radius: 145, size: 0.82, decoys: 3, boss: true, jump: 0.95, shuffle: 0 },
    { speed: 450, radius: 155, size: 0.75, decoys: 4, boss: true, jump: 0.85, shuffle: 1.7 },
  ];
  // window sky gets later as the evening goes on
  const SKY = [
    'linear-gradient(135deg, #ffd9a0, #ffb46b)',
    'linear-gradient(135deg, #ffc38a, #ff8f6b)',
    'linear-gradient(135deg, #ff9d7a, #c45bb0)',
    'linear-gradient(135deg, #8a5bd6, #3d3a8f)',
    'linear-gradient(135deg, #3d3a8f, #17163a)',
  ];
  const TOP = 82; // reserve room for boss warnings and feedback
  const PAD = 8;
  const GAP = 10;

  const $ = (id) => document.getElementById(id);
  const field = $('field'), screen = $('screen'), toastEl = $('toast'), bossEl = $('boss'), tint = $('tint'), eyes = $('eyes');
  const timeEl = $('time'), dotsEl = $('dots'), stageEl = $('stage'), muteBtn = $('mute'), clockEl = $('clock'), hud = $('hud');
  const fx = $('fx'), ctx = fx.getContext('2d');
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const decimal = new Intl.NumberFormat(LANG, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const duration = (seconds) => decimal.format(seconds) + T.sec;
  timeEl.setAttribute('aria-label', T.time);

  let best = null, muted = false;
  try { best = Number(localStorage.getItem('clockout.best')) || null; muted = localStorage.getItem('clockout.muted') === '1'; } catch (e) { /* storage blocked */ }
  function paintMute() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', T.sound);
    muteBtn.title = T.sound;
  }
  paintMute();

  // ---------- sound ----------
  let ac = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0) {
    if (muted || document.hidden) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* audio unavailable */ }
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted; paintMute();
    try { localStorage.setItem('clockout.muted', muted ? '1' : '0'); } catch (err) { /* ignore */ }
    beep(660, 0.06);
  });

  // ---------- state ----------
  let state = 'menu', stageIdx = 0, elapsed = 0, penalty = 0, transition = 0;
  let leave = null, decoys = [], px = -9999, py = -9999, touchMode = matchMedia('(hover: none)').matches;
  let jumpT = 0, shuffleT = 0, cornerT = 0, bossPhase = 'idle', bossT = 0;
  let W = 0, H = 0, scale = 1, dpr = 1;
  let kbd = false, readyAt = 0;
  const parts = [];

  function measure() {
    const r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    scale = Math.min(1.35, Math.max(0.8, Math.min(W, H) / 420));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = Math.round(innerWidth * dpr); fx.height = Math.round(innerHeight * dpr);
    fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
    screen.style.setProperty('--hud', hud.offsetHeight + 'px');
    layoutButtons();
  }
  const all = () => (leave ? [leave, ...decoys] : decoys);

  function makeBtn(kind) {
    const el = document.createElement('button');
    el.className = 'btn ' + kind;
    el.type = 'button';
    el.innerHTML = kind === 'leave' ? `<span aria-hidden="true">🏃</span><span>${T.leave}</span>` : `<span aria-hidden="true">🌙</span><span>${T.ot}</span>`;
    field.appendChild(el);
    const b = { el, kind, x: PAD, y: TOP, w: 0, h: 0, wob: Math.random() * 6 };
    // keyboard / assistive-tech activation only (real pointer clicks have detail > 0)
    el.addEventListener('click', (e) => {
      if (e.detail !== 0) return;
      kbd = true;
      hit(b);
    });
    sizeBtn(b);
    return b;
  }
  function sizeBtn(b) {
    const s = STAGES[stageIdx].size * scale;
    // never smaller than a 44px tap target
    b.w = Math.round(Math.max(116, 124 * s)); b.h = Math.round(Math.max(46, 54 * s));
    b.el.style.width = b.w + 'px'; b.el.style.height = b.h + 'px'; b.el.style.fontSize = Math.max(15, 19 * s).toFixed(1) + 'px';
  }
  const rightBound = (b) => Math.max(PAD, W - b.w - PAD);
  const bottomBound = (b) => Math.max(TOP, H - b.h - PAD);
  const boundX = (b, x) => Math.min(Math.max(x, PAD), rightBound(b));
  const boundY = (b, y) => Math.min(Math.max(y, TOP), bottomBound(b));
  function place(b) { b.el.style.transform = `translate(${b.x.toFixed(1)}px, ${b.y.toFixed(1)}px)`; }

  function clearSpot(b, x, y, others) {
    return others.every((o) => o === b || x + b.w + GAP <= o.x || o.x + o.w + GAP <= x ||
      y + b.h + GAP <= o.y || o.y + o.h + GAP <= y);
  }

  function move(b, x, y, others) {
    const nx = boundX(b, x), ny = boundY(b, y);
    if (clearSpot(b, nx, b.y, others)) b.x = nx;
    if (clearSpot(b, b.x, ny, others)) b.y = ny;
    place(b);
    return nx !== x && ny !== y;
  }

  function randomSpot(b, awayX, awayY, others = all()) {
    let bestSpot, bestScore = -1;
    for (let i = 0; i < 24; i++) {
      const x = PAD + Math.random() * (rightBound(b) - PAD), y = TOP + Math.random() * (bottomBound(b) - TOP);
      if (!clearSpot(b, x, y, others)) continue;
      const score = Math.hypot(x + b.w / 2 - awayX, y + b.h / 2 - awayY);
      if (score > bestScore) { bestScore = score; bestSpot = [x, y]; }
    }
    if (!bestSpot) return false;
    [b.x, b.y] = bestSpot;
    place(b);
    return true;
  }

  function layoutButtons() {
    const buttons = all();
    if (!buttons.length) return;
    const placed = [];
    for (const b of buttons) {
      sizeBtn(b);
      b.x = boundX(b, b.x); b.y = boundY(b, b.y);
      if (!clearSpot(b, b.x, b.y, placed) && !randomSpot(b, px, py, placed)) break;
      place(b);
      placed.push(b);
    }
    if (placed.length === buttons.length) return;

    // Even at 320×480 there is room for all five targets in two columns.
    for (const b of buttons) sizeBtn(b);
    const stepX = Math.max(...buttons.map((b) => b.w)) + GAP;
    const stepY = Math.max(...buttons.map((b) => b.h)) + GAP;
    buttons.forEach((b, i) => {
      b.x = i % 2 ? rightBound(b) : boundX(b, rightBound(b) - stepX);
      b.y = boundY(b, TOP + Math.floor(i / 2) * stepY);
      place(b);
    });
  }

  function setupStage() {
    const st = STAGES[stageIdx];
    for (const b of all()) b.el.remove();
    decoys = [];
    leave = makeBtn('leave');
    for (let i = 0; i < st.decoys; i++) decoys.push(makeBtn('ot'));
    const placed = [];
    for (const b of all()) {
      randomSpot(b, px, py, placed);
      placed.push(b);
    }
    layoutButtons();
    jumpT = 0; shuffleT = 0; cornerT = 0; bossPhase = 'idle'; bossT = 1.6 + Math.random();
    setBoss('idle');
    field.style.setProperty('--win', SKY[Math.min(stageIdx, SKY.length - 1)]);
    paintProgress(stageIdx);
    if (kbd && (stageIdx === 0 || document.activeElement !== muteBtn)) leave.el.focus({ preventScroll: true });
  }

  function paintProgress(index) {
    stageEl.textContent = index < 0 ? '' : LANG === 'ko'
      ? `${Math.min(index + 1, STAGES.length)}/${STAGES.length} ${T.stage}`
      : `${T.stage} ${Math.min(index + 1, STAGES.length)}/${STAGES.length}`;
    dotsEl.innerHTML = STAGES.map((_, i) => `<i class="${i < index ? 'on' : i === index ? 'now' : ''}"></i>`).join('');
  }

  function setBoss(p) {
    bossPhase = p;
    bossEl.className = p === 'warn' ? 'warn' : p === 'watch' ? 'on' : p === 'safe' ? 'safe' : '';
    bossEl.textContent = p === 'warn' ? T.bossWarn : p === 'watch' ? T.boss : p === 'safe' ? T.bossSafe : '';
    tint.classList.toggle('on', p === 'watch');
    eyes.classList.toggle('on', p === 'watch');
  }

  let toastTimer = 0;
  function toast(msg, bad) {
    toastEl.textContent = msg; toastEl.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ''; toastEl.textContent = ''; }, 900);
  }
  function shake() {
    if (reduced()) return;
    field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
  }
  function penalize(sec, msg, x, y) {
    penalty += sec; toast(msg, true); shake();
    timeEl.classList.remove('bad'); void timeEl.offsetWidth; timeEl.classList.add('bad');
    burst(x, y, ['#ff5a4f', '#c62828', '#ffb300'], 14);
    beep(sec > 3 ? 140 : 220, sec > 3 ? 0.35 : 0.25, 'sawtooth', 0.08, sec > 3 ? -60 : -120);
    if (navigator.vibrate && !reduced()) { try { navigator.vibrate(sec > 3 ? 120 : 60); } catch (e) { /* ignore */ } }
  }

  function burst(x, y, colors, n = 36) {
    if (reduced()) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 160 + Math.random() * 360;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, life: 0.9 + Math.random() * 0.5, c: colors[i % colors.length], s: 4 + Math.random() * 5, r: Math.random() * 6 });
    }
  }

  function hit(b) {
    if (state !== 'play' || transition > 0) return;
    const r = b.el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (bossPhase === 'watch') { penalize(5, T.caught, cx, cy); return; }
    if (b.kind === 'ot') {
      penalize(3, T.decoy, cx, cy);
      randomSpot(b, b.x + b.w / 2, b.y + b.h / 2);
      return;
    }
    burst(cx, cy, ['#2fbf71', '#ffcf33', '#ff5a4f', '#4f8cff', '#fff']);
    beep(660, 0.09, 'square', 0.06); setTimeout(() => beep(990, 0.12, 'square', 0.06), 80);
    if (stageIdx === STAGES.length - 1) return finish();
    toast(T.clear[stageIdx] || T.clear[0]);
    transition = 0.55;
    for (const x of all()) { x.el.style.opacity = '0.3'; x.el.tabIndex = -1; x.el.setAttribute('aria-disabled', 'true'); }
  }

  // Taps that miss (touch): the button may dodge, and boss can catch you.
  field.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || e.button !== 0) return;
    e.preventDefault();
    if (state !== 'play' || transition > 0) return;
    kbd = false;
    touchMode = e.pointerType !== 'mouse';
    const fr = field.getBoundingClientRect();
    px = e.clientX - fr.left; py = e.clientY - fr.top;
    const target = e.target.closest('.btn');
    if (target) { hit(all().find((b) => b.el === target)); return; }
    if (bossPhase === 'watch') { penalize(5, T.caught, e.clientX, e.clientY); return; }
    if (touchMode && stageIdx > 0 && leave) {
      const d = Math.hypot(leave.x + leave.w / 2 - px, leave.y + leave.h / 2 - py);
      if (d < 90 * scale && Math.random() < 0.5) { randomSpot(leave, px, py); jumpT = 0; beep(880, 0.05, 'triangle', 0.04, 300); }
    }
  });
  field.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || state !== 'play') return;
    touchMode = false;
    const fr = field.getBoundingClientRect();
    px = e.clientX - fr.left; py = e.clientY - fr.top;
  });
  field.addEventListener('pointerleave', () => { px = -9999; py = -9999; });

  function update(dt) {
    if (state === 'ending') {
      transition -= dt;
      if (transition <= 0) showResult();
      return;
    }
    if (state !== 'play') return;
    if (transition > 0) {
      transition -= dt;
      if (transition <= 0) { stageIdx++; setupStage(); }
      return;
    }
    elapsed += dt;
    const st = STAGES[stageIdx];
    const buttons = all();
    if (!touchMode) {
      const cx = leave.x + leave.w / 2, cy = leave.y + leave.h / 2;
      const dx = cx - px, dy = cy - py, d = Math.hypot(dx, dy) || 1;
      let x = leave.x, y = leave.y;
      if (d < st.radius * scale) {
        const push = st.speed * scale * (1.1 - d / (st.radius * scale) * 0.6);
        const wob = Math.sin(elapsed * 9 + leave.wob) * 0.45;
        x += (dx / d - dy / d * wob) * push * dt;
        y += (dy / d + dx / d * wob) * push * dt;
      } else {
        x += Math.sin(elapsed * 2 + leave.wob) * 12 * dt;
      }
      if (move(leave, x, y, buttons)) {
        cornerT += dt;
        if (cornerT > (stageIdx >= 3 ? 0.55 : 0.9)) { randomSpot(leave, px, py); cornerT = 0; beep(880, 0.05, 'triangle', 0.04, 300); }
      } else cornerT = Math.max(0, cornerT - dt);
    } else {
      jumpT += dt;
      if (jumpT > st.jump) { jumpT = 0; randomSpot(leave, leave.x + leave.w / 2, leave.y + leave.h / 2); }
    }
    for (const b of decoys) {
      move(b, b.x + Math.sin(elapsed * 1.7 + b.wob) * 22 * dt, b.y + Math.cos(elapsed * 1.3 + b.wob) * 16 * dt, buttons);
    }
    if (st.shuffle) {
      shuffleT += dt;
      if (shuffleT > st.shuffle && decoys.length) {
        shuffleT = 0;
        const o = decoys[(Math.random() * decoys.length) | 0];
        [leave.x, o.x] = [o.x, leave.x]; [leave.y, o.y] = [o.y, leave.y];
        place(leave); place(o);
      }
    }
    if (st.boss) {
      bossT -= dt;
      if (bossT <= 0) {
        if (bossPhase === 'idle' || bossPhase === 'safe') { setBoss('warn'); bossT = 0.7; beep(330, 0.06, 'triangle', 0.04); }
        else if (bossPhase === 'warn') { setBoss('watch'); bossT = 1.5 + Math.random() * 0.6; beep(196, 0.2, 'triangle', 0.05); }
        else { setBoss('safe'); bossT = 2.0 + Math.random() * 1.6; }
      }
    }
    const score = duration(elapsed + penalty);
    if (timeEl.textContent !== score) timeEl.textContent = score;
    const m = Math.floor(elapsed / 6);
    const clock = `18:${String(Math.min(59, m)).padStart(2, '0')}`;
    if (clockEl.textContent !== clock) clockEl.textContent = clock;
  }

  function drawFx(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 8;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
  }

  let last = null, frameId = 0, paintedFx = false;
  function scheduleFrame() {
    if (!frameId && !document.hidden) frameId = requestAnimationFrame(frame);
  }

  function frame(ts) {
    frameId = 0;
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    const hasFx = parts.length > 0;
    if (hasFx || paintedFx) drawFx(dt);
    paintedFx = hasFx;
    if (state === 'play' || state === 'ending' || parts.length || paintedFx) scheduleFrame();
    else last = null;
  }

  const rankIdx = (t) => T.ranks.findIndex(([lim]) => t < lim);

  function showScreen(html) {
    screen.hidden = false;
    screen.innerHTML = html;
    [...screen.children].forEach((c, i) => c.style.setProperty('--i', i));
    field.inert = true;
    screen.querySelector('.go').focus({ preventScroll: true });
  }

  function showMenu() {
    state = 'menu'; readyAt = 0;
    showScreen(`<div class="em" aria-hidden="true">🏃‍♂️💨</div><h1 id="screen-title">${T.title}</h1><p><b>${T.sub}</b></p>` +
      `<p id="instructions">${T.howto}</p><p class="sm" id="controls">${T.controls}</p>` +
      (best ? `<p>${T.best}: <b>${duration(best)}</b></p>` : '') +
      `<button class="go" type="button" aria-describedby="instructions controls">${T.start}</button>`);
  }

  function start() {
    state = 'play'; stageIdx = 0; elapsed = 0; penalty = 0; transition = 0;
    parts.length = 0; px = -9999; py = -9999; last = null;
    clearTimeout(toastTimer); toastEl.className = ''; toastEl.textContent = '';
    field.classList.remove('shake'); timeEl.classList.remove('bad');
    screen.hidden = true; field.inert = false;
    setupStage();
    timeEl.textContent = duration(0); clockEl.textContent = '18:00';
    beep(523, 0.08); setTimeout(() => beep(784, 0.1), 90);
    scheduleFrame();
  }

  function finish() {
    state = 'ending';
    transition = reduced() ? 0 : 0.45;
    setBoss('idle');
    paintProgress(STAGES.length);
    burst(innerWidth / 2, innerHeight / 2, ['#2fbf71', '#ffcf33', '#ff5a4f', '#4f8cff', '#fff'], 120);
    beep(523, 0.1); setTimeout(() => beep(659, 0.1), 110); setTimeout(() => beep(784, 0.1), 220); setTimeout(() => beep(1047, 0.25), 330);
  }

  function showResult() {
    state = 'over';
    readyAt = performance.now() + 450; // ignore a stray tap as the result appears
    const total = elapsed + penalty;
    const ri = rankIdx(total);
    const isBest = !best || total < best;
    if (isBest) { best = total; try { localStorage.setItem('clockout.best', String(total)); } catch (e) { /* ignore */ } }
    timeEl.textContent = duration(total);
    showScreen(`<div class="em" aria-hidden="true">${RANK_EMOJI[ri]}🏠</div><h1 id="screen-title">${T.done}</h1>` +
      `<div class="sm" id="total-label">${T.time}</div><div class="big" id="total">${duration(total)}</div><div class="rank">${T.ranks[ri][1]}</div>` +
      `<div class="sm">${T.base} ${duration(elapsed)} + ${T.pen} ${duration(penalty)}</div>` +
      (isBest ? `<p class="nb">${T.newBest}</p>` : '') + `<p>${T.best}: <b>${duration(best)}</b></p>` +
      `<button class="go" type="button" aria-describedby="screen-title total-label total">${T.retry}</button>`);
  }

  screen.addEventListener('click', (e) => {
    const onButton = Boolean(e.target.closest('.go'));
    kbd = e.detail === 0;
    if (kbd && !onButton) return;
    if (state === 'over' && (!onButton || (!kbd && performance.now() < readyAt))) return;
    if (e.pointerType) touchMode = e.pointerType !== 'mouse';
    if (state === 'menu' || state === 'over') start();
  });
  $('app').addEventListener('keydown', (e) => {
    if (e.repeat && (e.key === ' ' || e.key === 'Enter') && e.target.closest('button')) e.preventDefault();
  });
  addEventListener('resize', measure);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(frameId);
    frameId = 0;
    last = null;
    if (state === 'play' || state === 'ending' || parts.length || paintedFx) scheduleFrame();
  });

  measure();
  timeEl.textContent = duration(0);
  showMenu();
})();
</script>
</body>
</html>
