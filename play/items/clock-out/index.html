<title>칼퇴 버튼 · Clock Out!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d7f76d'/%3E%3Cpath d='M8 16h16m-6-6 6 6-6 6' fill='none' stroke='%23201b3e' stroke-width='3'/%3E%3C/svg%3E">
<style>

  :root {
    color-scheme: dark;
    --night: #24204d;
    --ink: #201b3e;
    --paper: #fff3c9;
    --lime: #d7f76d;
    --peach: #ffab79;
    --coral: #ff837c;
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--night); color: var(--paper); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud {
    z-index: 9; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; min-height: 60px; padding: 4px clamp(10px, 4vw, 24px);
    background: var(--ink); border-bottom: 3px solid #0f0d23;
  }
  #clock, #time, .big { font-variant-numeric: tabular-nums; }
  #clock {
    color: var(--peach); border: 1px solid #796598; border-radius: 5px;
    padding: 4px 7px; font: 800 clamp(16px, 4.4vw, 24px)/1.05 ui-monospace, monospace;
  }
  #progress { flex: 1; display: grid; justify-items: center; gap: 5px; font-size: .72rem; font-weight: 800; }
  #dots { display: flex; gap: 5px; }
  #dots i { width: clamp(7px, 2.3vw, 13px); height: 8px; border: 1px solid #a294ba; transform: skewX(-13deg); }
  #dots i.on { background: var(--lime); border-color: var(--lime); }
  #dots i.now { background: var(--peach); border-color: var(--peach); }
  #time { min-width: 3.6em; text-align: right; font-size: clamp(17px, 4vw, 23px); font-weight: 900; transform-origin: right; }
  #time.bad { animation: timer-hit .4s; }
  @keyframes timer-hit { 30% { color: var(--coral); transform: scale(1.19); } }
  #mute { width: 44px; height: 44px; flex: none; background: transparent; border: 0; color: var(--paper); border-radius: 8px; }
  #mute svg { display: block; width: 22px; height: 22px; margin: auto; }
  #field {
    position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none;
    user-select: none; background: #65568b;
  }
  #office, #tint, #eyes, #fx { position: absolute; pointer-events: none; }
  #office, #tint, #fx { inset: 0; width: 100%; height: 100%; }
  #office { --sky-top: #ff9b8d; --sky-bottom: #ffe3a0; }
  #office .sky-stop { transition: stop-color .5s; }
  #eyes {
    right: 7%; top: 30%; width: clamp(102px, 28vw, 210px); height: auto;
    opacity: 0; transform: translateX(24px) rotate(12deg); transition: opacity .2s, transform .25s;
  }
  #eyes.warn { opacity: .65; transform: translateX(16px) rotate(18deg); }
  #eyes.on { opacity: 1; transform: translateX(0) rotate(7deg); }
  #tint { border: 0 solid transparent; opacity: 0; transition: opacity .2s; z-index: 1; }
  #tint.on { opacity: 1; box-shadow: inset 0 0 0 7px #aa284b, inset 0 0 85px 14px #ce466c80; }
  .btn {
    position: absolute; left: 0; top: 0; border: 0; background: none; padding: 0;
    font-weight: 950; color: var(--ink); white-space: nowrap; z-index: 2; outline-offset: 3px;
  }
  .btn-face {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--lime); border: 3px solid var(--ink); border-radius: 13px 9px 12px 8px;
    box-shadow: 0 5px 0 var(--ink), 2px 8px 0 #211b4055, inset 0 2px 0 #fff8;
  }
  .btn-face svg { width: 25px; height: 25px; flex: none; }
  .badge-legs { position: absolute; top: calc(100% - 4px); left: 19%; width: 62%; height: 25px; pointer-events: none; }
  .badge-legs path { transform-origin: top center; animation: footstep .24s ease-in-out infinite alternate; }
  @keyframes footstep { to { transform: translate(3px, -2px) rotate(-8deg); } }
  .btn.hit .badge-legs { opacity: 0; }
  .ot .btn-face { background: var(--coral); border-radius: 7px 13px 7px 12px; }
  .btn:active .btn-face { transform: translateY(3px); }
  .btn.jump .btn-face { animation: land .26s both; }
  .btn.hit .btn-face { animation: hit .38s both; }
  .btn.miss .btn-face { animation: bump .24s both; }
  @keyframes land { from { transform: scale(.82, 1.2); } 60% { transform: scale(1.1, .88); } }
  @keyframes hit { 22% { transform: scale(.85, 1.17); } 65% { transform: scale(1.28, .82) rotate(-6deg); opacity: 1; } to { transform: scale(1.45, 1.15) rotate(-8deg); opacity: 0; } }
  @keyframes bump { 35% { transform: scale(1.12, .82) rotate(5deg); } }
  #boss, #toast { position: absolute; z-index: 5; pointer-events: none; text-align: center; font-size: .85rem; font-weight: 850; }
  #boss {
    top: 8px; left: 50%; width: max-content; max-width: calc(100% - 20px); padding: 4px 10px;
    border: 2px solid var(--ink); border-radius: 6px 9px 5px 8px; box-shadow: 2px 3px 0 var(--ink);
    transform: translate(-50%, -6px); opacity: 0; transition: opacity .18s, transform .18s;
  }
  #boss.warn, #boss.on, #boss.safe { opacity: 1; transform: translate(-50%, 0); color: var(--ink); }
  #boss.warn { background: var(--peach); }
  #boss.on, #toast.bad { background: #a82f52; color: white; }
  #boss.safe { background: var(--lime); }
  #toast {
    left: 50%; top: 44px; width: max-content; max-width: calc(100% - 20px);
    transform: translate(-50%, -5px); background: var(--ink); color: var(--paper);
    border: 2px solid var(--paper); border-radius: 5px 10px 7px 9px; padding: 5px 12px;
    opacity: 0; transition: opacity .16s, transform .16s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast strong { color: var(--lime); padding-inline-start: 8px; }
  #fx { z-index: 8; }
  #field.shake #office { animation: shake .29s; }
  @keyframes shake {
    20% { transform: scale(1.05) translate(-5px, 3px); }
    45% { transform: scale(1.05) translate(6px, -2px); }
    70% { transform: scale(1.03) translate(-3px, 1px); }
  }
  #screen {
    position: absolute; inset: var(--hud, 60px) 0 0; z-index: 7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(5px, 1.35vh, 12px); padding: 8px 12px 16px; overflow: hidden;
    text-align: center; touch-action: manipulation;
    background: radial-gradient(ellipse at 50% 18%, #514278, transparent 68%),
      radial-gradient(circle, #9b85be2b 1px, transparent 1.5px) 0 0 / 9px 9px, var(--night);
  }
  #screen[hidden] { display: none; }
  .poster {
    display: block; width: min(94%, 560px); height: clamp(115px, 43%, 390px);
    flex: 0 1 auto; min-height: 0; overflow: visible;
  }
  #screen h1 {
    color: var(--paper); font-size: clamp(2.2rem, 10.4vw, 5.4rem); letter-spacing: -.075em; line-height: .98;
    font-weight: 1000; transform: rotate(-4deg);
    text-shadow: 0 3px 0 #b15e9b, 0 6px 0 var(--ink);
  }
  #screen p { max-width: 41ch; color: var(--paper); font-size: clamp(.77rem, 2.8vw, .97rem); line-height: 1.35; }
  #screen:lang(ko) p { word-break: keep-all; }
  #screen .sub { color: var(--peach); margin-top: 5px; font-weight: 850; font-size: clamp(.86rem, 3.4vw, 1.15rem); }
  #screen .sm { color: #e5d2f4; font-size: clamp(.69rem, 2.5vw, .85rem); }
  #screen .go {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 49px;
    min-width: min(230px, 90%); padding: 7px 22px; margin-top: 2px;
    color: var(--ink); background: var(--lime); border: 3px solid var(--ink);
    border-radius: 10px 6px 10px 7px; box-shadow: 0 4px 0 #0f0d23, 0 6px 0 #a7c447;
    font-size: clamp(1rem, 4vw, 1.25rem); font-weight: 950;
  }
  .go svg { width: 26px; height: 20px; }
  #screen .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f0d23, 0 3px 0 #a7c447; }
  .runner { transform-origin: 50% 50%; transform-box: fill-box; animation: breathe 2.8s ease-in-out infinite; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.8s 1s infinite; }
  .drift { animation: drift 3.6s ease-in-out infinite alternate; }
  .drift:nth-of-type(even) { animation-delay: -2s; }
  @keyframes breathe { 50% { transform: translateY(-5px) scale(1.025, .975); } }
  @keyframes blink { 0%, 91%, 98%, 100% { transform: scaleY(1); } 94%, 96% { transform: scaleY(.12); } }
  @keyframes drift { to { transform: translate(7px, -9px); } }
  #screen.result { background-color: #352457; }
  #screen.result h1 { font-size: clamp(1.9rem, 8.7vw, 4.2rem); }
  .receipt {
    width: min(90%, 360px); padding: 9px 14px 13px; color: var(--ink); background: var(--paper);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), 96% 100%, 92% calc(100% - 7px), 88% 100%, 84% calc(100% - 7px), 80% 100%, 76% calc(100% - 7px), 72% 100%, 68% calc(100% - 7px), 64% 100%, 60% calc(100% - 7px), 56% 100%, 52% calc(100% - 7px), 48% 100%, 44% calc(100% - 7px), 40% 100%, 36% calc(100% - 7px), 32% 100%, 28% calc(100% - 7px), 24% 100%, 20% calc(100% - 7px), 16% 100%, 12% calc(100% - 7px), 8% 100%, 4% calc(100% - 7px), 0 100%);
  }
  .receipt .big { font-size: clamp(2.1rem, 10vw, 4.2rem); font-weight: 1000; line-height: 1; letter-spacing: -.065em; }
  .receipt .rank {
    display: inline-block; margin: 6px 0; padding: 2px 9px; border: 2px solid currentColor;
    border-radius: 3px; color: #942d57; font-weight: 950; transform: rotate(-4deg); animation: stamp .3s both;
  }
  @keyframes stamp { from { opacity: 0; transform: scale(1.5) rotate(-12deg); } }
  #screen .receipt p { color: var(--ink); max-width: none; }
  #screen .receipt .nb { color: #942d57; font-weight: 900; }
  .receipt-rule { border-top: 1px dashed #a28ba4; margin: 5px 0; }
  .medal { width: min(120px, 24vh); height: clamp(46px, 14vh, 108px); flex: 0 1 auto; min-height: 0; }
  .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
  @media (max-height: 540px) {
    #hud { min-height: 51px; }
    #screen { gap: 5px; }
    .poster { height: 38%; }
    #screen h1 { font-size: clamp(2rem, 9vw, 3.8rem); }
    .medal { height: 54px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

        shuffleT = 0;
        const o = decoys[(Math.random() * decoys.length) | 0];
        [leave.x, o.x] = [o.x, leave.x]; [leave.y, o.y] = [o.y, leave.y];
        place(leave); place(o);
        animate(leave.el, 'jump'); animate(o.el, 'jump');
      }
    }
    if (st.boss) {
      bossT -= dt;
      if (bossT <= 0) {
        if (bossPhase === 'idle' || bossPhase === 'safe') { setBoss('warn'); bossT = 0.7; beep(330, 0.06, 'triangle', 0.04); }
        else if (bossPhase === 'warn') { setBoss('watch'); bossT = 1.5 + Math.random() * 0.6; beep(196, 0.2, 'triangle', 0.05); }
        else { setBoss('safe'); bossT = 2.0 + Math.random() * 1.6; }
      }
    }
    const score = duration(elapsed + penalty);
    if (timeEl.textContent !== score) timeEl.textContent = score;
    const m = Math.floor(elapsed / 6);
    const clock = `18:${String(Math.min(59, m)).padStart(2, '0')}`;
    if (clockEl.textContent !== clock) clockEl.textContent = clock;
  }

  function drawFx(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += 650 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 8;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.c;
      if (p.spark) {
        ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(p.s * .42, 0);
        ctx.lineTo(0, p.s); ctx.lineTo(-p.s * .42, 0); ctx.fill();
      } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
  }

  let last = null, frameId = 0, paintedFx = false;
  function scheduleFrame() {
    if (!frameId && !document.hidden) frameId = requestAnimationFrame(frame);
  }

  function frame(ts) {
    frameId = 0;
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    const hasFx = parts.length > 0;
    if (hasFx || paintedFx) drawFx(dt);
    paintedFx = hasFx;
    if (state === 'play' || state === 'ending' || parts.length || paintedFx) scheduleFrame();
    else last = null;
  }

  const rankIdx = (t) => T.ranks.findIndex(([lim]) => t < lim);

  function showScreen(html, result = false) {
    screen.classList.toggle('result', result);
    screen.hidden = false;
    screen.innerHTML = html;
    field.inert = true;
    screen.querySelector('.go').focus({ preventScroll: true });
  }

  function showMenu() {
    state = 'menu'; readyAt = 0;
    showScreen(`${poster}<h1 id="screen-title">${T.title}</h1><p class="sub">${T.sub}</p>` +
      `<p id="instructions">${T.howto}</p><p class="sm" id="controls">${T.controls}</p>` +
      (best !== null ? `<p>${T.best}: <b>${duration(best)}</b></p>` : '') +
      `<button class="go" type="button" aria-describedby="instructions controls">${T.start}${arrow}</button>`);
  }

  function start() {
    state = 'play'; stageIdx = 0; elapsed = 0; penalty = 0; transition = 0;
    streak = 0; longest = 0;
    parts.length = 0; px = -9999; py = -9999; last = null;
    clearTimeout(toastTimer); toastEl.className = ''; toastEl.textContent = '';
    field.classList.remove('shake'); timeEl.classList.remove('bad');
    screen.hidden = true; field.inert = false;
    setupStage();
    timeEl.textContent = duration(0); clockEl.textContent = '18:00';
    beep(523, 0.08); beep(784, 0.1, 'triangle', .06, 0, .09);
    scheduleFrame();
  }

  function finish() {
    state = 'ending';
    transition = reduced() ? 0 : 0.45;
    setBoss('idle');
    paintProgress(STAGES.length);
    const notes = longest === STAGES.length ? [523, 659, 784, 1047] : [392, 523, 659, 784];
    notes.forEach((note, i) => beep(note, i === 3 ? .22 : .13, 'triangle', .09, 0, i * .095));
  }

  function showResult() {
    state = 'over';
    readyAt = performance.now() + 450; // ignore a stray tap as the result appears
    const total = elapsed + penalty;
    const ri = rankIdx(total);
    const isBest = best === null || total < best;
    if (isBest) { best = total; try { localStorage.setItem('clockout.best', String(total)); } catch (e) { /* ignore */ } }
    timeEl.textContent = duration(total);
    const streakLine = longest === STAGES.length ? T.cleanSweep : `${T.longest}: ${longest}/${STAGES.length}`;
    showScreen(`${medal}<h1 id="screen-title">${T.done}</h1><div class="receipt">` +
      `<p id="total-label">${T.time}</p><div class="big" id="total">${duration(total)}</div><div class="rank">${T.ranks[ri][1]}</div>` +
      `<p>${T.base} ${duration(elapsed)} + ${T.pen} ${duration(penalty)}</p><div class="receipt-rule"></div>` +
      `<p><b>${streakLine}</b></p>` + (isBest ? `<p class="nb">${T.newBest}</p>` : '') +
      `<p>${T.best}: <b>${duration(best)}</b></p></div>` +
      `<button class="go" type="button" aria-describedby="screen-title total-label total">${T.retry}${arrow}</button>`, true);
    burst(innerWidth * .16, innerHeight * .42, confetti, 36, 1.1);
    burst(innerWidth * .84, innerHeight * .45, confetti, 36, 1.1);
  }

  screen.addEventListener('click', (e) => {
    const onButton = Boolean(e.target.closest('.go'));
    kbd = e.detail === 0;
    if (kbd && !onButton) return;
    if (state === 'over' && (!onButton || (!kbd && performance.now() < readyAt))) return;
    if (e.pointerType) touchMode = e.pointerType !== 'mouse';
    if (state === 'menu' || state === 'over') {
      unlockAudio(e);
      start();
    }
  });
  $('app').addEventListener('keydown', (e) => {
    if (e.key.startsWith('Arrow') || (e.key === ' ' && !e.target.closest('button'))) e.preventDefault();
    if (e.repeat && (e.key === ' ' || e.key === 'Enter') && e.target.closest('button')) e.preventDefault();
  });
  addEventListener('resize', measure);
  document.addEventListener('visibilitychange', () => {
    document.body.classList.toggle('paused', document.hidden);
    syncVolume();
    cancelAnimationFrame(frameId);
    frameId = 0;
    last = null;
    if (state === 'play' || state === 'ending' || parts.length || paintedFx) scheduleFrame();
  });

  measure();
  clockEl.textContent = '18:00';
  timeEl.textContent = duration(0);
  showMenu();
})();
</script>
</body>
</html>
