<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Size Trip</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;background:#070b18;color:#eef2ff;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 44%,#0f1730 0%,#070b18 100%)}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(20,28,56,.72);border-radius:999px;min-height:44px;min-width:44px;padding:0 14px;touch-action:manipulation}
button:focus-visible{outline:2px solid #7cc8ff;outline-offset:2px}
button:active{transform:scale(.96)}
#veil{position:fixed;inset:0;background:#070b18;opacity:0;pointer-events:none;transition:opacity .1s;z-index:60}
#top{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:480px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:20}
#top>*{pointer-events:auto}
#top .grp{display:flex;gap:6px}
#top .grp button{padding:0;font-size:20px}
#pill{min-height:36px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:rgba(20,28,56,.72);border:1px solid rgba(255,255,255,.16);font-size:14px;font-weight:700;color:#ffd166;pointer-events:none}
#pill.pop{animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(1.25)}to{transform:scale(1)}}
#zbar{position:fixed;right:6px;top:82px;width:44px;height:min(60vh,calc(100vh - 290px));height:min(60dvh,calc(100dvh - 290px));min-height:120px;touch-action:none;z-index:15;cursor:pointer;transition:opacity .25s}
#zbar .trk{position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;border-radius:4px;background:rgba(255,255,255,.16);pointer-events:none}
#zbar .tk{position:absolute;right:30px;width:8px;height:1px;background:rgba(255,255,255,.4);pointer-events:none;font-size:9px;color:#8b93a7}
#zbar .tk span{position:absolute;right:11px;top:-6px;white-space:nowrap}
#thumb{position:absolute;left:0;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(20,28,56,.92);border:2px solid #7cc8ff;display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:none;box-shadow:0 0 12px rgba(124,200,255,.4)}
#ruler{position:fixed;left:12px;bottom:170px;z-index:12;pointer-events:none;font-size:12px;color:#eef2ff;transition:opacity .25s;text-shadow:0 1px 0 rgba(0,0,0,.4)}
#rb{height:8px;border:2px solid #fff;border-top:0;min-width:2px;margin-bottom:2px}
#acts{position:fixed;right:56px;bottom:170px;display:flex;gap:8px;z-index:12;transition:opacity .25s}
#bHome{padding:0;font-size:20px}
#bAuto{font-size:14px;font-weight:700}
#card{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:480px;height:152px;padding:12px 14px;border-radius:16px;background:rgba(20,28,56,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);z-index:12;transition:opacity .25s;overflow:hidden}
#cc{height:100%;display:flex;flex-direction:column;opacity:1;transition:opacity 75ms linear}
.r1{display:flex;align-items:center;gap:8px;min-height:28px}
.r1 .ic{font-size:24px;line-height:1;flex:none}
.r1 .nm{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 .sz{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#7cc8ff;flex:none;white-space:nowrap}
.fact{font-size:15px;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rat{margin-top:auto;font-size:12px;color:#8b93a7}
#gapv{display:none;height:100%;flex-direction:column;align-items:flex-start}
#gapv .nm{font-size:18px;font-weight:700}
#gapv .fact{margin-top:4px}
#gapv button{margin-top:auto;min-height:44px;background:#7cc8ff;color:#07101f;font-weight:700;border:0}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:76px 20px 11vh;text-align:center;pointer-events:none;background:linear-gradient(rgba(7,11,24,.55),rgba(7,11,24,0) 38%,rgba(7,11,24,0) 62%,rgba(7,11,24,.6));transition:opacity .25s}
#start.out{opacity:0}
#start h1{margin:0;font-size:clamp(26px,8vw,40px);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#start p{margin:8px 0 0;font-size:clamp(14px,4vw,17px);color:#c8d2ee;max-width:360px;line-height:1.4}
#start .bt{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
#bStart{font-size:20px;font-weight:800;min-height:56px;padding:0 40px;background:#7cc8ff;color:#07101f;border:0;box-shadow:0 6px 24px rgba(124,200,255,.35)}
#bAuto0{font-size:14px}
#start .hint{font-size:13px;color:#8b93a7}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;height:70%;transform:translate(-50%,105%);transition:transform .25s ease-out;z-index:40;display:flex;flex-direction:column;background:rgba(14,20,42,.97);border:1px solid rgba(255,255,255,.14);border-bottom:0;border-radius:18px 18px 0 0;visibility:hidden}
#sheet.open{transform:translate(-50%,0);visibility:visible}
#sheet h2{margin:0;padding:14px 16px 2px;font-size:18px}
#sheet .ap{padding:0 16px 8px;font-size:12px;color:#8b93a7}
#grid{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px 12px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;-webkit-overflow-scrolling:touch}
#grid button{border-radius:12px;padding:6px 2px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.06)}
#grid button.nf{color:#8b93a7;font-size:22px;cursor:default;background:rgba(255,255,255,.03)}
#grid .ic{font-size:26px;line-height:1}
#grid .nm{font-size:11px;line-height:1.2;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
#sheet .ft{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
#sheet .ft button{flex:1;font-weight:700}
#bCopy{background:#7cc8ff;color:#07101f;border:0}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);max-width:92%;padding:8px 16px;border-radius:999px;background:rgba(20,28,56,.94);border:1px solid rgba(255,255,255,.2);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
#toast.gold{border-color:#ffd166;color:#ffd166}
body.pre #zbar,body.pre #ruler,body.pre #acts,body.pre #card,body.pre #lbls{opacity:0;pointer-events:none}
#zbar:focus-visible{outline:2px solid #7cc8ff;outline-offset:2px;border-radius:8px}
#lbls{position:fixed;inset:0;z-index:13;pointer-events:none}
.lb{position:fixed;min-width:0;min-height:0;padding:0;border:0;border-radius:8px;background:transparent;pointer-events:none}
.lb[hidden]{display:none}
@media (max-width:400px){
 .r1 .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:16px;line-height:1.15}
}
@media (max-width:340px){
 #zbar .trk{width:6px;margin-left:-3px}
 .fact{font-size:14px}
 #bStart{padding:0 28px}
}
@media (prefers-reduced-motion:reduce){
 #pill.pop{animation:none}
 #sheet{transition:none}
 #cc,#start,#zbar,#ruler,#acts,#card,#toast,#veil{transition:none}
}
</style>
</head>

 }

 if(m<9.46e14){return Number((m/1.496e11).toFixed(1)).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+' AU';}

function stepAuto(dt){
 var a=auto;
 if(RM.matches){
  if(T<a.nextAt){return;}
  if(a.finish){arrive();return;}
  var nx=null,q;
  if(a.dir>0){for(q=0;q<ASC.length;q++){if(ASC[q].tz>z+0.05){nx=ASC[q];break;}}}
  else{for(q=0;q<DESC.length;q++){if(DESC[q].tz<z-0.05){nx=DESC[q];break;}}}
  if(!nx||(a.dir>0&&nx.tz>a.target+0.001)||(a.dir<0&&nx.tz<a.target-0.001)){arrive();return;}
  jump(nx.tz);a.nextAt=T+1.4;
  if(Math.abs(nx.tz-a.target)<0.001){a.finish=true;}
  return;
 }
 if(T<a.pauseUntil){zSpeed=0;return;}
 if(curId&&curId!==a.lastId){a.lastId=curId;a.pauseUntil=T+0.8;zSpeed=0;return;}
 var sp=isGap()?6:1.2;
 zSpeed=sp;
 var nz=z+a.dir*sp*dt;
 if((a.dir>0&&nz>=a.target)||(a.dir<0&&nz<=a.target)){setZ(a.target);arrive();return;}

}

 for(i=0;i<OBJ.length;i++){var o=OBJ[i];if(found[o.id]){var d=Math.abs(o.L-LSNOW);if(d>bd){bd=d;best=o;}}}
 if(!best){best=BY.snowflake;bd=0;}
 var n=Math.round(bd),nm=best.n[lang],up=best.L>=LSNOW;
 if(lang==='ko'){
  return '❄️ 눈송이에서 출발해 '+nm+(up?'까지 다녀왔어요! 크기 차이 10^'+n+'배':'까지 들어가 봤어요! 1/10^'+n+' 크기')+' · 발견 '+foundN+'/32 · play.mesisi.net';
 }
 return '❄️ I zoomed '+(up?'from a snowflake to ':'into ')+nm+'! '+(up?'That\'s 10^'+n+' times bigger':'1/10^'+n+' the size')+' · Found '+foundN+'/32 · play.mesisi.net';
}
function copyText(s){
 function fb(){
  try{
   var ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');
   ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
   document.body.appendChild(ta);ta.select();
   var ok=document.execCommand('copy');document.body.removeChild(ta);
   toast(t(ok?'copied':'copyFail'));
  }catch(e){toast(t('copyFail'));}
 }
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(s).then(function(){toast(t('copied'));},fb);
  }else{fb();}
 }catch(e){fb();}
}
