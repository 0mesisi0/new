<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세계 시간 · 시차 계산기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;background:linear-gradient(180deg,#14213d,#1f3a5f);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,#grid:focus-visible{outline:3px solid #1b2430;outline-offset:3px;box-shadow:0 0 0 3px #fff}
.mb:focus-visible,.menu button:focus-visible,.it:focus-visible{outline-offset:-4px;box-shadow:none}
#app{height:100vh;height:100dvh;max-width:720px;margin:0 auto;padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
header{flex:0 0 auto}
.hrow{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:18px;line-height:1.25;flex:1 1 auto;min-width:0}
.sub{margin:2px 0 0;font-size:12px;color:#b9c6d8}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ctl input[type=date]{height:44px;min-width:0;padding:0 8px;border-radius:10px;border:0;background:#fff;color:#1b2430}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.btn.pri{background:#c8321f}
.badge{flex:0 0 auto;font-size:12px;font-weight:700;background:#c8321f;color:#fff;border-radius:99px;padding:3px 10px}
.badge[hidden]{display:none}
#cards{flex:1 1 0;min-height:60px;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.card{flex:0 0 auto;background:rgba(255,255,255,.92);color:#1b2430;border-radius:12px;overflow:hidden;position:relative}
.card.home::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#c8321f}
.card.pop{animation:pop .22s ease-out}
.row{height:64px;display:flex;align-items:center;gap:10px;padding:0 4px 0 14px}
.ic{font-size:24px;width:30px;text-align:center;flex:0 0 30px}
.mid{flex:1 1 auto;min-width:0}
.nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dst{font-size:10px;font-weight:700;background:#f2c14e;color:#4a3800;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.dst[hidden]{display:none}
.cs{font-size:12px;color:#566170;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{flex:0 0 auto;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm.bump{animation:bump .25s ease-out}
.mb{flex:0 0 44px;width:44px;min-width:44px;height:44px;border:0;background:none;font-size:22px;color:#566170;border-radius:10px}
.menu{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.menu button{flex:0 0 auto;min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #c9d1db;background:#fff;color:#1b2430}
.menu button.dis{opacity:.4}
.gwrap{flex:0 0 auto}
.bestrow{display:flex;align-items:center;gap:4px;min-height:44px}
#best{flex:1 1 auto;min-width:0;text-align:center;font-size:13px;line-height:1.25;font-weight:700}
.step{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1}
#bub{font-size:12px;background:#fff;color:#1b2430;border-radius:8px;padding:4px 8px;margin-bottom:4px;white-space:normal}
#bub[hidden]{display:none}
#grid{position:relative;background:rgba(255,255,255,.92);border-radius:10px;color:#1b2430;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;cursor:pointer}
.r{display:grid;grid-template-columns:var(--lw) repeat(24,var(--cw));height:26px;align-items:stretch}
.r.hd{height:20px}.r.sr{height:16px}
.lb{font-size:11px;font-weight:700;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.c,.h,.st{display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;border-left:1px solid transparent;position:relative;overflow:hidden;white-space:nowrap}
.h{color:#566170;font-weight:700}
.st{color:#c8321f;font-size:12px;font-weight:700}
.r{position:relative}
.c.w,.sw.w{background:#3fb27f;color:#06301f;font-weight:700;box-shadow:inset 0 -4px 0 #06301f}
.c.a,.sw.a{background-color:#f2c14e;background-image:radial-gradient(circle,rgba(74,56,0,.5) 1px,transparent 1.6px);background-size:5px 5px;color:#4a3800;font-weight:600}
.c.s,.sw.s{background:repeating-linear-gradient(135deg,#b4bdc9 0 3px,#d6dce4 3px 8px);color:#3d4856}
.mo .c.s::after{content:"🌙";position:absolute;right:1px;bottom:-1px;font-size:8px}
.c.dd::before{content:"";position:absolute;left:2px;top:2px;width:4px;height:4px;border-radius:50%;background:#1b2430}
.nw{border-left:2px dashed #1b2430 !important}
.nowl{position:absolute;top:1px;bottom:1px;display:flex;align-items:center;padding:0 4px;border-radius:99px;background:#c8321f;color:#fff;font-size:9px;font-weight:700;transform:translateX(-50%);pointer-events:none;white-space:nowrap;z-index:1}
#sel{position:absolute;top:0;bottom:0;border:2px solid #1b2430;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px #fff;border-radius:4px;pointer-events:none;transition:left .12s}
#sel[hidden]{display:none}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#d4deec;margin-top:6px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.note{font-size:11px;color:#9fb0c6;margin-top:2px}
#hint{font-size:12px;color:#f2c14e;text-align:center}
#hint[hidden]{display:none}
.bar{flex:0 0 auto;display:flex;gap:8px;height:52px;margin:0 0 8px}
.bar .btn{flex:1;height:52px;font-size:16px}
.bar .btn:disabled{opacity:.45;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:68px;transform:translate(-50%,8px);background:#0c1626;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:20}
#sheet[hidden]{display:none}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sh{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;height:min(80vh,560px);background:#fff;color:#1b2430;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.top{display:flex;gap:8px;padding:12px}
#q{flex:1;min-width:0;height:44px;border:1px solid #c9d1db;border-radius:10px;padding:0 12px;font-size:16px}
.top .btn{background:#e6ebf1;color:#1b2430}
#list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:0 8px 12px}
.it{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:6px 10px;border:0;background:none;color:#1b2430;text-align:left;border-radius:10px}
.it.act{background:#eef3f9;box-shadow:inset 0 0 0 2px #c8321f}
.it[aria-disabled=true]{opacity:.55;cursor:default}
.sh:focus{outline:none}
.it b{font-size:15px}.it small{display:block;font-size:12px;color:#566170}
.it .ck{font-size:12px;color:#1d7a50;font-weight:700;white-space:nowrap}
#none{padding:20px;text-align:center;color:#566170}
#fatal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px;z-index:50;background:#14213d}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes bump{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@media (max-width:359px){#app{padding:8px 12px 0}.tm{font-size:24px}.btn{padding:0 10px}}
@media (max-height:700px){#app{gap:4px;padding-top:4px}h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note,#bub{display:none !important}.r{height:20px}.r.hd{height:16px}.r.sr{height:14px}.ctl{margin-top:4px}.bar{margin-bottom:4px}.lg{margin-top:4px}}
@media (max-height:519px){.row{height:52px}.cs,.sub{display:none}.badge{padding:1px 8px}.lg{margin-top:2px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow"><h1 data-t="appTitle"></h1><span class="badge" id="badge" data-t="selected" hidden></span></div>
    <p class="sub" data-t="sub"></p>
    <div class="ctl">
      <input type="date" id="date" min="1970-01-01" max="2100-12-31">
      <button class="btn" id="nowBtn" data-t="now"></button>
      <button class="btn" id="fmtBtn"></button>
    </div>
  </header>
  <div id="cards"></div>
  <div class="gwrap">
    <div class="bestrow"><button class="step" id="prevBtn">‹</button><div id="best"></div><button class="step" id="nextBtn">›</button></div>
    <div id="bub" hidden></div>
    <div id="grid" role="slider" tabindex="0" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="23" aria-valuenow="0"></div>
    <div class="lg"><span><i class="sw w"></i><b data-t="legendWork" style="font-weight:400"></b></span><span><i class="sw a"></i><b data-t="legendAwake" style="font-weight:400"></b></span><span><i class="sw s"></i><b data-t="legendSleep" style="font-weight:400"></b></span></div>
    <div class="note" data-t="note"></div>
  </div>
  <div id="hint" hidden></div>
  <div class="bar">
    <button class="btn" id="copyBtn" data-t="copy"></button>
    <button class="btn pri" id="addBtn" data-t="addCity"></button>
  </div>
</div>
<div id="sheet" hidden>
  <div class="bd" id="bd"></div>
  <div class="sh" id="dlg" tabindex="-1" role="dialog" aria-modal="true">
    <div class="top"><input id="q" type="search" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" autocomplete="off" spellcheck="false"><button class="btn" id="closeBtn" data-t="close"></button></div>
    <div id="list" role="listbox"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

})();
function save(){if(demo)return;try{localStorage.setItem("wtp:cities",JSON.stringify(cities.map(function(c){return c.id})));localStorage.setItem("wtp:fmt",fmt)}catch(e){}}

var dateStr,todayStr,selT=null,selCol=null,inst=[],menuId=null,cw=0,lw=72,lastNow=-2;
function home(){return cities[0]}
function layout(){
  var a=dateStr.split("-").map(Number),m=midnight(home().tz,a[0],a[1],a[2]);
  inst=[];for(var k=0;k<24;k++)inst.push(m+k*3600000);
  /* selT = exact selected instant; selCol = only the highlighted column containing it */
  selCol=null;
  if(selT!=null){var j=Math.floor((selT-inst[0])/3600000);if(j>=0&&j<24)selCol=j}
}
function nowCol(){
  if(dateStr!==todayStr)return null;
  var n=Date.now();
  for(var k=0;k<24;k++)if(n>=inst[k]&&n<inst[k]+3600000)return k;
  return null;
}
function curT(){return selT!=null?selT:Date.now()}
function lvl(w){var h=w.hour+w.minute/60;return h>=9&&h<18?2:(h>=7&&h<23?1:0)}
function updateSlider(){
  if(!inst.length)return;
  var g=$("grid"),t=curT(),nc=nowCol();
  var k=selCol!=null?selCol:(selT==null&&nc!=null?nc:0);
  var txt=(selT==null?S.now+": ":"")+cities.map(function(c){return nm(c)+" "+fmtTime(c.tz,t)+" "+S[["stAsleep","stAwake","stWork"][lvl(wall(c.tz,t))]]}).join(", ");
  g.setAttribute("aria-valuenow",k);
  if(g.getAttribute("aria-valuetext")!==txt)g.setAttribute("aria-valuetext",txt);
}

/* ---- toast ---- */
var tt;
function toast(s){var e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("show")},1600)}

/* ---- cards ---- */
var cardEls=[];
function renderCards(popId,focusId){
  var box=$("cards");box.innerHTML="";cardEls=[];
  cities.forEach(function(c,i){
    var d=document.createElement("div");
    d.className="card"+(i===0?" home":"")+(c.id===popId?" pop":"");
    d.dataset.id=c.id;
    d.innerHTML='<div class="row"><div class="ic"></div><div class="mid"><div class="nm"><span class="n"></span><span class="dst" hidden></span></div><div class="cs"></div></div><div class="tm"></div><button class="mb" aria-haspopup="true"></button></div>';
    d.querySelector(".n").textContent=(i===0?"🏠 ":"")+nm(c);
    d.querySelector(".dst").textContent=S.dst;
    var mb=d.querySelector(".mb");mb.textContent="⋯";mb.setAttribute("aria-label",S.more+" · "+nm(c));
    mb.setAttribute("aria-expanded",menuId===c.id?"true":"false");
    if(menuId===c.id){
      var m=document.createElement("div");m.className="menu";
      var acts=[];
      if(i>0)acts.push(["makeHome"],["up"]);
      if(i<cities.length-1)acts.push(["down"]);
      acts.push(["remove"]);
      acts.forEach(function(a){
        var b=document.createElement("button");b.textContent=S[a[0]];b.dataset.act=a[0];
        if(a[0]==="remove"&&cities.length<2)b.className="dis";
        m.appendChild(b);
      });
      d.appendChild(m);
    }
    box.appendChild(d);cardEls.push(d);
  });
  $("addBtn").disabled=cities.length>=6;
  var h=$("hint");h.hidden=cities.length<6;h.textContent=S.max;
  updateCards();
  if(focusId)cardEls.forEach(function(el){if(el.dataset.id===focusId)el.querySelector(".mb").focus()});
}
function updateCards(){
  var t=curT(),h=home(),hd=ymd(h.tz,t).split("-").map(Number),hoff=offset(h.tz,t);
  cities.forEach(function(c,i){
    var el=cardEls[i];if(!el)return;
    var w=wall(c.tz,t),off=offset(c.tz,t);
    el.querySelector(".ic").textContent=(w.hour>=6&&w.hour<18)?"☀️":"🌙";
    var dd=Math.round((Date.UTC(w.year,w.month-1,w.day)-Date.UTC(hd[0],hd[1]-1,hd[2]))/864e5);
    var s=fmtDate(c.tz,t,true)+(dd<0?" ("+S.yesterday+")":dd>0?" ("+S.tomorrow+")":"")+" · "+(i===0?S.home:diffStr(off-hoff));
    el.querySelector(".cs").textContent=s;
    el.querySelector(".dst").hidden=!isDst(c.tz,t);
    var tm=el.querySelector(".tm"),txt=fmtTime(c.tz,t);
    if(tm.textContent!==txt){var had=tm.textContent!=="";tm.textContent=txt;if(had){tm.classList.remove("bump");void tm.offsetWidth;tm.classList.add("bump")}}
  });
  updateSlider();
}

/* ---- grid ---- */
function renderGrid(){
  layout();
  var g=$("grid"),W=g.clientWidth||320;
  lw=W<400?44:72;cw=Math.max(10,(W-lw)/24);
  g.style.setProperty("--lw",lw+"px");g.style.setProperty("--cw",cw+"px");
  g.classList.toggle("mo",cw>=28);
  var nc=nowCol();lastNow=nc;
  var lv=cities.map(function(c){return inst.map(function(x){return lvl(wall(c.tz,x))})});
  var star=[],anyW=false;
  for(var k=0;k<24;k++){var all=lv.every(function(r){return r[k]===2});star.push(all?"★":"");if(all)anyW=true}
  var anyA=false;
  if(!anyW)for(k=0;k<24;k++)if(lv.every(function(r){return r[k]>=1})){star[k]="☆";anyA=true}
  $("best").textContent=anyW?S.bestWork:anyA?S.bestAwake:S.noOverlap;
  var big=cw>=22,h="";
  h+='<div class="r sr"><div class="lb"></div>';
  for(k=0;k<24;k++)h+='<div class="st'+(k===nc?" nw":"")+'">'+(star[k]||"")+"</div>";
  h+='</div><div class="r hd"><div class="lb"></div>';
  for(k=0;k<24;k++){var hw=wall(home().tz,inst[k]).hour;h+='<div class="h'+(k===nc?" nw":"")+'">'+((big||k%3===0)?hw:"")+"</div>"}
  if(nc!=null)h+='<div class="nowl" style="left:'+Math.min(W-16,Math.max(lw+12,lw+nc*cw+cw/2))+'px">'+S.now+"</div>";
  h+="</div>";
  cities.forEach(function(c,i){
    h+='<div class="r"><div class="lb"'+(i?"":' style="color:#c8321f"')+">"+nm(c).replace(/&/g,"&amp;")+"</div>";
    for(var k=0;k<24;k++){
      var w=wall(c.tz,inst[k]),cls=["s","a","w"][lv[i][k]];
      var txt=big?(w.minute?w.hour+":"+p2(w.minute):w.hour):"";
      var dif=(w.year+"-"+p2(w.month)+"-"+p2(w.day))!==dateStr;
      h+='<i class="c '+cls+(dif?" dd":"")+(k===nc?" nw":"")+'">'+txt+"</i>";
    }
    h+="</div>";
  });
  h+='<div id="sel" hidden></div>';
  g.innerHTML=h;
  g.setAttribute("aria-label",S.pickTime);
  placeSel();updateBubble();updateSlider();
}
function placeSel(){
  var s=$("sel");if(!s)return;
  s.hidden=selCol==null;
  if(selCol!=null){s.style.left=(lw+selCol*cw)+"px";s.style.width=cw+"px"}
}
function updateBubble(){
  var b=$("bub");
  if(cw>=22){b.hidden=true;return}
  var nc=nowCol(),t=selT!=null?selT:(nc!=null?inst[nc]:null);
  if(t==null){b.hidden=true;return}
  b.hidden=false;
  b.textContent=cities.map(function(c){return nm(c)+" "+fmtTime(c.tz,t)}).join(" · ");
}

/* ---- selection / now ---- */
function applySel(){
  placeSel();updateBubble();updateCards();
  $("badge").hidden=selT==null;
  if(selT!=null)stopTimer();else startTimer();
}
function setSel(k){k=Math.max(0,Math.min(23,k));selT=inst[k];selCol=k;applySel()}
function step(d){
  var nc=nowCol();
  setSel(selCol!=null?selCol+d:(selT==null&&nc!=null?nc:(d>0?0:23)));
}
function goNow(){
  selT=null;selCol=null;dateStr=todayStr=ymd(home().tz,Date.now());
  $("date").value=dateStr;renderGrid();applySel();
}
function clampDate(v){
  var m=/^(\d{4,6})-(\d\d)-(\d\d)$/.exec(v||"");
  if(!m)return todayStr;
  var y=+m[1];if(y<1970)return"1970-01-01";if(y>2100)return"2100-12-31";
  return v;
}
/* home change keeps the exact selected instant (selT); only date input and highlighted column are recomputed */
function rehome(fn){
  var before=home();
  fn();
  if(home()!==before){
    todayStr=ymd(home().tz,Date.now());
    dateStr=selT!=null?clampDate(ymd(home().tz,selT)):todayStr;
    $("date").value=dateStr;
  }
}

/* ---- timer ---- */
var timer=null;
function stopTimer(){clearTimeout(timer);timer=null}
function startTimer(){
  stopTimer();
  if(selT!=null||document.hidden)return;
  timer=setTimeout(tick,1000-Date.now()%1000+5);
}
function tick(){
  if(selT==null){
    var td=ymd(home().tz,Date.now());
    if(td!==todayStr){
      if(dateStr===todayStr){dateStr=td;$("date").value=td}
      todayStr=td;renderGrid();
    }else if(nowCol()!==lastNow)renderGrid();
    updateCards();
  }
  startTimer();
}
document.addEventListener("visibilitychange",function(){if(document.hidden)stopTimer();else if(selT==null)tick()});

/* ---- sheet ---- */
var act=0,shown=[];
function openSheet(){
  if(cities.length>=6){toast(S.max);return}
  $("app").inert=true;
  $("sheet").hidden=false;$("q").value="";renderList();
  if(window.matchMedia&&matchMedia("(pointer:fine)").matches)$("q").focus();else $("dlg").focus();
}
function hideSheet(){$("sheet").hidden=true;$("app").inert=false}
function closeSheet(){hideSheet();$("addBtn").focus()}
function sheetOpen(){return!$("sheet").hidden}
function renderList(){
  /* picker shows real current times, not the scheduled instant */
  var q=norm($("q").value),t=Date.now(),h=home(),hoff=offset(h.tz,t),box=$("list");
  shown=CITIES.filter(function(c){return!q||c.key.indexOf(q)>=0});
  box.innerHTML="";
  if(!shown.length){var n=document.createElement("div");n.id="none";n.textContent=S.noResult;box.appendChild(n);return}
  var first=-1;
  shown.forEach(function(c,i){
    var has=cities.indexOf(c)>=0;
    var b=document.createElement("button");b.className="it";b.dataset.i=i;b.id="opt"+i;b.tabIndex=-1;b.setAttribute("role","option");
    if(has)b.setAttribute("aria-disabled","true");
    var l=document.createElement("span"),bn=document.createElement("b"),sm=document.createElement("small");
    bn.textContent=nm(c);sm.textContent=fmtTime(c.tz,t)+" · "+diffStr(offset(c.tz,t)-hoff);
    l.appendChild(bn);l.appendChild(sm);b.appendChild(l);
    if(has){var ck=document.createElement("span");ck.className="ck";ck.textContent="✓ "+S.added;b.appendChild(ck)}
    else if(first<0)first=i;
    box.appendChild(b);
  });
  act=first;markAct();
}
function markAct(){
  var els=$("list").querySelectorAll(".it");
  for(var i=0;i<els.length;i++){els[i].classList.toggle("act",i===act);els[i].setAttribute("aria-selected",i===act?"true":"false")}
  var q=$("q");
  if(els[act]){q.setAttribute("aria-activedescendant",els[act].id);els[act].scrollIntoView({block:"nearest"})}
  else q.removeAttribute("aria-activedescendant");
}
function moveAct(d){
  var i=act;
  for(var n=0;n<shown.length;n++){
    i+=d;if(i<0||i>=shown.length)return;
    if(cities.indexOf(shown[i])<0){act=i;markAct();return}
  }
}
function addCity(c){
  if(!c||cities.length>=6||cities.indexOf(c)>=0)return;
  cities.push(c);save();
  hideSheet();
  renderCards(c.id,c.id);renderGrid();applySel();
  var box=$("cards");box.scrollTop=box.scrollHeight;
}

/* ---- copy ---- */
function copyText(){
  var t=curT(),h=home(),L=[];
  L.push(S.copyHead.replace("{home}",nm(h)).replace("{date}",fmtDate(h.tz,t,true)).replace("{time}",fmtTime(h.tz,t)));
  cities.forEach(function(c){L.push("· "+nm(c)+" "+fmtTime(c.tz,t)+" ("+fmtDate(c.tz,t,false)+")")});
  L.push("play.mesisi.net");
  var s=L.join("\n");
  function fb(){
    var ok=false;
    try{var a=document.createElement("textarea");a.value=s;a.style.cssText="position:fixed;left:-9999px;top:0";document.body.appendChild(a);a.select();ok=document.execCommand("copy");document.body.removeChild(a)}catch(e){}
    toast(ok?S.copied:S.copyFail);
  }
  try{navigator.clipboard.writeText(s).then(function(){toast(S.copied)},fb)}catch(e){fb()}
}

/* ---- events ---- */
var dragging=false;
function pick(e){
  var r=$("grid").getBoundingClientRect();
  var k=Math.floor((e.clientX-r.left-lw)/cw);
  k=Math.max(0,Math.min(23,k));
  if(k!==selCol)setSel(k);
}
var gr=$("grid");
gr.addEventListener("pointerdown",function(e){e.preventDefault();gr.focus({preventScroll:true});dragging=true;try{gr.setPointerCapture(e.pointerId)}catch(x){}pick(e)});
gr.addEventListener("pointermove",function(e){if(dragging){e.preventDefault();pick(e)}});
function endDrag(){dragging=false}
gr.addEventListener("pointerup",endDrag);gr.addEventListener("pointercancel",endDrag);

$("nowBtn").onclick=goNow;
$("prevBtn").onclick=function(){step(-1)};$("nextBtn").onclick=function(){step(1)};
$("fmtBtn").onclick=toggleFmt;
function toggleFmt(){fmt=fmt==="12"?"24":"12";save();setFmtLabel();updateCards();updateBubble();if(sheetOpen())renderList()}
function setFmtLabel(){$("fmtBtn").textContent=fmt==="12"?S.fmt12:S.fmt24}
$("copyBtn").onclick=copyText;
$("addBtn").onclick=openSheet;
$("closeBtn").onclick=closeSheet;$("bd").onclick=closeSheet;
$("q").addEventListener("input",renderList);
$("list").addEventListener("click",function(e){
  var b=e.target.closest(".it");if(!b||b.getAttribute("aria-disabled")==="true")return;
  addCity(shown[+b.dataset.i]);
});
$("date").addEventListener("change",function(){
  var v=clampDate($("date").value),k=selCol;
  dateStr=v;$("date").value=v;layout();
  if(selT!=null)selT=inst[k!=null?k:0];
  else if(v!==todayStr)selT=inst[Math.min(23,wall(home().tz,Date.now()).hour)];
  renderGrid();applySel();
});
$("cards").addEventListener("click",function(e){
  var card=e.target.closest(".card");if(!card)return;
  var id=card.dataset.id,i=cities.map(function(c){return c.id}).indexOf(id);
  if(e.target.closest(".mb")){menuId=menuId===id?null:id;renderCards(null,id);return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if(a==="remove"&&cities.length<2){toast(S.lastOne);return}
  var c=cities[i],fid=c.id;
  rehome(function(){
    if(a==="makeHome"){cities.splice(i,1);cities.unshift(c)}
    else if(a==="up"){cities[i]=cities[i-1];cities[i-1]=c}
    else if(a==="down"){cities[i]=cities[i+1];cities[i+1]=c}
    else if(a==="remove"){cities.splice(i,1);fid=cities[Math.min(i,cities.length-1)].id}
  });
  menuId=null;save();renderCards(null,fid);renderGrid();applySel();
});
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(sheetOpen()){
    if(k==="Tab"){
      var a0=document.activeElement,fi=$("q"),la=$("closeBtn");
      if(!$("sheet").contains(a0)){e.preventDefault();fi.focus()}
      else if(e.shiftKey&&(a0===fi||a0===$("dlg"))){e.preventDefault();la.focus()}
      else if(!e.shiftKey&&a0===la){e.preventDefault();fi.focus()}
    }
    else if(k==="Escape"){e.preventDefault();closeSheet()}
    else if(k==="ArrowDown"){e.preventDefault();moveAct(1)}
    else if(k==="ArrowUp"){e.preventDefault();moveAct(-1)}
    else if(k==="Enter"&&e.target.tagName!=="BUTTON"){e.preventDefault();if(shown[act]&&cities.indexOf(shown[act])<0)addCity(shown[act])}
    return;
  }
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA")return;
  if(k==="Escape"&&menuId){var mid=menuId;menuId=null;renderCards(null,mid);return}
  var u=k.length===1?k.toUpperCase():k;
  if(k==="ArrowLeft"||k==="ArrowRight"){
    e.preventDefault();
    step(k==="ArrowLeft"?-1:1);
  }else if(k==="Home"){e.preventDefault();setSel(0)}
  else if(k==="End"){e.preventDefault();setSel(23)}
  else if(u==="N"){goNow()}
  else if(u==="C"){copyText()}
  else if(u==="A"){e.preventDefault();openSheet()}
  else if(u==="T"){toggleFmt()}
});
window.addEventListener("resize",function(){renderGrid()});
window.addEventListener("orientationchange",function(){setTimeout(renderGrid,100)});

/* ---- init ---- */
Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=S[e.dataset.t]});
$("q").placeholder=S.search;$("q").setAttribute("aria-label",S.search);
$("dlg").setAttribute("aria-label",S.addCity.replace(/^\+\s*/,""));
$("prevBtn").setAttribute("aria-label",S.prevHour);$("nextBtn").setAttribute("aria-label",S.nextHour);
$("date").setAttribute("aria-label",S.date);
setFmtLabel();
todayStr=dateStr=ymd(home().tz,Date.now());
if(demo){dateStr="2026-12-24";layout();selT=inst[21]}
$("date").value=dateStr;
renderCards();renderGrid();applySel();
})();
</script>
</body>
</html>
