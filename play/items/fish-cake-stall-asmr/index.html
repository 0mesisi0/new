<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어묵 포장마차 ASMR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#172638;color:#FFF2DA;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:18px;line-height:1.2;text-align:center}
.snd{display:flex;align-items:center;gap:8px}
#stat{flex:1;font-size:14px;line-height:1.2}
button{font:inherit;font-weight:700;font-size:14px;min-height:44px;padding:6px 14px;border:0;border-radius:12px;background:#FFD497;color:#172638;cursor:pointer;line-height:1.15;touch-action:manipulation}
button:active{filter:brightness(.88)}
@media (prefers-reduced-motion:no-preference){button:active{transform:scale(.96)}}
button[aria-disabled="true"]{opacity:.6;cursor:default}
#snd{min-width:128px}
.sec{background:#FFF2DA;color:#172638}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px #172638}
#scene{flex:1 1 0;min-height:0;touch-action:none;border-radius:12px;overflow:hidden}
#scene svg{display:block;width:100%;height:100%}
.panel{background:rgba(255,242,218,.08);border-radius:12px;padding:0 10px}
.row{display:flex;align-items:center;gap:8px;min-height:44px}
.row label{flex:0 0 84px;font-size:13px;line-height:1.15}
.row output{flex:0 0 40px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#FFD497 var(--v),rgba(255,242,218,.3) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:44px;height:44px;margin-top:-19px;border-radius:50%;background:#FFD497;border:3px solid #172638;box-shadow:0 0 0 1px #FFF2DA,inset 0 0 0 7px #FFD497;background-clip:padding-box}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,242,218,.3)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#FFD497}
input[type=range]::-moz-range-thumb{box-sizing:border-box;width:44px;height:44px;border-radius:50%;background:#FFD497;border:3px solid #172638;box-shadow:0 0 0 1px #FFF2DA,inset 0 0 0 7px #FFD497}
.acts{display:flex;gap:8px}
.acts button{flex:1}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:520px){#app{padding:4px 10px;gap:4px}h1{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <h1 id="ttl"></h1>
  <div class="snd"><span id="stat"></span><button id="snd" type="button"></button></div>
  <div id="scene">
<svg id="svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img">
  <defs>
    <clipPath id="awn"><path d="M0,26 L320,26 L320,62 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 a20,12 0 0 1 -40,0 Z"/></clipPath>
    <clipPath id="cupc"><path d="M212,126 L258,126 L251,170 L219,170 Z"/></clipPath>
  </defs>
  <g aria-hidden="true">
    <rect width="320" height="240" fill="#172638"/>
    <g fill="#FFF2DA" opacity=".6"><circle cx="20" cy="12" r="1.5"/><circle cx="64" cy="18" r="1.2"/><circle cx="118" cy="9" r="1.6"/><circle cx="170" cy="16" r="1.2"/><circle cx="226" cy="8" r="1.5"/><circle cx="276" cy="17" r="1.3"/><circle cx="302" cy="7" r="1.2"/><circle cx="30" cy="226" r="1.5"/><circle cx="96" cy="232" r="1.2"/><circle cx="160" cy="224" r="1.5"/><circle cx="240" cy="233" r="1.3"/><circle cx="298" cy="226" r="1.5"/></g>
    <rect x="22" y="60" width="276" height="112" fill="#FFD497" opacity=".9"/>
    <rect x="22" y="60" width="276" height="112" fill="none" stroke="#6b4a3a" stroke-width="4"/>
    <g fill="#E9B46E" opacity=".7"><rect x="190" y="72" width="30" height="18" rx="2"/><rect x="226" y="72" width="30" height="18" rx="2"/><rect x="262" y="72" width="26" height="18" rx="2"/></g>
    <g clip-path="url(#awn)"><rect x="0" y="26" width="320" height="50" fill="#A73732"/>
      <g fill="#C4504A"><rect x="40" y="26" width="40" height="50"/><rect x="120" y="26" width="40" height="50"/><rect x="200" y="26" width="40" height="50"/><rect x="280" y="26" width="40" height="50"/></g></g>
    <rect x="0" y="22" width="320" height="6" fill="#7e2724"/>
    <g id="drops" stroke="#9FC3E8" stroke-width="1.6" stroke-linecap="round"></g>
    <rect x="0" y="170" width="320" height="70" fill="#2c1f24"/>
    <rect x="0" y="170" width="320" height="6" fill="#6b4a3a"/>
    <path d="M0,205 H320" stroke="#3d2c31" stroke-width="2"/>
    <!-- skewers -->
    <g stroke="#C9893F" stroke-width="1.4" fill="#F3D9A6">
      <line x1="70" y1="124" x2="62" y2="76" stroke="#8a6a3c" stroke-width="2"/>
      <rect x="57" y="82" width="12" height="9" rx="4"/><rect x="59" y="94" width="12" height="9" rx="4"/><rect x="61" y="106" width="12" height="9" rx="4"/>
      <line x1="100" y1="122" x2="98" y2="68" stroke="#8a6a3c" stroke-width="2"/>
      <rect x="92" y="74" width="12" height="9" rx="4"/><rect x="92" y="86" width="12" height="9" rx="4"/><rect x="93" y="98" width="12" height="9" rx="4"/>
      <line x1="132" y1="124" x2="140" y2="76" stroke="#8a6a3c" stroke-width="2"/>
      <rect x="133" y="82" width="12" height="9" rx="4"/><rect x="131" y="94" width="12" height="9" rx="4"/><rect x="129" y="106" width="12" height="9" rx="4"/>
    </g>
    <!-- pot -->
    <path d="M40,118 H170 V160 a10,10 0 0 1 -10,10 H50 a10,10 0 0 1 -10,-10 Z" fill="#ABB8C3"/>
    <rect x="40" y="140" width="130" height="4" fill="#8998a5"/>
    <rect x="30" y="128" width="12" height="6" rx="3" fill="#8998a5"/><rect x="168" y="128" width="12" height="6" rx="3" fill="#8998a5"/>
    <ellipse cx="105" cy="118" rx="65" ry="9" fill="#ABB8C3"/>
    <ellipse cx="105" cy="118" rx="59" ry="6.5" fill="#C98532"/>
    <g id="wnd" stroke="#FFF2DA" stroke-width="1.6" stroke-linecap="round" fill="none"></g>
    <g id="bubs" fill="#F3C27A" stroke="#FFE3B5" stroke-width=".8"></g>
    <!-- cup -->
    <ellipse cx="235" cy="126" rx="23" ry="4" fill="#E3CFA8"/>
    <rect id="liq" x="205" y="170" width="60" height="0" fill="#D9953B" clip-path="url(#cupc)"/>
    <path d="M212,126 L258,126 L251,170 L219,170 Z" fill="none" stroke="#FFF2DA" stroke-width="3" stroke-linejoin="round"/>
    <path d="M211,126 L258.800,126 L257,138 L213,138 Z" fill="#FFF2DA" opacity=".0"/>
    <path d="M214,144 L256,144 L254,156 L216,156 Z" fill="#A73732" opacity=".85"/>
    <path d="M213,127 L257,127 L251,170 L219,170 Z" fill="#FFF2DA" opacity=".18"/>
    <g id="steam" fill="none" stroke="#FFF2DA" stroke-width="3" stroke-linecap="round" opacity="0"><path id="s1"/><path id="s2"/></g>
  </g>
</svg>
  </div>
  <div class="panel" id="panel"></div>
  <div class="acts"><button id="pour" type="button"></button><button id="reset" type="button" class="sec"></button></div>
  <div id="live" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
"use strict";
var D={
ko:{title:"어묵 포장마차 ASMR",sceneLabel:"겨울 골목의 어묵 포장마차",soundOff:"소리 꺼짐",soundStart:"소리 켜기",soundStarting:"소리 켜는 중…",soundOn:"소리 재생 중",soundStop:"소리 끄기",soundPaused:"소리 일시 정지",soundResume:"소리 다시 켜기",soundError:"소리를 켤 수 없어요.",soundRetry:"다시 시도",broth:"끓는 국물",rain:"천막 빗소리",wind:"골목 바람",level:"{value}%",cupEmpty:"빈 종이컵",pour:"국물 따르기",pouring:"따르는 중…",cupFilled:"종이컵에 국물이 찼어요.",pourAgain:"한 잔 더",reset:"믹스 초기화",mixReset:"기본 소리 크기로 돌아왔어요."},
en:{title:"Fish Cake Stall ASMR",sceneLabel:"A fish cake stall on a winter street",soundOff:"Sound off",soundStart:"Turn on sound",soundStarting:"Starting sound…",soundOn:"Sound playing",soundStop:"Turn off sound",soundPaused:"Sound paused",soundResume:"Resume sound",soundError:"Sound couldn’t start.",soundRetry:"Try again",broth:"Simmering broth",rain:"Awning rain",wind:"Alley wind",level:"{value}%",cupEmpty:"Empty paper cup",pour:"Pour broth",pouring:"Pouring…",cupFilled:"The cup is full of broth.",pourAgain:"Pour another cup",reset:"Reset mix",mixReset:"Default sound levels restored."}
};
var q=new URLSearchParams(location.search).get("lang");
var LANG=(q==="ko"||q==="en")?q:(String(navigator.language||"").toLowerCase().indexOf("ko")===0?"ko":"en");
var T=D[LANG];
document.documentElement.lang=LANG;
document.title=T.title;
var $=function(id){return document.getElementById(id)};
var NS="http"+"://www.w3.org/2000/svg"; // SVG namespace id, not a network request
var KEYS=["broth","rain","wind"],DEF={broth:65,rain:35,wind:15},KEY="fish-cake-stall-asmr:mix:v1";
var mix={broth:65,rain:35,wind:15};
try{
  var o=JSON.parse(localStorage.getItem(KEY));
  if(o&&typeof o==="object")KEYS.forEach(function(k){var v=o[k];if(typeof v==="number"&&isFinite(v))mix[k]=Math.round(Math.min(100,Math.max(0,v))/5)*5});
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mix))}catch(e){}}
var lv=function(v){return T.level.replace("{value}",v)};

/* ---------- UI ---------- */
$("ttl").textContent=T.title;
$("reset").textContent=T.reset;
$("svg").setAttribute("aria-label",T.sceneLabel);
var live=$("live");
function announce(t){live.textContent="";setTimeout(function(){live.textContent=t},50)}
var sliders={},outs={};
KEYS.forEach(function(k){
  var r=document.createElement("div");r.className="row";
  var l=document.createElement("label");l.htmlFor="s-"+k;l.textContent=T[k];
  var i=document.createElement("input");i.type="range";i.min=0;i.max=100;i.step=5;i.id="s-"+k;
  var out=document.createElement("output");out.htmlFor="s-"+k;
  r.appendChild(l);r.appendChild(i);r.appendChild(out);$("panel").appendChild(r);
  sliders[k]=i;outs[k]=out;
  i.addEventListener("input",function(){mix[k]=+i.value;showSlider(k);setLayer(k);draw()});
  i.addEventListener("change",save);
});
function showSlider(k){
  var s=sliders[k];s.value=mix[k];s.style.setProperty("--v",mix[k]+"%");
  s.setAttribute("aria-valuetext",lv(mix[k]));outs[k].textContent=lv(mix[k]);
}
KEYS.forEach(showSlider);

/* ---------- state ---------- */
var state="off"; // off | starting | on | error | paused
var cup={level:0,pouring:false,filled:false,t:0},steamT=0;
var mq=window.matchMedia("(prefers-reduced-motion: reduce)"),reduced=mq.matches;
function render(){
  $("stat").textContent=state==="on"?T.soundOn:state==="error"?T.soundError:state==="paused"?T.soundPaused:T.soundOff;
  $("snd").textContent=state==="on"?T.soundStop:state==="starting"?T.soundStarting:state==="error"?T.soundRetry:state==="paused"?T.soundResume:T.soundStart;
  $("snd").setAttribute("aria-disabled",String(state==="starting"));
  $("pour").textContent=cup.pouring?T.pouring:cup.filled?T.pourAgain:T.pour;
  $("pour").setAttribute("aria-disabled",String(cup.pouring));
  $("svg").setAttribute("aria-label",T.sceneLabel+", "+(cup.filled?T.cupFilled:T.cupEmpty));
}

/* ---------- scene ---------- */
var NB=10,ND=16,bubs=[],drops=[],pb=[],pd=[];
function mk(tag,parent){var e=document.createElementNS(NS,tag);parent.appendChild(e);return e}
for(var i=0;i<NB;i++){bubs.push(mk("circle",$("bubs")));pb.push((i*.37)%1)}
for(i=0;i<ND;i++){drops.push(mk("line",$("drops")));pd.push((i*.29)%1)}
var NW=4,wl=[],pw=[.1,.35,.6,.85];
for(i=0;i<NW;i++)wl.push(mk("path",$("wnd")));
function steamPath(x,dx,w,ph){
  return "M"+x+",116 C"+(x-9+w+dx*.3)+",104 "+(x+9-w+dx*.6)+",94 "+(x+dx+w*.6)+",80";
}
function draw(){
  var kb=mix.broth>0?Math.ceil(mix.broth/100*NB):0,kr=mix.rain>0?Math.ceil(mix.rain/100*ND):0,p;
  for(var i=0;i<NB;i++){
    var b=bubs[i];p=pb[i];
    if(i<kb){b.setAttribute("cx",55+((i*7)%10)*10.5);b.setAttribute("cy",118+((i*3)%5)-2);b.setAttribute("r",(1+p*3.2).toFixed(2));b.setAttribute("opacity",((1-p*p)*.9).toFixed(2))}
    else b.setAttribute("opacity",0);
  }
  for(i=0;i<ND;i++){
    var d=drops[i];p=pd[i];
    if(i<kr){var x=10+((i*7)%16)*20,y=64+p*84;d.setAttribute("x1",x);d.setAttribute("x2",x);d.setAttribute("y1",y.toFixed(1));d.setAttribute("y2",(y+9).toFixed(1));d.setAttribute("opacity",.85)}
    else d.setAttribute("opacity",0);
  }
  var wl0=mix.wind/100*70;
  for(i=0;i<NW;i++){
    var w0=wl[i];
    if(mix.wind>0){
      var wx=20+((i*83+pw[i]*200)%240),wy=186+i*10;
      w0.setAttribute("d","M"+wx.toFixed(1)+","+wy+" q"+(wl0/2).toFixed(1)+",-6 "+wl0.toFixed(1)+",0");
      w0.setAttribute("opacity",(.2+mix.wind/100*.5).toFixed(2));
    }else w0.setAttribute("opacity",0);
  }
  $("liq").setAttribute("y",(170-cup.level*44).toFixed(1));
  $("liq").setAttribute("height",(cup.level*44).toFixed(1));
  var st=$("steam");
  if(cup.filled){
    var anim=!reduced&&steamT<2,w=anim?Math.sin(steamT*6)*3:0,dx=mix.wind/100*18;
    $("s1").setAttribute("d",steamPath(228,dx,w));
    $("s2").setAttribute("d",steamPath(244,dx,-w));
    st.setAttribute("opacity",anim?(.7+.2*Math.sin(steamT*8)).toFixed(2):".55");
  }else st.setAttribute("opacity",0);
}
var raf=0,last=0;
function tick(now){
  raf=requestAnimationFrame(tick);
  var dt=Math.min(.05,(now-last)/1000||0);last=now;
  var i;
  for(i=0;i<NB;i++)pb[i]=(pb[i]+dt*(.5+(i%3)*.25))%1;
  for(i=0;i<ND;i++)pd[i]=(pd[i]+dt*(1+(i%4)*.15))%1;
  for(i=0;i<NW;i++)pw[i]=(pw[i]+dt*(.05+mix.wind/100*.25))%1;
  if(cup.pouring){cup.t+=dt;cup.level=Math.min(1,cup.t/.65);if(cup.t>=.65)finishPour()}
  if(cup.filled)steamT+=dt;
  draw();
}
function kick(){
  if(!raf&&!document.hidden&&!reduced){last=performance.now();raf=requestAnimationFrame(tick)}
}
function halt(){if(raf){cancelAnimationFrame(raf);raf=0}}
function finishPour(){
  cup.level=1;cup.pouring=false;cup.filled=true;steamT=reduced?2:0;
  render();draw();announce(T.cupFilled);
}
function pour(){
  if(cup.pouring)return;
  cup.filled=false;steamT=0;
  if(state==="on")pourSound();
  if(reduced||document.hidden){cup.pouring=true;finishPour();return}
  cup.level=0;cup.t=0;cup.pouring=true;
  render();draw();kick();
}
mq.addEventListener&&mq.addEventListener("change",function(e){
  reduced=e.matches;
  if(reduced){halt();if(cup.pouring)finishPour()}else kick();
  draw();
});

/* ---------- audio ---------- */
var AC=window.AudioContext||window.webkitAudioContext;
var ac=null,g=null,built=false,timer=0,nextB=0,nextT=0,tok=0;
var K={broth:.9,rain:.9,wind:.8};
function gainOf(k){return mix[k]<=0?0:K[k]*Math.pow(mix[k]/100,2)}
function setLayer(k){
  if(!g||!ac)return;
  var p=g[k].gain,t=ac.currentTime;
  p.cancelScheduledValues(t);p.setValueAtTime(p.value,t);p.linearRampToValueAtTime(gainOf(k),t+.06);
}
function ramp(p,v,d){var t=ac.currentTime;p.cancelScheduledValues(t);p.setValueAtTime(p.value,t);p.linearRampToValueAtTime(v,t+d)}
function build(){
  var n=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),a=n.getChannelData(0);
  for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;
  g={noise:n};
  g.master=ac.createGain();g.master.gain.value=0;g.master.connect(ac.destination);
  g.comp=ac.createDynamicsCompressor();g.comp.threshold.value=-24;g.comp.ratio.value=6;g.comp.connect(g.master);
  KEYS.forEach(function(k){g[k]=ac.createGain();g[k].gain.value=gainOf(k);g[k].connect(g.comp)});
  g.master.gain.value=0;
  function loop(off){var s=ac.createBufferSource();s.buffer=n;s.loop=true;s.start(0,off);return s}
  function chain(){var prev=arguments[0];for(var j=1;j<arguments.length;j++){prev.connect(arguments[j]);prev=arguments[j]}}
  function filt(type,f,Q){var x=ac.createBiquadFilter();x.type=type;x.frequency.value=f;if(Q)x.Q.value=Q;return x}
  function gn(v){var x=ac.createGain();x.gain.value=v;return x}
  chain(loop(0),filt("lowpass",320),gn(.35),g.broth);
  chain(loop(1),filt("highpass",900),filt("lowpass",7000),gn(.18),g.rain);
  var wg=gn(.5),lfo=ac.createOscillator(),ld=gn(.35);
  lfo.frequency.value=.13;lfo.connect(ld);ld.connect(wg.gain);lfo.start();
  chain(loop(2),filt("lowpass",520,.7),wg,g.wind);
  built=true;
}
var pend=[];
function track(s){pend.push(s);s.onended=function(){var i=pend.indexOf(s);if(i>=0)pend.splice(i,1)}}
function killPending(){
  pend.splice(0).forEach(function(s){s.onended=null;try{s.stop()}catch(e){}try{s.disconnect()}catch(e){}});
}
function bubble(at){
  var o=ac.createOscillator(),e=ac.createGain(),f=350+Math.random()*450;
  o.type="sine";o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(f*.45,at+.09);
  e.gain.setValueAtTime(0,at);e.gain.linearRampToValueAtTime(.2,at+.006);e.gain.exponentialRampToValueAtTime(.0001,at+.1);
  o.connect(e);e.connect(g.broth);o.start(at);o.stop(at+.12);track(o);
}
function tap(at){
  var s=ac.createBufferSource(),f=ac.createBiquadFilter(),e=ac.createGain();
  s.buffer=g.noise;f.type="bandpass";f.frequency.value=1800+Math.random()*3500;f.Q.value=2;
  e.gain.setValueAtTime(.0001,at);e.gain.linearRampToValueAtTime(.5,at+.004);e.gain.exponentialRampToValueAtTime(.0001,at+.03+Math.random()*.04);
  s.connect(f);f.connect(e);e.connect(g.rain);s.start(at,Math.random()*2);s.stop(at+.1);track(s);
}
function sched(){
  var t=ac.currentTime;
  if(nextB<t)nextB=t+.05; // no catch-up
  if(nextT<t)nextT=t+.05;
  while(nextB<t+.25){bubble(nextB);nextB+=.15+Math.random()*.7}
  while(nextT<t+.25){tap(nextT);nextT+=.04+Math.random()*.3}
}
function startSched(){stopSched();nextB=nextT=0;sched();timer=setInterval(sched,100)}
function stopSched(){if(timer){clearInterval(timer);timer=0}killPending()}
function pourSound(){
  if(!ac||!g||ac.state!=="running")return;
  var t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),e=ac.createGain();
  s.buffer=g.noise;f.type="bandpass";f.Q.value=3;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(1800,t+.65);
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.7,t+.1);e.gain.linearRampToValueAtTime(0,t+.65);
  s.connect(f);f.connect(e);e.connect(g.broth);s.start(t,Math.random()*2);s.stop(t+.7);track(s);
}
function startSound(){
  var my=++tok;state="starting";render();
  var p;
  try{
    if(!AC)throw new Error("no audio");
    if(ac&&ac.state==="closed"){ac=null;g=null;built=false}
    if(!ac){ac=new AC();built=false;g=null}
    p=ac.resume();
  }catch(e){fail(my);return}
  Promise.resolve(p).then(function(){
    if(my!==tok){if(document.hidden&&ac)ac.suspend().catch(function(){});return}
    if(ac.state!=="running")throw new Error("not running");
    if(!built)build();
    KEYS.forEach(setLayer);
    startSched();
    ramp(g.master.gain,1,.12);
    state="on";render();announce(T.soundOn);
  }).catch(function(){fail(my)});
}
function fail(my){
  if(my!==tok)return;
  if(ac&&ac.state!=="suspended"&&ac.state!=="running"){try{ac.close()}catch(e){}ac=null;g=null;built=false}
  state="error";render();announce(T.soundError);
}
function stopSound(){
  var my=++tok;state="off";render();announce(T.soundOff);
  stopSched();
  if(ac&&g){
    ramp(g.master.gain,0,.12);
    setTimeout(function(){if(my===tok&&ac)ac.suspend().catch(function(){})},170);
  }else if(ac)ac.suspend().catch(function(){});
}
$("snd").addEventListener("click",function(){
  if(state==="starting")return;
  if(state==="on")stopSound();else startSound();
});
$("pour").addEventListener("click",pour);
$("reset").addEventListener("click",function(){
  KEYS.forEach(function(k){mix[k]=DEF[k];showSlider(k);setLayer(k)});
  save();draw();announce(T.mixReset);
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    tok++;stopSched();halt();
    if(g&&ac){g.master.gain.cancelScheduledValues(0);g.master.gain.value=0}
    if(ac)ac.suspend().catch(function(){});
    if(state==="on"||state==="starting")state="paused";
    render();
  }else{
    if(cup.pouring)finishPour();
    render();draw();kick();
    if(state==="paused")announce(T.soundPaused);
  }
});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="BUTTON"))return;
  if([" ","ArrowUp","ArrowDown","PageUp","PageDown","Home","End"].indexOf(e.key)>=0)e.preventDefault();
});

render();draw();kick();
})();
</script>
</body>
</html>
