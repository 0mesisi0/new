<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>패딩 지퍼 챌린지</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14243A;color:#FFF3D6;font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
[hidden]{display:none!important}
#app{width:100vw;max-width:480px;height:100vh;height:100dvh;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
@media (max-height:520px){#app{padding:6px 10px 8px;gap:4px}}
#top{min-height:44px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative}
h1{margin:0;font-size:clamp(20px,6vw,28px);line-height:1.2;outline:none}
#hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:clamp(15px,4.5vw,19px)}
#sc{position:relative}
#pop{position:absolute;right:0;top:-4px;color:#FFC56D;font-weight:800;opacity:0;pointer-events:none}
#pop.go{animation:pop .7s ease-out}
#stage{flex:1;min-height:0;position:relative}
#meter{position:absolute;inset:0}
svg{width:100%;height:100%;display:block}
#info{text-align:center;min-height:2.6em;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:clamp(14px,4vw,17px)}
#msg{font-weight:700}
#msg.clean{color:#FFC56D}
#stats{display:flex;flex-direction:column;gap:2px}
#rScore{font-size:clamp(24px,8vw,34px);font-weight:800;line-height:1.1}
#rNew{color:#FFC56D;font-weight:800}
#bottom{display:flex;flex-direction:column;gap:6px}
button{font:700 clamp(17px,5vw,20px) system-ui,sans-serif;border-radius:16px;min-height:44px;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.big{min-height:56px;border:0;background:#FFC56D;color:#14243A}
button.sec{border:2px solid #FFF3D6;background:transparent;color:#FFF3D6}
button:focus-visible,h1:focus-visible{outline:3px solid #FFF3D6;outline-offset:3px}
#pull{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:64px}
#pull.on{background:#FFF3D6}
#copyStatus{min-height:1.2em;text-align:center;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0;padding:0;list-style:none}
.snapT,.squash{transform-box:fill-box;transform-origin:center}
.snapT{animation:snap .24s ease-out}
.squash{animation:squash .26s ease-in-out}
@keyframes snap{0%{transform:scaleX(1.6)}60%{transform:scaleX(.85)}100%{transform:scaleX(1)}}
@keyframes squash{50%{transform:scaleY(.78)}}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.snapT,.squash,#pop.go{animation:none}#pop{display:none}}
</style>
</head>
<body>
<main id="app">
  <header id="top">
    <h1 id="h" tabindex="-1"></h1>
    <div id="hud" hidden><span id="sec"></span><span id="sc"></span></div>
  </header>
  <div id="stage"><div id="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><svg id="svg" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div></div>
  <div id="info">
    <div id="msg"></div>
    <div id="bestLine" hidden></div>
    <div id="stats" hidden>
      <div id="rScore"></div><div id="rBest"></div><div id="rClean"></div><div id="rLast"></div><div id="rFin"></div><div id="rNew"></div>
    </div>
  </div>
  <div id="bottom">
    <button id="start" class="big" type="button"></button>
    <button id="pull" class="big" type="button" hidden></button>
    <div id="resBtns" hidden>
      <button id="retry" class="big" type="button"></button>
      <button id="copy" class="sec" type="button" style="margin-top:6px"></button>
      <div id="copyStatus"></div>
    </div>
  </div>
</main>
<div id="live" class="sr" aria-live="polite"></div>
<ul id="marksSr" class="sr"></ul>
<script>
(function(){
'use strict';
var D={
ko:{appTitle:'패딩 지퍼 챌린지',instruction:'꾹 당기고, 표시된 칸 안에서 손을 떼세요.',start:'시작하기',pull:'꾹 당기기',release:'칸 안에서 떼기',section:'{n}/6번째 칸',score:'점수 {score} / 600',bestScore:'최고 기록 {best} / 600',trackLabel:'{n}번째 칸 지퍼 위치',beforeBand:'표시된 칸 전',inBand:'표시된 칸 안',pastBand:'표시된 칸 지남',clean:'쫙! +{points}점',early:'조금 일찍 놓쳤어요',late:'표시된 칸을 지나쳤어요',top:'끝까지 당겼어요',canceled:'다시 꾹 눌러 당겨 보세요',cleanMark:'{n}번째 칸 성공',catchMark:'{n}번째 칸 걸림',finished:'지퍼를 다 올렸어요!',cleanCount:'깔끔하게 올린 칸 {clean}/6',newBest:'최고 기록 갱신!',retry:'다시 하기',copyScore:'기록 복사',copied:'기록을 복사했어요',copyFailed:'복사하지 못했어요. 화면을 캡처해 주세요.',shareText:'패딩 지퍼 챌린지 · {score}/600점 · 성공 {clean}/6 · {title}',title0:'지퍼와 친해지는 중',title1:'한결 부드러운 지퍼',title2:'지퍼 달인',title3:'완벽하게 쫙!'},
en:{appTitle:'Puffer Zip Challenge',instruction:'Hold to pull. Release inside the marked band.',start:'Start',pull:'Hold to pull',release:'Release in the band',section:'Section {n} of 6',score:'Score {score} / 600',bestScore:'Best {best} / 600',trackLabel:'Zipper position in section {n}',beforeBand:'Below the target band',inBand:'Inside the target band',pastBand:'Past the target band',clean:'Clean zip! +{points}',early:'Released a little early',late:'Released past the band',top:'Held all the way to the top',canceled:'Press and hold again',cleanMark:'Section {n} clean',catchMark:'Section {n} caught',finished:'All zipped up!',cleanCount:'Clean pulls {clean}/6',newBest:'New best!',retry:'Play again',copyScore:'Copy score',copied:'Score copied',copyFailed:'Couldn’t copy. Try taking a screenshot.',shareText:'Puffer Zip Challenge · {score}/600 · {clean}/6 clean pulls · {title}',title0:'Getting the Hang of It',title1:'Smooth Pulls',title2:'Zipper Pro',title3:'Perfect Zip!'}
};
var q=new URLSearchParams(location.search).get('lang');
var lang=(q==='ko'||q==='en')?q:(String(navigator.language||'').toLowerCase().indexOf('ko')===0?'ko':'en');
document.documentElement.lang=lang;
function t(k,v){var s=D[lang][k];if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]);return s}
document.title=t('appTitle');

// speed and band in hundredths; integer math keeps edges exact
var SEC=[{sp:80,lo:64,hi:92},{sp:90,lo:53,hi:79},{sp:100,lo:66,hi:88},{sp:110,lo:42,hi:62},{sp:120,lo:60,hi:78},{sp:130,lo:71,hi:87}];
var KEY='puffer-zip-challenge:best:v1';
var YB=280,SH=40,YT=YB-6*SH;
var $=function(i){return document.getElementById(i)};
var el={app:$('app'),h:$('h'),hud:$('hud'),sec:$('sec'),sc:$('sc'),pop:null,svg:$('svg'),meter:$('meter'),msg:$('msg'),bestLine:$('bestLine'),stats:$('stats'),start:$('start'),pull:$('pull'),resBtns:$('resBtns'),retry:$('retry'),copy:$('copy'),copyStatus:$('copyStatus'),live:$('live'),marksSr:$('marksSr')};
var scText=document.createElement('span'),popEl=document.createElement('span');
popEl.id='pop';el.sc.appendChild(scText);el.sc.appendChild(popEl);

var phase='start',idx=0,score=0,marks=[],pulling=null,down=null,fb=0,pullP=0,lastMsg='',lastKind='',lastPts=0;
var sessionBest=null,roundId=0,result=null,demo=false,suppressUntil=0,cat='',liveFlip=false,copyMsg='';

function readStore(){try{var s=localStorage.getItem(KEY);if(s!==null&&/^\d+$/.test(s)){var n=parseInt(s,10);if(n>=0&&n<=600)return n}}catch(e){}return null}
function writeStore(n){try{localStorage.setItem(KEY,String(n))}catch(e){}}
(function(){var s=readStore();if(s!==null)sessionBest=s})();

function announce(s){liveFlip=!liveFlip;el.live.textContent=s+(liveFlip?' ':'')}
function ts(e){var n=performance.now();return(e&&typeof e.timeStamp==='number'&&Math.abs(e.timeStamp-n)<1000)?e.timeStamp:n}
function titleFor(s){return t(s>=600?'title3':s>=420?'title2':s>=240?'title1':'title0')}

function startRound(){
  roundId++;idx=0;score=0;marks=[];pulling=null;down=null;fb=0;pullP=0;lastMsg='';lastKind='';lastPts=0;copyMsg='';result=null;demo=false;cat='';
  phase='ready';render();el.pull.focus();
}
function press(owner,tm){
  if(down!==null)return;
  down=owner;
  if(phase!=='ready')return;
  pulling={owner:owner,t0:tm};pullP=0;lastMsg='';lastKind='';cat='';
  if(document.activeElement!==el.pull)el.pull.focus();
  render();
}
function release(owner,tm){
  if(!pulling||pulling.owner!==owner){if(down===owner)down=null;return}
  down=null;
  resolve(Math.max(0,tm-pulling.t0));
}
function resolve(ms){
  var s=SEC[idx],v=ms*s.sp,kind,pts=0;
  if(v>=1e5)kind='top';
  else if(v>=s.lo*1000&&v<=s.hi*1000){
    kind='clean';
    var d=Math.abs(v/1000-(s.lo+s.hi)/2)/((s.hi-s.lo)/2);
    pts=100-Math.round(40*Math.min(1,d));
  }else kind=v<s.lo*1000?'early':'late';
  if(pulling&&pulling.owner==='c')down=null;
  pulling=null;pullP=Math.min(1,v/1e5);
  marks[idx]={kind:kind,pts:pts};score+=pts;lastKind=kind;lastPts=pts;
  lastMsg=kind==='clean'?t('clean',{points:pts}):t(kind);
  phase='feedback';fb=280;
  announce(lastMsg);render();
}
function cancel(){
  if(!pulling)return;
  pulling=null;pullP=0;cat='';suppressUntil=0;lastKind='cancel';lastMsg=t('canceled');announce(lastMsg);render();
}
function advance(){
  if(idx<5){idx++;pullP=0;phase='ready';render();return}
  finish();
}
function finish(){
  var clean=0;marks.forEach(function(m){if(m.kind==='clean')clean++});
  var stored=readStore();
  var prev=Math.max(sessionBest===null?-1:sessionBest,stored===null?-1:stored);
  var best=Math.max(prev,score);
  var nb=score>Math.max(prev,0);
  sessionBest=best;
  if(stored===null||best>stored)writeStore(best);
  result={score:score,clean:clean,best:best,newBest:nb,title:titleFor(score)};
  phase='result';render();el.h.focus();
}
function showDemo(){
  var pts=[100,0,90,100,70,100];
  marks=pts.map(function(p){return{kind:p?'clean':'early',pts:p}});
  score=460;demo=true;
  result={score:460,clean:5,best:460,newBest:false,title:titleFor(460)};
  phase='result';
}

// ---- input
function ownerOfKey(e){return 'k'+(e.key===' '?'Space':e.key)}
function isPullKey(e){return e.key===' '||e.key==='Enter'}
el.pull.addEventListener('pointerdown',function(e){
  if(!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;
  e.preventDefault();suppressUntil=0;
  var o='p'+e.pointerId;
  if(down===null){try{el.pull.setPointerCapture(e.pointerId)}catch(x){}}
  press(o,ts(e));
});
function pend(e){
  var o='p'+e.pointerId;
  if(down!==o)return;
  if(e.type==='pointerup'){e.preventDefault();suppressUntil=performance.now()+600;release(o,ts(e))}
  else{down=null;cancel()}
}
el.pull.addEventListener('pointerup',pend);
el.pull.addEventListener('pointercancel',pend);
el.pull.addEventListener('lostpointercapture',pend);
el.pull.addEventListener('keydown',function(e){
  if(!isPullKey(e)||e.ctrlKey||e.altKey||e.metaKey)return;
  e.preventDefault();
  if(e.repeat)return;
  suppressUntil=0;
  press(ownerOfKey(e),ts(e));
});
el.pull.addEventListener('keyup',function(e){
  if(!isPullKey(e))return;
  e.preventDefault();
  var o=ownerOfKey(e);
  if(down===o){suppressUntil=performance.now()+600;release(o,ts(e))}
});
el.pull.addEventListener('click',function(e){
  e.preventDefault();
  if(performance.now()<suppressUntil){suppressUntil=0;return}
  if(pulling&&pulling.owner==='c'){release('c',performance.now());return}
  if(phase==='ready'&&down===null)press('c',performance.now());
});
el.pull.addEventListener('contextmenu',function(e){e.preventDefault()});
el.pull.addEventListener('dragstart',function(e){e.preventDefault()});
el.pull.addEventListener('blur',function(){down=null;cancel()});
window.addEventListener('blur',function(){down=null;cancel()});
document.addEventListener('visibilitychange',function(){if(document.hidden){down=null;cancel()}else last=performance.now()});
el.start.addEventListener('click',startRound);
el.retry.addEventListener('click',startRound);
el.copy.addEventListener('click',function(){
  if(!result)return;
  var tok=roundId,text=t('shareText',{score:result.score,clean:result.clean,title:result.title});
  function done(ok){
    if(tok!==roundId||phase!=='result')return;
    copyMsg=t(ok?'copied':'copyFailed');el.copyStatus.textContent=copyMsg;announce(copyMsg);
  }
  function fallback(){
    if(tok!==roundId||phase!=='result')return;
    var ok=false,ta=null;
    try{
      ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);ta.select();
      ok=!!(document.execCommand&&document.execCommand('copy'));
    }catch(x){}
    finally{if(ta&&ta.parentNode)ta.parentNode.removeChild(ta)}
    el.copy.focus();done(ok);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{navigator.clipboard.writeText(text).then(function(){done(true)},fallback)}catch(x){fallback()}
  }else fallback();
});

// ---- render
function jacketSVG(){
  var prog=phase==='start'?0.45:phase==='ready'?idx+(pulling?pullP:0):phase==='feedback'?idx+1:6;
  var ys=YB-SH*prog,play=phase==='ready'||phase==='feedback'||pulling;
  var fbNow=phase==='feedback'&&marks[idx];
  var s='<defs><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFC56D" fill-opacity=".28"/><line x1="0" y1="0" x2="0" y2="6" stroke="#FFC56D" stroke-width="2.5"/></pattern></defs>';
  s+='<rect x="4" y="60" width="32" height="170" rx="16" fill="#1D645F"/><rect x="164" y="60" width="32" height="170" rx="16" fill="#1D645F"/>';
  s+='<rect x="24" y="22" width="152" height="272" rx="26" fill="#257C79"/><rect x="76" y="6" width="48" height="30" rx="12" fill="#1D645F"/>';
  for(var i=0;i<6;i++){
    var y0=YB-SH*(i+1),sq=(fbNow&&i===idx&&marks[i].kind!=='clean')?' class="squash"':'';
    s+='<g'+sq+'><rect x="34" y="'+(y0+3)+'" width="62" height="34" rx="13" fill="#2F8C89" stroke="#1D645F" stroke-width="2"/><rect x="104" y="'+(y0+3)+'" width="62" height="34" rx="13" fill="#2F8C89" stroke="#1D645F" stroke-width="2"/></g>';
    s+='<text x="50" y="'+(y0+25)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF3D6" stroke="#0E1A2B" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">'+(i+1)+'</text>';
    if((play||phase==='start')&&i===idx)s+='<rect x="30" y="'+(y0+1)+'" width="140" height="'+(SH-2)+'" rx="15" fill="none" stroke="#FFF3D6" stroke-width="2.5"/>';
  }
  if(prog<6){
    s+='<polygon points="100,'+ys+' 91,'+(YT-16)+' 109,'+(YT-16)+'" fill="#0E1A2B"/>';
    for(var y=ys-5;y>YT-14;y-=6){
      var off=1+(ys-y)/(ys-(YT-16))*8;
      s+='<rect x="'+(100-off-4)+'" y="'+y+'" width="4" height="3.5" rx="1" fill="#FFF3D6"/><rect x="'+(100+off)+'" y="'+y+'" width="4" height="3.5" rx="1" fill="#FFF3D6"/>';
    }
  }
  s+='<rect x="95" y="'+ys+'" width="10" height="'+(YB-ys+6)+'" fill="#0E1A2B"/>';
  var snap=(fbNow&&marks[idx].kind==='clean')?' class="snapT"':'';
  s+='<g'+snap+'>';
  for(var k=0,yy=ys+4;yy<YB+2;yy+=6,k++)s+='<rect x="'+(k%2?95:100.5)+'" y="'+yy+'" width="4.5" height="3.5" rx="1" fill="#FFF3D6"/>';
  s+='</g><rect x="90" y="'+(YB+4)+'" width="20" height="8" rx="3" fill="#FFF3D6"/>';
  if(phase!=='result'){
    var b=SEC[idx],yHi=YB-SH*(idx+b.hi/100),yLo=YB-SH*(idx+b.lo/100),ym=YB-SH*(idx+(b.lo+b.hi)/200);
    s+='<rect x="72" y="'+yHi+'" width="56" height="'+(yLo-yHi)+'" fill="url(#ht)" stroke="#0E1A2B" stroke-width="6"/>';
    s+='<rect x="72" y="'+yHi+'" width="56" height="'+(yLo-yHi)+'" fill="none" stroke="#FFC56D" stroke-width="2.5"/>';
    s+='<line x1="66" x2="134" y1="'+ym+'" y2="'+ym+'" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="5 3"/>';
  }
  for(var m=0;m<marks.length;m++){
    var cy=YB-SH*m-SH/2;
    if(marks[m].kind==='clean')s+='<g transform="translate(150 '+cy+')"><circle r="11" fill="#FFF3D6"/><path d="M-5 0l4 4 7-8" fill="none" stroke="#14243A" stroke-width="3"/></g>';
    else s+='<g transform="translate(150 '+cy+')"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#FFC56D" stroke="#14243A" stroke-width="2"/><path d="M-5-5L5 5M5-5L-5 5" stroke="#14243A" stroke-width="3"/></g>';
  }
  s+='<g transform="translate(100 '+ys+')"><rect x="-9" y="-11" width="18" height="14" rx="5" fill="#FFF3D6" stroke="#14243A" stroke-width="2"/><rect x="-4.5" y="2" width="9" height="20" rx="4" fill="#FFF3D6" stroke="#14243A" stroke-width="2"/><circle cy="17" r="2" fill="#14243A"/></g>';
  return s;
}
function bestShown(){return demo?460:sessionBest}
function updateMeter(){
  var inPlay=phase==='ready'||phase==='feedback';
  if(!inPlay){el.meter.setAttribute('aria-hidden','true');cat='';return}
  el.meter.removeAttribute('aria-hidden');
  el.meter.setAttribute('aria-label',t('trackLabel',{n:Math.min(idx+1,6)}));
  var b=SEC[idx],v=pullP*1e5,c=v<b.lo*1000?'beforeBand':v<=b.hi*1000?'inBand':'pastBand';
  var now=String(Math.round(pullP*100));
  if(el.meter.getAttribute('aria-valuenow')!==now)el.meter.setAttribute('aria-valuenow',now);
  if(c!==cat){cat=c;el.meter.setAttribute('aria-valuetext',t(c))}
}
function render(){
  var play=phase==='ready'||phase==='pulling'||phase==='feedback';
  el.app.dataset.phase=phase;
  el.h.hidden=play;
  el.h.textContent=phase==='result'&&result?result.title:t('appTitle');
  el.hud.hidden=!play;
  el.sec.textContent=t('section',{n:Math.min(idx+1,6)});
  scText.textContent=t('score',{score:score});
  if(phase==='feedback'&&lastKind==='clean'){popEl.textContent='+'+lastPts;popEl.className='go'}else popEl.className='';
  el.msg.hidden=phase==='result';
  el.msg.textContent=play?(lastMsg||t('instruction')):t('instruction');
  el.msg.className=lastKind==='clean'&&play?'clean':'';
  var b=bestShown();
  el.bestLine.hidden=!(phase==='start'&&b!==null);
  if(!el.bestLine.hidden)el.bestLine.textContent=t('bestScore',{best:b});
  el.stats.hidden=phase!=='result';
  if(phase==='result'&&result){
    $('rScore').textContent=t('score',{score:result.score});
    $('rBest').textContent=t('bestScore',{best:result.best});
    $('rClean').textContent=t('cleanCount',{clean:result.clean});
    $('rLast').textContent=lastMsg?t('section',{n:6})+' · '+lastMsg:'';
    $('rLast').hidden=!lastMsg;
    $('rFin').textContent=t('finished');
    $('rNew').textContent=result.newBest?t('newBest'):'';
    $('rNew').hidden=!result.newBest;
  }
  el.start.hidden=phase!=='start';el.start.textContent=t('start');
  el.pull.hidden=!play;
  el.pull.textContent=pulling?t('release'):t('pull');
  el.pull.classList.toggle('on',!!pulling);
  el.resBtns.hidden=phase!=='result';
  el.retry.textContent=t('retry');el.copy.textContent=t('copyScore');
  el.copyStatus.textContent=phase==='result'?copyMsg:'';
  el.marksSr.innerHTML=marks.map(function(m,i){return'<li>'+t(m.kind==='clean'?'cleanMark':'catchMark',{n:i+1})+(phase==='result'&&i===5&&lastMsg?' · '+lastMsg:'')+'</li>'}).join('');
  el.svg.innerHTML=jacketSVG();
  updateMeter();
}

// ---- loop
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var n=performance.now(),dt=Math.min(50,n-last);last=n;
  if(document.hidden)return;
  if(pulling){
    var ms=Math.max(0,n-pulling.t0),v=ms*SEC[idx].sp;
    if(v>=1e5){resolve(ms);return}
    pullP=v/1e5;
    el.svg.innerHTML=jacketSVG();updateMeter();
  }else if(phase==='feedback'){
    fb-=dt;if(fb<=0)advance();
  }
}
if(location.hash==='#demo')showDemo();
render();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
