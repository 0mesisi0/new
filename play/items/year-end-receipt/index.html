<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올해 결산 영수증 · Year-End Receipt</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --desk1: #211a45; --desk2: #443272; --paper: #fff5d8; --ink: #281e45;
    --red-btn: #ff977e; --mint: #8ee2ce; --gold: #ffda87;
    --line: #8776b2; --rw: 320px;
    --mono: ui-monospace, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: radial-gradient(ellipse at 50% 45%, #594484 0%, transparent 58%), linear-gradient(160deg, var(--desk1), var(--desk2));
    color: var(--paper); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(117deg, transparent 0 9px, #18112f15 9px 10px),
      repeating-linear-gradient(63deg, transparent 0 38px, #b391d31f 38px 39px);
  }
  .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus { outline: none; }
  :is(button, [tabindex]):focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 0; }
  #app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 480px; z-index: 1; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }

  .mute {
    flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #2b214e;
    font-size: 19px; line-height: 42px; text-align: center; transition: background .15s;
  }
  @media (hover: hover) { .mute:hover { background: rgba(251, 250, 245, .18); } }

  /* ---------- start ---------- */
  #sStart { overflow-y: auto; padding: 42px 16px 18px; touch-action: pan-y; }
  #sStart > .mute { position: absolute; top: 10px; right: 12px; }
  .inner { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; width: 100%; }
  .hero { width: min(100%, 420px); height: clamp(145px, calc(48dvh - 76px), 286px); flex: none; margin: -8px 0 -6px; }
  .sheep { transform-box: fill-box; transform-origin: center bottom; animation: breathe 3.4s ease-in-out infinite; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: wink 4.7s ease-in-out infinite; }
  .steam { animation: steam 3s ease-in-out infinite; }
  .feed-slip { animation: feed 3.4s ease-in-out infinite; }
  :is(.sheep, .eyes, .steam, .feed-slip) { animation-play-state: var(--idle-state, running); }
  body.paused { --idle-state: paused; }
  body.paused * { animation-play-state: paused !important; }
  @keyframes breathe { 50% { transform: translateY(-2px) scale(1.02, 1.035); } }
  @keyframes steam { 50% { opacity: .45; transform: translateY(-4px); } }
  @keyframes feed { 50% { transform: translateY(3px); } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes wink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
  .yr { font: 800 13px var(--mono); letter-spacing: .08em; color: var(--gold); }
  #sStart h1 {
    font-size: clamp(33px, 9.5vw, 53px); line-height: .99; font-weight: 950; letter-spacing: -.065em;
    max-width: 9.5em; text-wrap: balance; text-shadow: 2px 4px #251a47, 4px 6px #aa5276; word-break: keep-all;
  }
  .sub { font-size: 15px; line-height: 1.35; color: #f2e5ff; max-width: 24em; text-wrap: balance; word-break: keep-all; }
  #name {
    width: min(100%, 330px); height: 46px; flex: none; border-radius: 8px; border: 2px dashed #a79aca; background: #2b214e;
    color: var(--paper); font: inherit; font-size: 16px; font-weight: 600; text-align: center; outline: none; padding: 0 14px;
    user-select: text; -webkit-user-select: text; touch-action: manipulation;
  }
  #name::placeholder { color: rgba(251, 250, 245, .62); font-weight: 500; }
  #name:focus { border-color: rgba(251, 250, 245, .6); background: rgba(251, 250, 245, .12); }
  .primary {
    width: min(100%, 330px); min-height: 52px; border: 2px solid #241937; border-radius: 9px; background: var(--red-btn); color: var(--ink);
    font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #a64b65; transition: transform .08s, box-shadow .08s;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #a64b65; }
  .foot { font-size: 13px; color: rgba(251, 250, 245, .72); }
  .album-preview { color: var(--gold); font-size: 13px; font-weight: 800; }

  /* ---------- quiz ---------- */
  #sQuiz { overflow-y: auto; padding: 10px 16px 18px; touch-action: pan-y; }
  .top { display: flex; align-items: center; gap: 8px; min-height: 48px; flex: none; }
  .back {
    flex: none; min-width: 72px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line);
    background: transparent; font-weight: 700; font-size: 15px;
  }
  @media (hover: hover) { .back:hover { background: rgba(251, 250, 245, .08); } }
  .prog { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .prog b { font: 700 13px var(--mono); color: rgba(251, 250, 245, .75); }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 10px; height: 7px; border-radius: 2px; background: #74669e; transition: background .2s; }
  .dots i:nth-child(3n):not(:last-child) { margin-right: 4px; }
  .dots i.done { background: var(--mint); }
  .dots i.now { background: var(--gold); box-shadow: 0 0 0 2px #ffda8752; }
  .qwrap { --phase: var(--mint); margin: auto 0; padding-top: 18px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .qwrap[data-phase="1"] { --phase: var(--gold); }
  .qwrap[data-phase="2"] { --phase: var(--red-btn); }
  .card {
    position: relative; background: var(--paper); color: var(--ink); border-radius: 6px 6px 12px 12px; padding: 14px 88px 18px 15px;
    min-height: 116px; display: grid; align-content: center; box-shadow: 3px 5px 0 #231939;
  }
  .card::before {
    content: ""; position: absolute; left: 7px; right: 7px; bottom: 6px; border-bottom: 2px dotted #cbb5b6;
  }
  .prop {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%) rotate(7deg); width: 64px; height: 64px;
    border-radius: 19px 15px 16px 13px; border: 2px solid var(--ink); background: var(--phase); padding: 4px; box-shadow: 2px 2px #281e45;
    fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }
  .qn { font-size: 12px; font-weight: 850; color: #67507f; }
  #qText { font-size: clamp(20px, 5.6vw, 28px); line-height: 1.15; font-weight: 900; margin-top: 5px; letter-spacing: -.035em; text-wrap: pretty; }
  #qText:focus-visible { outline-color: #b8352e; }
  .checkpoints { display: flex; min-height: 30px; align-items: center; gap: 8px; font-size: 12px; font-weight: 750; color: var(--phase); }
  .checkpoint-marks { display: flex; gap: 3px; flex: none; }
  .checkpoint-marks i { display: grid; place-items: center; width: 22px; height: 22px; border: 1px dashed #a99acc; border-radius: 6px; color: #d1c2eb; font-style: normal; }
  .checkpoint-marks .earned { color: var(--ink); border: 1px solid var(--phase); background: var(--phase); }
  .checkpoints.hit { animation: checkpoint-pop .26s ease-out; }
  @keyframes checkpoint-pop { 45% { transform: scale(1.045, 1.16); } }
  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt {
    min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; text-align: left;
    border: 1.5px solid var(--line); border-left: 4px solid var(--phase); background: #2e2456; font-size: 16px; font-weight: 720;
    transition: background .12s, border-color .12s, transform .12s;
  }
  @media (hover: hover) { .opt:hover { background: rgba(251, 250, 245, .13); } }
  .opt:active { transform: scale(.985); }
  .opt .k { flex: none; width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; font: 800 14px var(--mono); color: var(--ink); background: var(--phase); }
  .opt .t { flex: 1; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
  .opt .m { flex: none; display: flex; gap: 2px; align-items: flex-end; height: 16px; }
  .opt .m i { display: block; width: 4px; border-radius: 2px; background: rgba(251, 250, 245, .2); }
  .opt .m i:nth-child(1) { height: 6px; } .opt .m i:nth-child(2) { height: 9px; } .opt .m i:nth-child(3) { height: 12px; } .opt .m i:nth-child(4) { height: 16px; }
  .opt .m i.on { background: var(--phase); }
  .opt.was { border-color: var(--phase); }
  .opt.picked { background: var(--phase); border-color: var(--phase); color: var(--ink); animation: pop .15s ease-out; }
  .opt.picked :is(.k, .m i.on) { background: var(--ink); color: var(--paper); }
  @keyframes pop { 0% { transform: scale(1.025, .84); } 65% { transform: scale(.985, 1.06); } 100% { transform: scale(1); } }
  .in { animation: cin .22s ease-out both; }
  .inb { animation: cinb .22s ease-out both; }
  @keyframes cin { from { opacity: 0; transform: translateX(22px); } }
  @keyframes cinb { from { opacity: 0; transform: translateX(-22px); } }

  /* ---------- print / result ---------- */
  #sPrint { padding-top: 8px; }
  .result-art { width: calc(var(--rw) + 24px); height: clamp(62px, 17dvh, 132px); flex: none; align-self: center; overflow: hidden; }
  .result-art svg { display: block; width: 100%; height: 100%; }
  .pbar {
    position: relative; z-index: 2; flex: none; margin: 0 auto; width: calc(var(--rw) + 24px); max-width: calc(100% - 8px); height: 61px;
    border: 3px solid #221834; border-radius: 13px 13px 9px 9px; background: var(--mint); display: flex; align-items: center; gap: 10px;
    padding: 0 5px 8px 13px; box-shadow: 0 5px 0 #368276, 0 10px 20px #21163499, inset 0 3px #c0f1d2;
  }
  .pbar .led { flex: none; width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 50%; background: #fff4b7; }
  .pbar .led.busy { background: #ff977e; animation: blink .5s steps(2) infinite; }
  .pbar span { flex: 1; min-width: 0; font-size: clamp(15px, 5vw, 21px); line-height: 1.05; font-weight: 950; color: var(--ink); letter-spacing: -.04em; }
  .pbar .mute { font-size: 17px; background: #b4eed9; border-color: #438479; }
  .pbar .slot { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 7px; border-radius: 4px; background: #30234f; }
  #scroller {
    position: relative; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    padding-bottom: 18px; scrollbar-width: thin; scrollbar-color: rgba(251, 250, 245, .25) transparent; cursor: grab;
  }
  #scroller.drag { cursor: grabbing; }
  #scroller:focus-visible { outline-offset: -3px; }
  #scroller::-webkit-scrollbar { width: 6px; }
  #scroller::-webkit-scrollbar-thumb { background: rgba(251, 250, 245, .25); border-radius: 3px; }
  .shade { position: sticky; top: 0; z-index: 1; height: 14px; margin: 0 auto -14px; width: calc(var(--rw) + 28px); pointer-events: none; background: linear-gradient(rgba(8, 10, 16, .55), transparent); }
  #paperwrap { margin: 0 auto; width: calc(var(--rw) + 28px); padding: 0 14px; overflow: hidden; height: 0; }
  #rc { display: block; width: var(--rw); filter: drop-shadow(0 6px 9px rgba(0, 0, 0, .38)); }
  .shake { animation: shk .12s linear; }
  .pbar.hit { animation: printer-hit .24s ease-out; transform-origin: center bottom; }
  @keyframes printer-hit { 32% { transform: scale(1.025, .89); } 68% { transform: scale(.992, 1.035); } }
  @keyframes shk { 0% { transform: translate(0, 0); } 25% { transform: translate(-4px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-3px, 1px); } 100% { transform: translate(0, 0); } }
  .album { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 5px 12px; flex-wrap: wrap; padding: 8px 16px 5px; background: #2b204d; border-top: 1px dashed #a387b5; }
  .album[hidden] { display: none; }
  .album span { color: var(--gold); font-weight: 850; font-size: 13px; }
  .medals { display: flex; gap: 4px; }
  .medals b { display: grid; place-items: center; min-width: 23px; height: 25px; color: #c4abd9; border: 1px dashed #9481b6; border-radius: 5px; font-size: 15px; }
  .medals .unlocked { border: 1px solid #c19775; background: #52366a; }
  .medals .latest { border-color: var(--gold); background: var(--gold); animation: checkpoint-pop .26s ease-out; }
  .bar { flex: none; display: flex; gap: 8px; padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); background: #2b204d; }
  .bar button { flex: 1; min-width: 0; min-height: 50px; border-radius: 8px; border: 0; font-weight: 850; font-size: 15px; line-height: 1.15; padding: 6px; word-break: keep-all; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .bar button:disabled { opacity: .3; cursor: default; }
  #bSave { background: var(--red-btn); color: var(--ink); box-shadow: 0 4px 0 #a64b65; }
  #bCopy { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 #c4bfb0; }
  #bAgain { background: rgba(251, 250, 245, .06); border: 1.5px solid var(--line); }
  #bSave:not(:disabled):active, #bCopy:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .2); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; touch-action: none; z-index: 5; }
  #name:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  #toast {
    position: fixed; left: 50%; bottom: 92px; z-index: 10; transform: translate(-50%, 12px); max-width: calc(100% - 32px);
    background: var(--ink); color: var(--paper); border: 1px solid rgba(255, 255, 255, .16); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 800; text-align: center; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { background: #a43143; }

  @media (max-height: 600px) {
    #sStart { padding-top: 28px; }
    .inner { gap: 8px; }
    .qwrap { padding-top: 6px; gap: 7px; }
    .card { min-height: 94px; padding-top: 10px; padding-bottom: 13px; }
  }
  @media (max-width: 340px) {
    .bar { padding-left: 12px; padding-right: 12px; gap: 6px; }
    .bar button { font-size: 14px; }
    .opt { font-size: 15px; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<canvas id="snow" aria-hidden="true"></canvas>
<div id="app">
  <section id="sStart" class="screen">
    <button class="mute" type="button"></button>
    <div class="inner">
      <div class="yr" id="yr"></div>
      <h1 id="tTitle"></h1>
      <svg class="hero" viewBox="0 0 420 286" aria-hidden="true"><use href="#kiosk"/></svg>
      <p class="sub" id="tSub"></p>
      <input id="name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button id="bStart" class="primary" type="button"></button>
      <p class="foot" id="tFoot"></p>
      <p class="album-preview" id="albumPreview" hidden></p>
    </div>
  </section>

  <section id="sQuiz" class="screen" hidden>
    <div class="top">
      <button id="bBack" class="back" type="button"></button>
      <div class="prog" aria-hidden="true"><b id="pNum"></b><div class="dots" id="dots"></div></div>
      <button class="mute" type="button"></button>
    </div>

    const fr = rnd();
    const bars = []; for (let i = 0; i < 40; i++) bars.push(1 + Math.floor(rnd() * 3));
    const no = String(Math.floor(rnd() * 100000)).padStart(5, '0');
    const qtys = DATA.map((d, i) => Math.round(d.Q[answers[i]] * jit[i]));
    const tt = totals(qtys);
    const f = Math.min(1, Math.max(0, (tt.total - MIN) / (MAX - MIN)));
    const tier = answers.every((a) => a === 0) ? T.titles.length : TIERS.findIndex((lim) => f < lim);
    const [title, emoji] = stampTitles[tier];

      subtotal: tt.subtotal, discount: tt.discount, tax: tt.tax, total: tt.total,
      tier, title, emoji,
      fHead: T.forecastHead(NEXT, BRANCH), sentence: pool[Math.min(pool.length - 1, Math.floor(fr * pool.length))].replace('{next}', String(NEXT)),
      date: `${d.getFullYear()}.${p2(d.getMonth() + 1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`,

  }
  const num = (n) => Math.round(n).toLocaleString('en-US');
  const won = (n) => (n < 0 ? '−' : '') + '₩' + num(Math.abs(n));
  const lineDetails = (it, i) => `${num(it.qty)}${T.qs[i].unit} × ${i === 8 ? '−' : ''}${num(it.price)}`;

  function wrapText(ctx, s, maxW, font, byChar) {
    ctx.font = font;
    // Korean wraps by character, but digit/Latin runs stay whole and punctuation sticks to the char before it.
    const tokens = byChar ? (s.match(/[A-Za-z0-9]+[.,!?…]*|\s+|.[.,!?…]*/gu) || []) : s.split(/(\s+)/);

  // Same line count as a greedy wrap, but with lines of even length (no one-word orphans).
  function balanced(ctx, s, maxW, font, byChar) {
    const base = wrapText(ctx, s, maxW, font, byChar);

  // Build the receipt as a list of draw ops in logical px (360 wide).
  function layout(R, mctx) {
    const W = RW, P = 24, IW = W - 2 * P;
    const ops = [], steps = [];
    const text = (s, x, y, font, color, align = 'left', maxWidth) => ops.push({ k: 't', s, x, y, font, color, align, maxWidth });
    const lr = (l, r, y, lf, rf, color) => {
      mctx.font = rf;
      text(l, P, y, lf, color, 'left', IW - mctx.measureText(r).width - 12);
      text(r, W - P, y, rf, color, 'right');
    };
    const dash = (y, solid) => ops.push({ k: 'd', y, solid });
    let y = 20;
    text('✦', W / 2, y + 15, `900 24px ${SANS}`, RED_INK, 'center');
    y += 42; text(T.shopName, W / 2, y, `900 20px ${SANS}`, INK, 'center');
    y += 21; text(T.receiptOf.replace('{y}', R.year), W / 2, y, `500 13px ${SANS}`, GRAY, 'center');
    y += 15; dash(y);
    steps.push(y + 4);
    y += 23; lr(`${T.customer}  ${R.name}`, `No.${R.no}`, y, `600 13px ${SANS}`, `600 13px ${MONO}`, INK);
    y += 19; text(R.date, P, y, `12px ${MONO}`, GRAY);
    y += 14; dash(y);
    y += 20; lr(T.colItem, T.colAmount, y, `800 13px ${SANS}`, `800 13px ${SANS}`, INK);
    y += 10; dash(y);
    steps.push(y + 4);
    R.lines.forEach((it, i) => {
      const disc = i === 8, col = disc ? RED_INK : INK, q = T.qs[i];
      y += 25; lr(q.label, (disc ? '−' : '') + num(it.amount), y, `650 15px ${SANS}`, `600 15px ${MONO}`, col);
      y += 17; text(lineDetails(it, i), P, y, `13px ${SANS}`, disc ? RED_INK : GRAY);
      steps.push(y + 6);
    });
    y += 14; dash(y);
    const summaryY = y;
    y += 23; lr(T.subtotal, won(R.subtotal), y, `14px ${SANS}`, `14px ${MONO}`, INK);
    y += 21; lr(T.discount, won(-R.discount), y, `14px ${SANS}`, `14px ${MONO}`, RED_INK);
    y += 21; lr(T.tax, won(R.tax), y, `14px ${SANS}`, `14px ${MONO}`, INK);
    y += 13; dash(y, true);
    steps.push(y + 5);
    // grand total, 24px bold, label shrinks only if it would collide
    y += 36;
    ops.push({ k: 'total', y: y - 29, h: 43 });
    const amt = '₩' + num(R.total);
    mctx.font = `800 24px ${MONO}`; const aw = mctx.measureText(amt).width;
    let lsz = 24; mctx.font = `900 ${lsz}px ${SANS}`;
    while (lsz > 16 && mctx.measureText(T.total).width + aw + 12 > IW) { lsz -= 1; mctx.font = `900 ${lsz}px ${SANS}`; }
    lr(T.total, amt, y, `900 ${lsz}px ${SANS}`, `800 24px ${MONO}`, INK);
    const totalY = y;
    y += 14;
    steps.push(y);
    // stamp
    const sFont = `900 18px ${SANS}`;
    const sLines = balanced(mctx, R.title, 214, sFont, false);
    mctx.font = sFont;
    const sw = Math.max(156, Math.max(...sLines.map((l) => mctx.measureText(l).width)) + 50);
    const sh = 24 + 32 + 8 + sLines.length * 22 + 14;
    const ang = 8 * Math.PI / 180;
    const sbox = sw * Math.sin(ang) + sh * Math.cos(ang);
    const stamp = { cx: W / 2, cy: y + 10 + sbox / 2, w: sw, h: sh, lines: sLines, font: sFont, emoji: R.emoji, box: sbox };
    ops.push({ k: 's', y: y, st: stamp });
    y += sbox + 26;
    // forecast box
    const fFont = `14px ${SANS}`;
    const fl = balanced(mctx, R.sentence, IW - 32, fFont, LANG === 'ko');
    const hFont = `800 14px ${SANS}`;
    const bh = 18 + 16 + 10 + fl.length * 21 + 8;
    ops.push({ k: 'b', y, h: bh });
    text(R.fHead, W / 2, y + 18 + 13, hFont, INK, 'center');
    fl.forEach((ln, i) => text(ln, W / 2, y + 18 + 16 + 10 + 13 + i * 21, fFont, INK, 'center'));
    y += bh;
    steps.push(y + 8);
    // footer: barcode and notes
    y += 24;
    const gap = 2, bw = R.bars.reduce((a, b) => a + b, 0) + gap * (R.bars.length - 1);
    ops.push({ k: 'c', y, h: 40, x: (W - bw) / 2, bars: R.bars, gap });
    y += 40 + 15; text(`* ${R.year} ${R.no} *`, W / 2, y, `600 11px ${MONO}`, GRAY, 'center');
    y += 25; text(T.note1, W / 2, y, `11.5px ${SANS}`, GRAY, 'center');
    y += 17; text(T.note2, W / 2, y, `11.5px ${SANS}`, GRAY, 'center');
    y += 27; text(T.thanks, W / 2, y, `800 13px ${SANS}`, INK, 'center');
    y += 19; text('play.mesisi.net', W / 2, y, `12px ${MONO}`, GRAY, 'center');
    y += 28;
    steps.push(y);
    return { ops, steps, H: y, summaryY, totalY, stamp };
  }

  // ---------- drawing ----------
  const TW = 12, TH = 5; // zig-zag tooth width / height
  function paperPath(ctx, W, H, cut) {

  // ---------- state ----------
  let state = 'start', qi = 0, answers = [], lockUntil = 0, advTimer = 0;
  let R = null, L = null, reveal = 0, stampP = null, printT = 0, stepIdx = -1, stampAnim = null;
  let k = 1, dpr = 1;

  nameIn.value = DEMO ? '' : store.get('name', '');

  function show(el) {

  }
  function showStart(focus = true) {
    state = 'start'; clearTimeout(advTimer); stampAnim = null;

    show(sStart);
    if (focus) $('bStart').focus({ preventScroll: true });
  }
  function start() {
    if (state !== 'start') return;
    const nm = limitName(nameIn.value.trim());
    nameIn.value = nm;
    store.set('name', nm);
    state = 'quiz'; qi = 0; answers = []; lockUntil = 0;
    show(sQuiz);
    renderQuestion(1);
  }
  function restart(e) {
    if (state !== 'result') return;
    if (e && e.preventDefault) e.preventDefault();
    answers = []; R = null; L = null; stampP = null; stampAnim = null;
    if (bits.length) { bits.length = 0; stepFx(0); }
    showStart();
  }

  function renderCheckpoints(done) {
    const n = Math.floor(done / 3);
    const marks = `<span class="checkpoint-marks" aria-hidden="true">${[1, 2, 3].map((i) => i <= n ? '<i class="earned">✦</i>' : '<i>·</i>').join('')}</span>`;
    checkpoints.innerHTML = `${marks}<span>${T.checkpoints(n)}</span>`;
  }
  function renderQuestion(dir) {
    const q = T.qs[qi];
    if (document.activeElement === qText) qText.blur(); // Announce the new question when a number shortcut advanced it.
    $('pNum').textContent = `${qi + 1}/${DATA.length}`;
    $('qn').textContent = T.questionNumber(qi + 1, DATA.length);
    qText.textContent = q.q;
    propArt.setAttribute('d', PROPS[qi]);
    qwrap.dataset.phase = Math.floor(qi / 3);
    renderCheckpoints(qi);
    optBtns.forEach((b, i) => {
      b.querySelector('.t').textContent = q.o[i];
      b.classList.remove('picked');
      b.classList.toggle('was', answers[qi] === i);
    });

  function pick(i) {

    optBtns[i].classList.add('picked');
    const done = qi + 1;
    const checkpoint = done % 3 === 0;
    if (checkpoint) renderCheckpoints(done);
    if (!REDUCED) {
      const chosen = optBtns[i].querySelector('.m').getBoundingClientRect();
      if (checkpoint) {
        const mark = checkpoints.querySelector(`.earned:nth-child(${done / 3})`);
        const r = mark.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, 15, .44);
        checkpoints.classList.remove('hit'); void checkpoints.offsetWidth; checkpoints.classList.add('hit');

  // ---------- print ----------
  function sizeCanvas() {
    const colW = app.clientWidth || innerWidth;
    const rw = Math.max(1, Math.floor(Math.min(420, colW - 28)));
    app.style.setProperty('--rw', rw + 'px');
    k = rw / RW;
    dpr = Math.min(2, window.devicePixelRatio || 1);

    scroller.tabIndex = -1;

  function updatePrint(dt) {

  // ---------- export / copy ----------
  function renderReceiptText() {
    const add = (tag, value, parent = receiptText) => {
      const el = document.createElement(tag);
      el.textContent = value;
      parent.appendChild(el);
      return el;
    };

    add('h2', T.receiptOf.replace('{y}', R.year));
    add('p', `${T.customer}: ${R.name}. No. ${R.no}. ${R.date}`);
    const lines = add('ul', '');
    R.lines.forEach((it, i) => add('li', `${T.qs[i].label}: ${lineDetails(it, i)} = ${won(i === 8 ? -it.amount : it.amount)}`, lines));
    for (const [label, value] of [[T.subtotal, R.subtotal], [T.discount, -R.discount], [T.tax, R.tax], [T.total, R.total]]) {

  function shareText() {
    if (!R) return '';

      T.shareHead(R.name, R.year, R.guest),
      `${T.total} ${won(R.total)}`,
      `${T.titleLabel}: ${R.emoji} ${R.title}`,

  function saveImage() {
    if (state !== 'result' || !L) return;
    try {
      const w = 750, pad = 40, sc = (w - pad * 2) / RW;
      const h = Math.round(L.H * sc) + pad * 2;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const c = cv.getContext('2d');
      c.fillStyle = '#1d2433'; c.fillRect(0, 0, w, h);
      c.save(); c.translate(pad, pad); c.scale(sc, sc);
      c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 24; c.shadowOffsetY = 10;
      paperPath(c, RW, L.H, L.H); c.fillStyle = PAPER; c.fill(); c.restore();
      drawReceipt(c, L, L.H, 1);
      c.restore();
      c.font = `12px ${SANS}`; c.fillStyle = GRAY; c.textAlign = 'right'; c.textBaseline = 'alphabetic';
      c.fillText('play.mesisi.net', w - pad, h - 14);
      cv.toBlob((blob) => {
        if (!blob) { toast(T.saveFail, true); return; }
        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'year-end-receipt.png'; a.style.display = 'none';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast(T.saved);
        } catch (e) { toast(T.saveFail, true); }
      }, 'image/png');
    } catch (e) { toast(T.saveFail, true); }
  }
  function copyText() {
    if (state !== 'result' || !R) return;
    const text = shareText();
    const fallback = () => {
      let ok = false;
      const focus = document.activeElement;
      const ta = document.createElement('textarea');
      try {
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;user-select:text;-webkit-user-select:text';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
      } catch (e) { ok = false; }
      finally {
        if (document.activeElement === ta) focus?.focus({ preventScroll: true });
        ta.remove();
      }
      toast(ok ? T.copied : T.copyFail, !ok);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(T.copied), fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  // ---------- snow ----------
  const snowCv = $('snow'), sctx = snowCv.getContext('2d');
  let sw = 0, sh = 0, sdpr = 1, snowT = 0;
  const flakes = [];
  function sizeSnow() {
    sdpr = Math.min(2, window.devicePixelRatio || 1);
    sw = innerWidth; sh = innerHeight;
    snowCv.width = fxCv.width = Math.round(sw * sdpr); snowCv.height = fxCv.height = Math.round(sh * sdpr);
  }
  const fxCv = $('fx'), fctx = fxCv.getContext('2d'), bits = [];
  const CONFETTI = ['#ff977e', '#ffda87', '#fff5d8', '#8ee2ce', '#d5b8ff'];
  function burst(x, y, count, strength) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * 6.2832, v = (130 + Math.random() * 310) * strength;
      bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150 * strength, w: 4 + Math.random() * 4, h: 3 + Math.random() * 3,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14, c: CONFETTI[i % CONFETTI.length], life: (0.65 + Math.random() * 0.55) * Math.sqrt(strength) });
    }
    requestFrame();
  }
  function stepFx(dt) {
    fctx.setTransform(sdpr, 0, 0, sdpr, 0, 0);
    fctx.clearRect(0, 0, sw, sh);
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      b.vy += 620 * dt; b.vx *= 1 - 1.6 * dt; b.vy *= 1 - 0.8 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      fctx.save(); fctx.globalAlpha = Math.min(1, b.life / 0.35); fctx.fillStyle = b.c;
      fctx.translate(b.x, b.y); fctx.rotate(b.rot); fctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); fctx.restore();
    }
  }
  function seedFlakes() {
    const n = REDUCED ? 20 : 60;
    for (let i = 0; i < n; i++) {
      flakes.push({
        x: Math.random(), y: Math.random() * sh, r: 0.8 + Math.random() * 2.4,
        vy: REDUCED ? 6 + Math.random() * 8 : 16 + Math.random() * 34,
        amp: 6 + Math.random() * 18, ph: Math.random() * 6.28, fq: 0.3 + Math.random() * 0.9,
      });
    }
  }
  function stepSnow(dt) {
    snowT += dt;
    sctx.setTransform(sdpr, 0, 0, sdpr, 0, 0);
    sctx.clearRect(0, 0, sw, sh);
    sctx.fillStyle = 'rgba(255,255,255,.7)';
    sctx.beginPath();
    for (const f of flakes) {
      f.y += f.vy * dt * (0.6 + f.r / 4);
      if (f.y > sh + 6) { f.y = -6; f.x = Math.random(); }
      const x = f.x * sw + Math.sin(f.ph + snowT * f.fq) * f.amp;
      sctx.moveTo(x + f.r, f.y); sctx.arc(x, f.y, f.r, 0, 6.2832);
    }
    sctx.fill();
  }

  // ---------- input ----------
  $('bStart').addEventListener('click', start);
  $('bBack').addEventListener('click', back);
  bSave.addEventListener('click', saveImage);
  bCopy.addEventListener('click', copyText);
  bAgain.addEventListener('click', restart);

  let drag = null;
  scroller.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { y: e.clientY, top: scroller.scrollTop };
    try { scroller.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    scroller.classList.add('drag');
  });
  scroller.addEventListener('pointermove', (e) => { if (drag && state === 'result') scroller.scrollTop = drag.top - (e.clientY - drag.y); });
  const endDrag = () => { drag = null; scroller.classList.remove('drag'); };
  scroller.addEventListener('pointerup', endDrag);
  scroller.addEventListener('pointercancel', endDrag);
  scroller.addEventListener('lostpointercapture', endDrag);

  addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const tag = (e.target && e.target.tagName) || '';
    const key = e.key, code = e.code || '';
    const mod = e.ctrlKey || e.metaKey || e.altKey;
    if (mod) return;
    if (e.repeat && (/^[1-4]$/.test(key) || key === 'Enter' || ['KeyM', 'KeyS', 'KeyC', 'KeyR'].includes(code))) {
      e.preventDefault();
      return;
    }
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      if (key === 'Enter' && state === 'start') { e.preventDefault(); start(); }
      return;
    }
    const onBtn = tag === 'BUTTON';
    const inApp = app.contains(e.target);
    if (code === 'KeyM' && inApp) { e.preventDefault(); toggleSound(e); return; }
    if (state === 'start') {
      if ((key === 'Enter' || key === ' ') && !onBtn) { e.preventDefault(); if (key === 'Enter') start(); }
    } else if (state === 'quiz') {
      if (/^[1-4]$/.test(key) && inApp) { e.preventDefault(); pick(+key - 1); }
      else if (key === 'Backspace' || key === 'ArrowLeft') { e.preventDefault(); back(); }
      else if (key === 'ArrowDown' || key === 'ArrowUp') { e.preventDefault(); moveFocus(key === 'ArrowDown' ? 1 : -1); }
      else if ((key === 'Enter' || key === ' ') && !onBtn) e.preventDefault();
    } else if (state === 'result') {
      const page = scroller.clientHeight * 0.85;
      const by = { ArrowDown: 60, ArrowUp: -60, PageDown: page, PageUp: -page, Home: -1e6, End: 1e6 }[key];
      if (by) { e.preventDefault(); scroller.scrollTop += by; }
      else if (code === 'KeyS' && inApp) { e.preventDefault(); saveImage(); }
      else if (code === 'KeyC' && inApp) { e.preventDefault(); copyText(); }
      else if ((code === 'KeyR' && inApp) || (key === 'Enter' && !onBtn)) restart(e);
      else if (key === ' ' && !onBtn) e.preventDefault();
    } else if (key.startsWith('Arrow') || key === ' ' || key.startsWith('Page')) e.preventDefault();
  });

  addEventListener('resize', () => {
    sizeSnow();
    stepSnow(0);
    if (L && (state === 'print' || state === 'result')) { sizeCanvas(); paint(); }
  });

  // ---------- loop ----------
  let last = 0, frameId = 0;
  function requestFrame() {
    if (frameId || document.hidden) return;
    frameId = requestAnimationFrame(frame);
  }
  function frame(ts) {
    frameId = 0;
    const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 0;
    last = ts;
    stepSnow(dt);
    if (bits.length) stepFx(dt);
    if (state === 'print') updatePrint(dt);
    else if (stampAnim) updateStamp(dt);
    requestFrame();
    if (!frameId) last = 0;
  }
  document.addEventListener('visibilitychange', () => {
    last = 0;
    document.body.classList.toggle('paused', document.hidden);
    if (document.hidden) { cancelAnimationFrame(frameId); frameId = 0; }
    else requestFrame();
  });

  sizeSnow(); seedFlakes(); stepSnow(0);
  sizeCanvas();
  if (DEMO) {
    state = 'quiz'; answers = DEMO_ANSWERS.slice();
    startPrint(true);
  } else showStart(false);
  requestFrame();
})();
</script>
</body>
