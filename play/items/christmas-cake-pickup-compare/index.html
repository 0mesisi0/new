<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크리스마스 케이크 예약 비교</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF7E8;color:#17362E;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
#sheet{height:100vh;height:100dvh;width:100%;max-width:560px;margin:0 auto;overflow-y:auto;overflow-x:hidden;padding:12px 14px 20px}
header{display:flex;align-items:center;gap:10px}
.deco{font-size:34px;line-height:1}
h1{font-size:20px;margin:0;line-height:1.2}
h2{font-size:15px;margin:10px 0 2px;color:#1F654A}
h2:focus{outline:3px solid #1F654A;outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{font-size:13px;margin:2px 0 8px;opacity:.8}
.grid{display:grid;grid-template-columns:minmax(64px,.9fr) 1fr 1fr;gap:6px 8px;align-items:start;margin-top:6px}
.shared{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.rowlabel{font-size:13px;font-weight:600;padding-top:12px;line-height:1.2}
.colhead{font-weight:700;font-size:14px;text-align:center;padding:4px 0;border-bottom:2px solid #1F654A}
label.l{font-size:13px;font-weight:600}
input{width:100%;min-height:44px;font:inherit;font-size:16px;padding:6px 8px;border:2px solid #6B7D76;border-radius:8px;background:#fff;color:#17362E}
input:focus-visible,button:focus-visible{outline:3px solid #1F654A;outline-offset:2px}
input[aria-invalid=true]{border-color:#A33346;background:#fff1f2}
.err{font-size:12px;color:#A33346;min-height:0;line-height:1.25}
.err:empty{display:none}
button{min-height:44px;padding:8px 14px;font:inherit;font-weight:700;border-radius:10px;border:2px solid #1F654A;background:#1F654A;color:#fff;cursor:pointer;margin-top:10px}
button:active{transform:scale(.97)}
#result{margin-top:12px}
#headline{font-weight:700;font-size:16px;padding:10px;border-radius:10px;background:#fff;border:2px solid #17362E22}
#headline.good{border-color:#1F654A;color:#1F654A}
#headline.bad{border-color:#A33346;color:#A33346}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card{padding:8px;border-radius:10px;background:#fff;border:2px solid #17362E22;font-size:14px;min-height:60px}
.card b{display:block;margin-bottom:2px}
.card.win{border-color:#1F654A;outline:2px solid #1F654A33}
.card.win.pulse{animation:fade .9s ease-out}
.card .ok{color:#1F654A;font-weight:700}
.card .no{color:#A33346}
@keyframes fade{from{outline:5px solid #1F654A}to{outline:2px solid #1F654A33}}
@media (prefers-reduced-motion:reduce){.card.win.pulse{animation:none}button:active{transform:none}}
@media (max-height:560px){.deco{display:none}}
@media (max-width:360px){.rowlabel{font-size:12px}h1{font-size:18px}}
</style>
</head>
<body>
<main id="sheet">
  <header><span class="deco" aria-hidden="true">🎂</span><h1 id="title"></h1></header>
  <h2 id="modeHead" tabindex="-1"></h2>
  <p class="note" id="sameDay"></p>
  <div class="shared">
    <div class="cell"><label class="l" id="gl" for="guests"></label><input id="guests" inputmode="numeric" autocomplete="off"><div class="err" id="e-guests"></div></div>
    <div class="cell"><label class="l" id="dl" for="deadline"></label><input id="deadline" inputmode="numeric" autocomplete="off"><div class="err" id="e-deadline"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <button id="modeBtn" type="button"></button>
  <section id="result">
    <div class="sr" id="status" aria-live="polite"></div>
    <div id="headline"></div>
    <div class="cards"><div class="card" id="card-a"></div><div class="card" id="card-b"></div></div>
  </section>
</main>
<script>
(function(){
var T={
ko:{title:'크리스마스 케이크 예약 비교',example:'예시 비교',enterOptions:'내 후보 입력',showExample:'예시 보기',sameDay:'두 후보의 픽업 시간은 같은 날 기준이에요.',guests:'모임 인원',deadline:'픽업 마감',cakeA:'케이크 A',cakeB:'케이크 B',price:'결제 금액 (원)',servings:'표시 인분',pickup:'픽업 가능 시각',cakeFieldLabel:'{cake} {field}',timePlaceholder:'HH:MM',missing:'빈칸을 채우면 두 후보를 비교할 수 있어요.',invalidSummary:'표시된 입력값을 확인해 주세요.',invalidQuantity:'1~99 사이의 정수를 입력해 주세요.',invalidPrice:'0~9,999,999원 사이의 정수를 입력해 주세요.',invalidTime:'00:00~23:59 사이의 시간을 입력해 주세요.',onlyFit:'{cake}만 조건에 맞아요.',lowerPrice:'둘 다 가능해요. {cake}가 {amount}원 더 저렴해요.',tie:'두 후보 모두 조건에 맞고 가격도 같아요.',noneFit:'두 후보 모두 인원이나 픽업 조건을 충족하지 못해요.',fits:'조건 충족',late:'마감보다 {minutes}분 늦어요.',shortOne:'1인분 부족해요.',shortMany:'{servings}인분 부족해요.'},
en:{title:'Christmas Cake Pickup Compare',example:'Example comparison',enterOptions:'Enter my options',showExample:'Show example',sameDay:'Use pickup times from the same day.',guests:'Guests',deadline:'Pickup deadline',cakeA:'Cake A',cakeB:'Cake B',price:'Total price (KRW)',servings:'Listed servings',pickup:'Earliest pickup',cakeFieldLabel:'{field} for {cake}',timePlaceholder:'HH:MM',missing:'Fill in the remaining fields to compare both cakes.',invalidSummary:'Check the highlighted fields.',invalidQuantity:'Enter a whole number from 1 to 99.',invalidPrice:'Enter a whole amount from ₩0 to ₩9,999,999.',invalidTime:'Enter a time from 00:00 to 23:59.',onlyFit:'Only {cake} fits.',lowerPrice:'Both fit. {cake} costs ₩{amount} less.',tie:'Both fit and cost the same.',noneFit:'Neither cake fits the guest count and pickup deadline.',fits:'Fits',late:'Pickup is {minutes} min late.',shortOne:'Short by 1 serving.',shortMany:'Short by {servings} servings.'}
};
var q=new URLSearchParams(location.search).get('lang');
var lang=(q==='ko'||q==='en')?q:((navigator.language||'').toLowerCase().indexOf('ko')===0?'ko':'en');
var S=T[lang];
document.documentElement.lang=lang;
document.title=S.title;
function f(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}
function $(id){return document.getElementById(id)}
function num(n){return n.toLocaleString(lang)}

var KEY='christmas-cake-pickup-compare:v1:guests';
var EXAMPLE={guests:'6',deadline:'18:00',a_price:'38,000',a_serv:'6',a_pick:'18:30',b_price:'42,000',b_serv:'8',b_pick:'17:30'};
var FIELDS=['guests','deadline','a_price','a_serv','a_pick','b_price','b_serv','b_pick'];
var KIND={guests:'q',deadline:'t',a_price:'p',a_serv:'q',a_pick:'t',b_price:'p',b_serv:'q',b_pick:'t'};
var mode='example',flagged={},lastWin='';

// build grid
$('title').textContent=S.title;
$('sameDay').textContent=S.sameDay;
$('gl').textContent=S.guests;$('dl').textContent=S.deadline;
var g=$('grid'),h='<div></div><div class="colhead" id="ha"></div><div class="colhead" id="hb"></div>';
[['price','price'],['serv','servings'],['pick','pickup']].forEach(function(r){
  h+='<div class="rowlabel">'+S[r[1]]+'</div>';
  ['a','b'].forEach(function(c){var id=c+'_'+r[0];h+='<div class="cell"><input id="'+id+'" inputmode="numeric" autocomplete="off"'+(r[0]==='pick'?' placeholder="'+S.timePlaceholder+'"':'')+'><div class="err" id="e-'+id+'"></div></div>'});
});
g.innerHTML=h;
$('ha').textContent=S.cakeA;$('hb').textContent=S.cakeB;
$('deadline').placeholder=S.timePlaceholder;
[['price','price'],['serv','servings'],['pick','pickup']].forEach(function(r){
  [['a',S.cakeA],['b',S.cakeB]].forEach(function(c){$(c[0]+'_'+r[0]).setAttribute('aria-label',f(S.cakeFieldLabel,{cake:c[1],field:S[r[1]]}))});
});

function norm(v){return v.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).replace(/[：]/g,':').replace(/[，]/g,',').trim()}
// returns {ok,val}|null(empty)
function parse(id){
  var raw=norm($(id).value);if(raw==='')return null;
  var k=KIND[id],m,n;
  if(k==='q'){if(!/^\d+$/.test(raw))return{ok:false};n=+raw;return(n>=1&&n<=99)?{ok:true,val:n}:{ok:false}}
  if(k==='p'){if(!(/^\d+$/.test(raw)||/^\d{1,3}(,\d{3})+$/.test(raw)))return{ok:false};n=+raw.replace(/,/g,'');return(n<=9999999)?{ok:true,val:n}:{ok:false}}
  var hh,mm;
  if(m=/^(\d{1,2}):(\d{2})$/.exec(raw)){hh=+m[1];mm=+m[2]}
  else if(m=/^(\d{1,2})(\d{2})$/.exec(raw)){hh=+m[1];mm=+m[2]}
  else return{ok:false};
  return(hh<=23&&mm<=59)?{ok:true,val:hh*60+mm}:{ok:false};
}
function errMsg(id){var k=KIND[id];return k==='q'?S.invalidQuantity:k==='p'?S.invalidPrice:S.invalidTime}
function pad(n){return(n<10?'0':'')+n}
function format(id){
  var p=parse(id);if(!p||!p.ok)return;var k=KIND[id];
  $(id).value=k==='t'?pad(Math.floor(p.val/60))+':'+pad(p.val%60):k==='p'?p.val.toLocaleString('en-US'):String(p.val);
}
function commit(id){
  flagged[id]=true;format(id);
  if(mode==='personal'&&id==='guests'){var p=parse('guests');if(p&&p.ok){try{localStorage.setItem(KEY,String(p.val))}catch(e){}}}
  render(true);
}

function render(announce){
  var P={},anyFlagInvalid=false,anyEmpty=false;
  FIELDS.forEach(function(id){
    var p=parse(id);P[id]=p;
    var bad=p&&!p.ok&&flagged[id];
    $(id).setAttribute('aria-invalid',bad?'true':'false');
    $('e-'+id).textContent=bad?errMsg(id):'';
    if(bad)$(id).setAttribute('aria-describedby','e-'+id);else $(id).removeAttribute('aria-describedby');
    if(bad)anyFlagInvalid=true;
    if(!p)anyEmpty=true;
  });
  var shared=P.guests&&P.guests.ok&&P.deadline&&P.deadline.ok;
  var cake={},say=[];
  ['a','b'].forEach(function(c){
    var ps=[P[c+'_price'],P[c+'_serv'],P[c+'_pick']];
    var el=$('card-'+c);
    var name=c==='a'?S.cakeA:S.cakeB;
    say.push(name);
    if(!shared||!ps.every(function(p){return p&&p.ok})){cake[c]=null;el.innerHTML='<b>'+name+'</b>';return}
    var late=ps[2].val-P.deadline.val;
    var short=P.guests.val-ps[1].val;
    var fit=late<=0&&short<=0;
    var lines=[];
    if(fit)lines.push('<span class="ok">'+S.fits+'</span>');
    else{
      if(late>0)lines.push('<span class="no">'+f(S.late,{minutes:num(late)})+'</span>');
      if(short>0)lines.push('<span class="no">'+(short===1?S.shortOne:f(S.shortMany,{servings:num(short)}))+'</span>');
    }
    cake[c]={fit:fit,price:ps[0].val};
    el.innerHTML='<b>'+name+'</b>'+lines.join('<br>');
    say[say.length-1]=el.textContent.replace(name,name+': ');
  });
  var head=$('headline'),text='',cls='',win='';
  if(anyFlagInvalid){text=S.invalidSummary;cls='bad'}
  else if(cake.a&&cake.b){
    var A=cake.a,B=cake.b;
    if(A.fit&&B.fit){
      if(A.price===B.price){text=S.tie;win='ab'}
      else{var w=A.price<B.price?'a':'b';text=f(S.lowerPrice,{cake:w==='a'?S.cakeA:S.cakeB,amount:num(Math.abs(A.price-B.price))});win=w}
      cls='good';
    }else if(A.fit||B.fit){win=A.fit?'a':'b';text=f(S.onlyFit,{cake:A.fit?S.cakeA:S.cakeB});cls='good'}
    else{text=S.noneFit;cls='bad'}
  }else text=S.missing;
  if(head.textContent!==text)head.textContent=text;
  head.className=cls;
  if(announce){var st=$('status'),msg=text+' '+say.join(' ');if(st.textContent!==msg)st.textContent=msg}
  var winKey=win;
  ['a','b'].forEach(function(c){
    var el=$('card-'+c),on=win.indexOf(c)>=0;
    el.classList.toggle('win',on);
    if(on&&winKey!==lastWin){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')}
    if(!on)el.classList.remove('pulse');
  });
  lastWin=winKey;
}

function setMode(m,focus){
  mode=m;flagged={};lastWin='';
  var v;
  if(m==='example')v=EXAMPLE;
  else{
    var gs='6';
    try{var s=localStorage.getItem(KEY);if(s&&/^\d+$/.test(s)&&+s>=1&&+s<=99)gs=String(+s)}catch(e){}
    v={guests:gs,deadline:'',a_price:'',a_serv:'',a_pick:'',b_price:'',b_serv:'',b_pick:''};
  }
  FIELDS.forEach(function(id){$(id).value=v[id]});
  $('modeHead').textContent=m==='example'?S.example:'';
  $('modeHead').style.display=m==='example'?'':'none';
  $('modeBtn').textContent=m==='example'?S.enterOptions:S.showExample;
  render();
  if(focus){if(m==='example')$('modeHead').focus();else $('guests').focus()}
}

FIELDS.forEach(function(id){
  var el=$(id);
  el.addEventListener('input',function(){
    // clear flag if value now parses or is empty; keep flag otherwise until blur/Enter
    flagged[id]=false;
    render();
  });
  el.addEventListener('blur',function(){commit(id)});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commit(id)}});
});
$('modeBtn').addEventListener('click',function(){setMode(mode==='example'?'personal':'example',true)});
setMode('example',false);
})();
</script>
</body>
</html>
