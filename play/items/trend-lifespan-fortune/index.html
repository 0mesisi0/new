<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유행 수명 점괘</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12142b;color:#f4f1e8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
body{background:linear-gradient(160deg,#12142b,#262a52)}
#snow{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;pointer-events:none;z-index:0}
#app{position:fixed;inset:0;display:flex;justify-content:center;z-index:1}
.screen{width:100%;max-width:480px;height:100vh;height:100dvh;padding:16px;display:flex;flex-direction:column}
.hidden{display:none!important}
#s-start{overflow-y:auto;padding-top:52px}
#s-start>.in{margin:auto 0;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}
.emb{font-size:64px;line-height:1;filter:drop-shadow(0 0 14px rgba(217,183,106,.5))}
h1{margin:4px 0 0;font-size:26px;font-weight:800;color:#d9b76a}
.sub{margin:0 0 6px;font-size:14px;color:#c9cbe0}
.inwrap{position:relative}
#inp{width:100%;height:52px;font-size:18px;padding:0 54px 0 14px;border-radius:14px;border:2px solid #6b74b8;background:#1b1f3a;color:#f4f1e8;outline:none;font-family:inherit}
#inp:focus{border-color:#d9b76a}
#cnt{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#9aa0b8;pointer-events:none}
#hint{min-height:18px;font-size:13px;color:#ff8a80}
.lab{font-size:12px;color:#9aa0b8;text-align:left}
#chips{display:grid;grid-template-rows:repeat(2,44px);grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;justify-content:safe center;overflow-x:auto;scrollbar-width:none}
#hint:empty{display:none}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:0;background:#2f3463;color:#f4f1e8;font-size:14px;font-family:inherit;cursor:pointer}
.chip:active{transform:scale(.96)}
#seg{display:flex;gap:6px}
#seg button{flex:1;min-height:44px;border-radius:12px;border:2px solid transparent;background:#2f3463;color:#f4f1e8;font-size:14px;font-family:inherit;cursor:pointer;padding:0 2px}
#seg button[aria-checked=true]{border-color:#d9b76a;background:#3b4180;color:#fff}
.primary{min-height:56px;border:0;border-radius:16px;background:#e0453d;color:#fff;font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #9c2a24}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #9c2a24}
.primary.off{opacity:.55}
#foot{margin:2px 0 0;font-size:12px;color:#9aa0b8}
#mute{position:fixed;top:8px;right:8px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(47,52,99,.85);color:#fff;font-size:20px;cursor:pointer;z-index:5}
#s-read{align-items:center;justify-content:center;gap:18px;cursor:pointer}
#hg{width:120px;height:120px}
#hg svg{width:120px;height:120px;display:block}
.sand{transform-box:fill-box;transform-origin:50% 0}
#rline{margin:0;font-size:17px;color:#d9b76a;text-align:center;min-height:24px}
#panel{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;padding:4px 0 10px;outline:none}
#card{display:block;flex:none;max-width:100%}
#cw{position:relative;flex:none}
#rh{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:70%;height:28px;margin:0;font-size:16px;color:transparent;overflow:hidden;border-radius:6px}
#rh:focus-visible{outline:3px solid #d9b76a;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#panel{cursor:grab}
#bar{flex:none;display:flex;gap:8px;padding-top:10px}
#bar button{flex:1;min-height:48px;border:0;border-radius:14px;background:#2f3463;color:#f4f1e8;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;padding:0 4px}
#bar button.pri{background:#b8322b}
#bar button:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
button:focus-visible{outline:3px solid #d9b76a;outline-offset:2px}
@media (max-width:360px){.screen{padding:16px}#seg button{font-size:13px}h1{font-size:23px}}
@media (max-height:640px){#s-start{padding-top:8px;padding-bottom:12px}#s-start>.in{gap:6px}.emb{font-size:32px}h1{font-size:22px;margin:0}.sub{font-size:13px;margin:0}.primary{min-height:52px}#foot{font-size:11px;margin:0}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<button id="mute" type="button">🔇</button>
<main id="app">
  <section id="s-start" class="screen"><div class="in">
    <div class="emb">🔮⏳</div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="inwrap"><input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"><span id="cnt">0/20</span></div>
    <div id="hint" role="status"></div>
    <div class="lab" id="chipsLabel"></div>
    <div id="chips"></div>
    <div class="lab" id="seenLabel"></div>
    <div id="seg" role="radiogroup" aria-labelledby="seenLabel"></div>
    <button id="go" class="primary" type="button" aria-disabled="true"></button>
    <p id="foot"></p>
  </div></section>
  <section id="s-read" class="screen hidden">
    <div id="hg"><svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <clipPath id="cT"><polygon points="34,14 86,14 60,58"/></clipPath>
        <clipPath id="cB"><polygon points="34,106 86,106 60,62"/></clipPath>
      </defs>
      <g clip-path="url(#cT)"><rect id="sT" class="sand" x="30" y="14" width="60" height="44" fill="#e8c77a"/></g>
      <g clip-path="url(#cB)"><rect id="sB" class="sand" x="30" y="62" width="60" height="44" fill="#e8c77a"/></g>
      <line id="stream" x1="60" y1="58" x2="60" y2="20" stroke="#e8c77a" stroke-width="1.5" opacity="0"/>
      <path d="M30 8V20Q30 45 55 60Q30 75 30 100V112M90 8V20Q90 45 65 60Q90 75 90 100V112M22 8H98M22 112H98" fill="none" stroke="#d9b76a" stroke-width="4" stroke-linecap="round"/>
    </svg></div>
    <p id="rline"></p>
  </section>
  <section id="s-res" class="screen hidden">
    <div id="panel" tabindex="-1"><div id="cw"><canvas id="card" aria-hidden="true"></canvas><h2 id="rh" tabindex="-1"></h2><div id="rtext" class="sr"></div></div></div>
    <div id="bar">
      <button id="bSave" type="button"></button>
      <button id="bCopy" type="button"></button>
      <button id="bAgain" type="button" class="pri"></button>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>

/* storage */
function sget(k){try{return localStorage.getItem('tlf:'+k)}catch(e){return null}}

/* fortune math */
function normStr(s){return s.trim().replace(/\s+/g,' ').toLowerCase().normalize('NFC')}
function fnv(s){var b=new TextEncoder().encode(s),h=0x811c9dc5;for(var i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,16777619)>>>0}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function p2(n){return(n<10?'0':'')+n}
function unit(n,k){var u=T.units[k];return L==='ko'?n+u[0]:n+' '+(n===1?u[0]:u[1])}
function lifeText(d){
  var n;
  if(d<14)return unit(d,'day');
  if(d<60){n=Math.round(d/7);return(L==='ko'?'약 ':'about ')+unit(n,'week')}
  if(d<730){n=Math.round(d/30);return(L==='ko'?'약 ':'about ')+unit(n,'month')}
  var y=(d/365).toFixed(1);return(L==='ko'?'약 '+y+'년':'about '+y+' years');
}
function compute(text,seen){
  var nm=normStr(text),rnd=mulberry(fnv('tlf|'+nm));
  var u=rnd(),r=rnd(),ci=Math.floor(rnd()*2),ai=Math.floor(rnd()*10),bi=Math.floor(rnd()*10),sp=[],i;
  for(i=0;i<30;i++)sp.push([rnd(),rnd()]);
  var no=String(Math.floor(rnd()*10000));while(no.length<4)no='0'+no;
  for(var k in D){if(normStr(D[k].A[ai]+' '+D[k].B[bi])===nm){bi=(bi+1)%10;break}}
  var classic=CLASSICS.indexOf(nm)>=0;
  var p=.22+.2*r;
  var days=Math.round(Math.exp(Math.log(3)+Math.pow(u,1.25)*(Math.log(1200)-Math.log(3))));
  var tier=classic?'classic':days<=7?'mayfly':days<=30?'flash':days<=90?'season':days<=365?'year':'steady';
  var el=SEEN[seen]||0,rem=days-el,over=!classic&&rem<=0;
  var today=new Date();today.setHours(0,0,0,0);
  var start=addDays(today,-el);
  var fr=[0,p*.4,p*.8,p,p+(1-p)*.3,p+(1-p)*.6,1];
  var ms=fr.map(function(f,j){var off=Math.round(f*days);return{label:j,off:off,date:addDays(start,off),passed:over||off<el}});
  var nx=-1;if(!classic&&!over){for(i=0;i<7;i++)if(!ms[i].passed){nx=i;break}}
  if(nx>=0)ms[nx].next=true;
  return{text:text.trim().replace(/\s+/g,' '),nm:nm,classic:classic,days:days,p:p,el:el,rem:rem,over:over,tier:tier,ci:ci,ai:ai,bi:bi,sp:sp,no:no,today:today,ms:ms,H:0};
}
function fmtDate(d,today){return(d.getFullYear()!==today.getFullYear()?d.getFullYear()+'.':'')+p2(d.getMonth()+1)+'.'+p2(d.getDate())}
function nextLine(st){return T.A[st.ai]+' '+T.B[st.bi]}
function comment(st){return st.over?T.overComment:T.comments[st.tier][st.ci]}
function shareText(st){
  var t=['🔮 '+T.subj[0]+st.text+T.subj[1]+' '+T.shareTitle];
  t.push(T.shareLife+': '+(st.classic?T.classicLife:lifeText(st.days))+' ('+T.tiers[st.tier]+')');
  if(!st.classic)t.push(T.shareDate+': '+fmtDate(st.ms[5].date,st.today));
  t.push(T.shareNext+': '+nextLine(st));t.push('play.mesisi.net');
  return t.join('\n');
}

/* canvas helpers */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,text,maxW){
  var out=[],cur='',toks=L==='ko'?Array.from(text):text.split(/(\s+)/);
  toks.forEach(function(t){
    if(c.measureText(cur+t).width>maxW&&cur.trim()){out.push(cur.trim());cur=t.trim()===''?'':t}else cur+=t;
  });
  if(cur.trim())out.push(cur.trim());return out;
}
function fit(c,text,weight,start,min,maxW){
  var s=start;for(;s>min;s--){c.font=weight+s+'px '+FONT;if(c.measureText(text).width<=maxW)return text}
  c.font=weight+min+'px '+FONT;
  if(c.measureText(text).width<=maxW)return text;
  var a=Array.from(text);while(a.length>1&&c.measureText(a.join('')+'…').width>maxW)a.pop();
  return a.join('')+'…';
}
function curveY(st,x){
  if(st.classic)return .5+.5*Math.sin(x*3*2*Math.PI-Math.PI/2);
  var p=st.p;return x<p?(x/p)*(x/p):Math.exp(-3.2*(x-p)/(1-p));
}

/* certificate */
function drawCard(c,st,o){
  var W=360,y;
  c.save();
  if(o.H){
    rr(c,0,0,W,o.H,18);c.fillStyle='#1b1f3a';c.fill();
    c.strokeStyle='#d9b76a';c.lineWidth=1;rr(c,8.5,8.5,W-17,o.H-17,12);c.stroke();
    st.sp.forEach(function(s,i){
      var x=14+s[0]*(W-28),yy=14+s[1]*(o.H-28),r=.8+((s[0]*1000)%1)*1.6;
      c.globalAlpha=.12+((s[1]*997)%1)*.3;c.fillStyle='#f4f1e8';
      c.beginPath();c.arc(x,yy,r,0,6.2832);c.fill();
    });
    c.globalAlpha=1;
  }
  c.textAlign='center';c.textBaseline='alphabetic';
  y=42;
  c.fillStyle='#f4f1e8';c.font='bold 18px '+FONT;c.fillText(T.certTitle,180,y);
  y+=20;c.fillStyle='#9aa0b8';c.font='12px '+FONT;
  c.fillText(T.certNo+' '+st.no+' · '+st.today.getFullYear()+'.'+p2(st.today.getMonth()+1)+'.'+p2(st.today.getDate()),180,y);
  y+=14;c.strokeStyle='#d9b76a';c.lineWidth=1;c.beginPath();c.moveTo(40,y);c.lineTo(320,y);c.stroke();
  /* subject */
  y+=44;c.fillStyle='#f4f1e8';
  c.fillText(fit(c,T.subj[0]+st.text+T.subj[1],'bold ',28,18,320),180,y);
  /* lifespan */
  y+=32;c.fillStyle='#9aa0b8';c.font='12px '+FONT;c.fillText(T.predicted,180,y);
  y+=38;c.fillStyle='#f4f1e8';
  c.fillText(fit(c,st.classic?T.classicLife:lifeText(st.days),'bold ',34,20,320),180,y);
  if(!st.classic){
    y+=10;
    if(st.over){
      c.fillStyle='#ff6b6b';c.font='bold 13px '+FONT;
      wrap(c,T.over.replace('{n}',-st.rem),310).forEach(function(l){y+=18;c.fillText(l,180,y)});
    }else{y+=22;c.fillStyle='#f4f1e8';c.font='bold 14px '+FONT;c.fillText(T.daysLeft.replace('{n}',st.rem),180,y)}
  }
  /* badge */
  y+=18;
  var tc=TIERS[st.tier],bt=tc.e+' '+T.tiers[st.tier];
  c.font='bold 17px '+FONT;
  var bw=Math.min(c.measureText(bt).width+36,330),by=y,bh=38;
  if(o.stamp>=0){
    var e=o.stamp;c.save();c.translate(180,by+bh/2);c.rotate(-6*Math.PI/180*e);var sc=2-e;c.scale(sc,sc);c.globalAlpha=Math.min(1,e*3);
    rr(c,-bw/2,-bh/2,bw,bh,19);c.fillStyle=tc.c;c.fill();
    c.fillStyle='#1b1f3a';c.textBaseline='middle';c.font='bold 17px '+FONT;c.fillText(fit(c,bt,'bold ',17,12,bw-24),0,1);
    c.restore();
  }
  y+=bh+18;
  /* curve */
  var bx=30,bw2=300,bh2=124,top=y+24,base=y+bh2-20,hh=base-top;
  c.fillStyle='rgba(255,255,255,.05)';rr(c,bx,y,bw2,bh2,10);c.fill();
  c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1;c.beginPath();c.moveTo(bx+8,base+.5);c.lineTo(bx+bw2-8,base+.5);c.stroke();
  var px0=bx+8,pw=bw2-16,N=80,pr=o.curve;
  if(pr>0){
    var g=c.createLinearGradient(0,top,0,base);g.addColorStop(0,'rgba(217,183,106,.5)');g.addColorStop(1,'rgba(217,183,106,0)');
    c.beginPath();c.moveTo(px0,base);
    for(var i=0;i<=N;i++){var x=i/N*pr;c.lineTo(px0+x*pw,base-curveY(st,x)*hh)}
    c.lineTo(px0+pr*pw,base);c.closePath();c.fillStyle=g;c.fill();
    c.beginPath();for(i=0;i<=N;i++){x=i/N*pr;var yy=base-curveY(st,x)*hh;i?c.lineTo(px0+x*pw,yy):c.moveTo(px0+x*pw,yy)}
    c.strokeStyle='#d9b76a';c.lineWidth=2;c.lineJoin='round';c.stroke();
  }
  c.font='10px '+FONT;c.fillStyle='#9aa0b8';
  if(st.classic){
    for(i=0;i<3;i++){c.textAlign='center';c.fillText(T.classicX[i],px0+(i*2+1)/6*pw,base+13)}
    if(pr>=1){c.font='13px '+FONT;c.fillStyle='#d9b76a';c.textAlign='center';c.fillText('★',px0+pw/6,top-4)}
  }else{
    var xt=st.over?1:Math.max(0,Math.min(1,st.el/st.days)),tx=px0+xt*pw;
    c.save();c.setLineDash([4,3]);c.strokeStyle=st.over?'#ff6b6b':'#f4f1e8';c.lineWidth=1;c.beginPath();c.moveTo(tx,top-8);c.lineTo(tx,base);c.stroke();c.restore();
    c.fillStyle=st.over?'#ff6b6b':'#f4f1e8';c.font='10px '+FONT;
    c.textAlign=xt<.12?'left':xt>.88?'right':'center';
    c.fillText(st.over?T.past:T.today,tx,base+13);
    if(pr>=st.p){
      var sx=px0+st.p*pw;c.textAlign='center';c.fillStyle='#d9b76a';c.font='14px '+FONT;c.fillText('★',sx,top-4);
      c.font='10px '+FONT;c.textAlign='left';c.fillText(T.peak,sx+9,top-5);
    }
  }
  y+=bh2+20;
  /* milestones */
  if(!st.classic){
    st.ms.forEach(function(m,i){
      y+=22;c.textBaseline='alphabetic';
      var col=m.passed?'#6f7592':'#f4f1e8';
      c.textAlign='center';
      if(m.passed){c.fillStyle='#6f7592';c.font='12px '+FONT;c.fillText('✓',44,y)}
      else if(m.next){
        var rad=reduced?4:3.5+1.5*Math.sin(o.t/260);
        c.fillStyle='rgba(217,183,106,.25)';c.beginPath();c.arc(44,y-4,rad+3,0,6.2832);c.fill();
        c.fillStyle='#d9b76a';c.beginPath();c.arc(44,y-4,rad,0,6.2832);c.fill();
      }
      c.textAlign='left';c.fillStyle=col;c.font=(m.next?'bold ':'')+'13px '+FONT;c.fillText(T.ms[i],58,y);
      c.textAlign='right';c.font='13px '+MONO;c.fillText(fmtDate(m.date,st.today),322,y);
    });
    y+=14;
  }
  /* comment */
  c.textAlign='center';c.fillStyle=st.over?'#ff6b6b':'#f4f1e8';c.font='italic 14px '+FONT;
  wrap(c,comment(st),296).forEach(function(l){y+=20;c.fillText(l,180,y)});
  y+=22;
  /* next */
  c.save();c.setLineDash([5,4]);c.strokeStyle='#d9b76a';c.lineWidth=1;rr(c,30.5,y+.5,299,64,10);c.stroke();c.restore();
  c.fillStyle='#9aa0b8';c.font='12px '+FONT;c.fillText(T.nextTrend,180,y+22);
  c.fillStyle='#d9b76a';c.fillText(fit(c,nextLine(st),'bold ',20,13,280),180,y+49);
  y+=64+30;
  /* footer */
  c.fillStyle='#9aa0b8';c.fillText(fit(c,T.note,'',11,8,320),180,y);
  y+=16;c.fillStyle='#d9b76a';c.font='11px '+FONT;c.fillText('play.mesisi.net',180,y);
  c.restore();
  return y+26;
}
var scratch=document.createElement('canvas').getContext('2d');
function cardHeight(st){if(!st.H)st.H=Math.ceil(drawCard(scratch,st,{H:0,curve:0,stamp:-1,t:0}));return st.H}

/* snow */
var snowC=$('snow'),sx=snowC.getContext('2d'),flakes=[],sw=0,sh=0,dpr=1;
function initSnow(){
  var n=reduced?15:50;flakes=[];
  for(var i=0;i<n;i++)flakes.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.2,s:(reduced?.012:.04)+Math.random()*.05,ph:Math.random()*6.28});
}
function sizeSnow(){
  dpr=Math.min(window.devicePixelRatio||1,2);sw=innerWidth;sh=innerHeight;
  snowC.width=sw*dpr;snowC.height=sh*dpr;
}
function drawSnow(dt,t){
  sx.setTransform(dpr,0,0,dpr,0,0);sx.clearRect(0,0,sw,sh);sx.fillStyle='rgba(255,255,255,.6)';
  flakes.forEach(function(f){
    f.y+=f.s*dt/1000;if(f.y>1.02){f.y=-.02;f.x=Math.random()}
    var x=(f.x+Math.sin(t/1500+f.ph)*.02)*sw;
    sx.beginPath();sx.arc(x,f.y*sh,f.r,0,6.2832);sx.fill();
  });
}

/* sound */
var ac=null,soundOn=sget('sound')==='1';
function ensureAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,dur,g,type){
  if(!soundOn||!ac)return;
  var o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;
  o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function sandSound(){
  if(!soundOn||!ac)return;
  var len=Math.floor(ac.sampleRate*1.6),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var s=ac.createBufferSource();s.buffer=buf;
  var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=3000;
  var g=ac.createGain();g.gain.value=.03;s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function landSound(){tone(110,.08,.12);tone(880,.2,.05);tone(1320,.2,.05)}
function setMute(){
  var b=$('mute');b.textContent=soundOn?'🔊':'🔇';
  b.setAttribute('aria-label',soundOn?T.soundOff:T.soundOn);b.title=b.getAttribute('aria-label');
}
function toggleSound(){soundOn=!soundOn;sset('sound',soundOn?'1':'0');if(soundOn){ensureAudio();tone(660,.1,.05)}setMute()}

/* ui */
var inp=$('inp'),mode='start',cur=null,seenIdx=0,rt=0,resT=0,landed=false,demo=false,hidden=document.hidden;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1800)}
function show(m){
  mode=m;$('s-start').classList.toggle('hidden',m!=='start');$('s-read').classList.toggle('hidden',m!=='reading');$('s-res').classList.toggle('hidden',m!=='result');
}
function buildStart(){
  $('title').textContent=T.appTitle;$('sub').textContent=T.startSub;inp.placeholder=T.inputPh;inp.setAttribute('aria-label',T.inputPh);
  $('chipsLabel').textContent=T.chipsLabel;$('seenLabel').textContent=T.firstSeen;$('go').textContent=T.startBtn;$('foot').textContent=T.foot;
  $('bSave').textContent=T.save;$('bCopy').textContent=T.copy;$('bAgain').textContent=T.again;
  var ch=$('chips');T.chips.forEach(function(s){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=s;
    b.addEventListener('click',function(){inp.value=clip(s);updCount();$('hint').textContent=''});
    ch.appendChild(b);
  });
  var sg=$('seg');T.seen.forEach(function(s,i){
    var b=document.createElement('button');b.type='button';b.setAttribute('role','radio');b.textContent=s;
    b.addEventListener('click',function(){setSeen(i)});sg.appendChild(b);
  });
  setSeen(seenIdx);setMute();
}
function setSeen(i){seenIdx=i;Array.prototype.forEach.call($('seg').children,function(b,j){b.setAttribute('aria-checked',j===i?'true':'false')})}
function clip(s){var a=Array.from(s);return a.length>12?a.slice(0,12).join(''):s}
function updCount(){var n=Array.from(inp.value).length;$('cnt').textContent=n+'/12';$('go').classList.toggle('off',!normStr(inp.value))}
inp.addEventListener('input',function(e){if(!e.isComposing){var v=clip(inp.value);if(v!==inp.value)inp.value=v}updCount()});
inp.addEventListener('compositionend',function(){var v=clip(inp.value);if(v!==inp.value)inp.value=v;updCount()});

function shake(el){if(reduced||!el.animate)return;el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:200})}
function go(){
  if(!normStr(inp.value)){shake(inp);$('hint').textContent=T.emptyHint;return}
  $('hint').textContent='';
  ensureAudio();
  var txt=clip(inp.value);
  sset('last',txt);sset('seen',String(SEEN[seenIdx]));
  sset('count',String((parseInt(sget('count'),10)||0)+1));
  cur=compute(txt,seenIdx);
  rt=0;show('reading');sandSound();updReading(0);
}
function updReading(t){
  var f=Math.min(1,t/300),fl=reduced?1:f;
  $('hg').style.transform='rotate('+(180*fl)+'deg)';
  var d=reduced?0:Math.max(0,Math.min(1,(t-300)/1600));
  $('sB').style.transform='scaleY('+(1-d)+')';$('sT').style.transform='scaleY('+d+')';
  $('stream').setAttribute('opacity',(d>0&&d<1)?'.9':'0');
  $('rline').textContent=T.reading[Math.min(2,Math.floor(t/600))];
}
function finishReading(){
  show('result');landed=false;resT=reduced||demo?1e6:0;
  $('panel').scrollTop=0;layoutCard();
}
function layoutCard(){
  var cv=$('card'),H=cardHeight(cur),cw=Math.min(innerWidth*.92,420,$('panel').clientWidth||420);
  var d=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=cw+'px';cv.style.height=(H*cw/360)+'px';cv.width=Math.round(cw*d);cv.height=Math.round(H*cw/360*d);
}
function renderCard(){
  var cv=$('card'),c=cv.getContext('2d'),k=cv.width/360,H=cardHeight(cur);
  var cp=Math.min(1,resT/700),ce=1-Math.pow(1-cp,3);
  var sp=(resT-700)/220,stamp=sp<0?-1:Math.min(1,sp);if(stamp>=0)stamp=1-Math.pow(1-stamp,2);
  if(!landed&&resT>=920){landed=true;if(!demo&&!reduced)landSound()}
  var shk=0;if(!reduced&&resT>=920&&resT<1040)shk=Math.sin((resT-920)/120*Math.PI*6)*3;
  cv.style.transform=shk?'translateX('+shk+'px)':'';
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(k,0,0,k,0,0);
  drawCard(c,cur,{H:H,curve:ce,stamp:stamp,t:performance.now()});
}
function toStart(){show('start');inp.value=clip(inp.value);updCount();if(!matchMedia('(pointer: coarse)').matches){inp.focus();inp.select()}}

/* export */
function saveImage(){
  try{
    var H=cardHeight(cur),cw=670,k=cw/360,tw=750,th=Math.ceil(H*k)+80;
    var cv=document.createElement('canvas');cv.width=tw;cv.height=th;var c=cv.getContext('2d');
    c.fillStyle='#12142b';c.fillRect(0,0,tw,th);
    c.save();c.translate(40,40);c.scale(k,k);drawCard(c,cur,{H:H,curve:1,stamp:1,t:0});c.restore();
    c.fillStyle='#9aa0b8';c.font='12px '+FONT;c.textAlign='right';c.textBaseline='alphabetic';c.fillText('play.mesisi.net',tw-40,th-14);
    cv.toBlob(function(b){
      if(!b){toast(T.saveFail);return}
      var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='trend-lifespan.png';
      document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000);toast(T.saved);
    },'image/png');
  }catch(e){toast(T.saveFail)}
}
function copyText(){
  var t=shareText(cur);
  function fb(){
    try{
      var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-999px;top:0;opacity:0';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?T.copied:T.copyFail);
    }catch(e){toast(T.copyFail)}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(T.copied)},fb)}else fb();
}

/* events */
$('go').addEventListener('click',go);
$('mute').addEventListener('click',toggleSound);
$('bSave').addEventListener('click',saveImage);
$('bCopy').addEventListener('click',copyText);
$('bAgain').addEventListener('click',toStart);
$('s-read').addEventListener('pointerdown',function(){if(mode==='reading')finishReading()});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key,focused=document.activeElement===inp,onBtn=e.target&&e.target.tagName==='BUTTON';
  if(!focused&&(k==='m'||k==='M')){toggleSound();return}
  if(mode==='start'){
    if(k==='Enter'&&(focused||!onBtn)){e.preventDefault();go()}
    else if(!focused&&k>='1'&&k<='4'){setSeen(+k-1)}
  }else if(mode==='reading'){
    if(k!=='Shift'&&k!=='Tab'){e.preventDefault();finishReading()}
  }else{
    var p=$('panel');
    if(k==='s'||k==='S'){saveImage()}
    else if(k==='c'||k==='C'){copyText()}
    else if(k==='r'||k==='R'||(k==='Enter'&&!onBtn)){e.preventDefault();toStart()}
    else if(k==='ArrowDown'){e.preventDefault();p.scrollBy(0,48)}
    else if(k==='ArrowUp'){e.preventDefault();p.scrollBy(0,-48)}
    else if(k==='PageDown'){e.preventDefault();p.scrollBy(0,p.clientHeight*.9)}
    else if(k==='PageUp'){e.preventDefault();p.scrollBy(0,-p.clientHeight*.9)}
  }
});
addEventListener('resize',function(){sizeSnow();if(mode==='result'&&cur)layoutCard()});
document.addEventListener('visibilitychange',function(){hidden=document.hidden;last=performance.now()});

/* loop */
var last=performance.now(),clock=0;
function frame(now){
  requestAnimationFrame(frame);
  if(hidden){last=now;return}
  var dt=Math.min(50,now-last);last=now;clock+=dt;
  drawSnow(dt,clock);
  if(mode==='reading'){
    rt+=dt;
    if(reduced){if(rt>=300)finishReading()}
    else{updReading(rt);if(rt>=2000)finishReading()}
  }else if(mode==='result'&&cur){resT+=dt;renderCard()}
}

/* init */
var ls=sget('seen'),si=SEEN.indexOf(parseInt(ls,10));if(si>=0)seenIdx=si;
buildStart();sizeSnow();initSnow();
var lastTxt=sget('last');if(lastTxt)inp.value=clip(lastTxt);
updCount();
if(location.hash==='#demo'){
  demo=true;inp.value='흑임자 크림빵';setSeen(1);cur=compute(inp.value,1);updCount();finishReading();
}else if(!matchMedia('(pointer: coarse)').matches){inp.focus()}
requestAnimationFrame(frame);
})();
</script>
