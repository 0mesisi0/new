<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>정미년 양 몰이</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ef;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;color:#23262d;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;display:block}
.hide{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #e0453d;outline-offset:2px}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;z-index:5}
#bar{height:6px;background:#23262d}
.big:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 4px 0 #a82f29,0 0 0 3px #23262d}
#sa{position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
#scl{font-size:16px;font-weight:700;color:#4a4f5a}
#toast.off{opacity:0}
#barfill{display:block;height:100%;width:100%;background:#4caf7a}
#pill{position:absolute;left:8px;top:14px;display:flex;gap:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:700;font-size:16px;line-height:20px}
#mute{position:fixed;right:8px;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.75);font-size:20px;z-index:30;padding:0}
#bark{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:3px solid #fff;z-index:6;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.2);--cd:0;background:conic-gradient(rgba(35,38,45,.38) calc(var(--cd)*360deg),#fff 0);touch-action:none}
#bark span{font-size:22px;margin-bottom:2px}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:8;text-shadow:0 2px 0 #fff,0 0 12px rgba(255,255,255,.9)}
#b1{font-size:30px;font-weight:900}
#b2{font-size:16px;font-weight:700;margin-top:6px;color:#b3322b}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(25,32,50,.45)}
#start{flex-direction:column;color:#fff;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer}
#start h1{margin:0 0 8px;font-size:clamp(32px,9vw,46px);font-weight:900}
#start p{margin:4px 12px;font-size:16px;font-weight:600}
#startbest{margin-top:14px;font-size:16px;font-weight:700}
.big{margin-top:20px;min-height:56px;padding:12px 32px;border-radius:16px;border:0;background:#e0453d;color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 #a82f29;text-shadow:none}
#pause{flex-direction:column;color:#fff;font-size:24px;font-weight:900;text-align:center;cursor:pointer;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#card{position:relative;width:min(90vw,380px);max-height:96vh;overflow:auto;background:#fff;border-radius:22px;padding:18px 18px 16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#card h2{margin:0 0 4px;font-size:16px;color:#6b7280}
#sc{font-size:48px;font-weight:900;line-height:1.1}
#nb{display:inline-block;margin:2px 0;padding:2px 12px;border-radius:999px;background:#ffcf4a;color:#23262d;font-weight:900;font-size:16px;animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
#card .row{font-size:16px;font-weight:600;margin:3px 0}
#stamp{display:inline-block;margin:12px 0 8px;padding:6px 16px;border:3px solid #e0453d;border-radius:14px;color:#e0453d;font-weight:900;font-size:20px;transform:rotate(-6deg)}
#luck{font-size:16px;font-weight:700;margin:6px 0 12px;color:#4a4f5a}
#card .big{display:block;width:100%;margin:0}
#copy{margin-top:10px;min-height:44px;padding:8px 20px;border-radius:12px;border:2px solid #d8dde3;background:#fff;font-size:16px;font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(35,38,45,.9);color:#fff;font-weight:700;font-size:16px;z-index:40;pointer-events:none}
@media (prefers-reduced-motion:reduce){#nb{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa" aria-hidden="true"></div>
<div id="hud" class="hide"><div id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="barfill"></i></div><div id="pill"><span id="hr"></span><span id="hs"></span><span id="ht"></span></div></div>
<button id="mute" type="button">🔊</button>
<button id="bark" class="hide" type="button"><span>🐕</span><b id="barkTxt"></b></button>
<div id="banner" class="hide"><div id="b1"></div><div id="b2"></div></div>
<div id="start" class="ov hide">
  <h1 data-t="appTitle"></h1>
  <p data-t="startSub"></p>
  <p data-t="howShort"></p>
  <div id="startbest"></div>
  <button id="go" class="big" type="button" data-t="tapStart"></button>
</div>
<div id="over" class="ov hide">
  <div id="card">
    <h2 data-t="gameOver"></h2>
    <div id="scl" data-t="score"></div>
    <div id="sc">0</div>
    <div id="nb" class="hide" data-t="newBest"></div>
    <div class="row"><span data-t="best"></span> <b id="bs"></b></div>
    <div class="row" id="r1"></div>
    <div class="row" id="r2"></div>
    <div id="stamp"></div>
    <div id="luck"></div>
    <button id="retry" class="big" type="button" data-t="retry"></button>
    <button id="copy" type="button" data-t="copy"></button>
  </div>
</div>
<div id="pause" class="ov hide"><span data-t="paused"></span><button id="resume" class="big" type="button" data-t="resume"></button></div>
<div id="toast" class="off" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search).get('lang');
var lang=(q==='ko'||q==='en')?q:((navigator.language||'en').toLowerCase().indexOf('ko')===0?'ko':'en');
document.documentElement.lang=lang;
var D={
ko:{appTitle:'정미년 양 몰이',startSub:'2027년은 양의 해! 강아지가 되어 양들을 울타리로 몰아요',howShort:'양 뒤로 다가가면 반대쪽으로 도망가요',tapStart:'탭해서 시작',best:'최고 점수',score:'점수',hudRound:'R{n}',hudSheep:'🐑 {p}/{t}',secs:'{n}초',timeLabel:'남은 시간',startBest:'최고 점수 {n}',startBestSheep:'최고 점수 {n} · 🐑 {k}마리',resume:'계속하기',roundIntro:'{n}라운드 · 양 {k}마리',bark:'멍!',barkBtn:'짖기',stubbornHint:'고집 양 등장! 더 가까이 붙어서 밀어요',roundClear:'라운드 클리어! +{bonus}',timeUp:'시간 끝!',gameOver:'오늘의 양 몰이 결과',newBest:'최고 기록!',sheepTotal:'몰아넣은 양 {n}마리',roundsCleared:'클리어한 라운드 {n}',luckLine:'새해 복 {n}마리만큼 받으세요!',luckLineZero:'양들도 새해엔 다시 만나재요!',retry:'다시 하기',copy:'결과 복사',copied:'복사했어요',copyFail:'복사하지 못했어요',paused:'일시정지 · 탭하면 계속',soundOn:'소리 켜기',soundOff:'소리 끄기',baa:'메에~',
 tiers:['양치기 견습생','동네 양치기','목장의 에이스','정미년 양몰이 명인','전설의 양치기견'],
 share:'🐑 정미년 양 몰이 {score}점 / 양 {n}마리 · {rounds}라운드 / 칭호: {tier} / {luck} / play.mesisi.net',pts:'점'},
en:{appTitle:'Sheep Round-Up 2027',startSub:'2027 is the year of the sheep. Be the sheepdog and herd them home.',howShort:'Get behind the sheep and they run the other way',tapStart:'Tap to start',best:'Best',score:'Score',hudRound:'R{n}',hudSheep:'🐑 {p}/{t}',secs:'{n}s',timeLabel:'Time left',startBest:'Best {n}',startBestSheep:'Best {n} · 🐑 {k} sheep',resume:'Resume',roundIntro:'Round {n} · {k} sheep',bark:'Woof!',barkBtn:'Bark',stubbornHint:'A stubborn sheep! Get closer to push it',roundClear:'Round clear! +{bonus}',timeUp:"Time's up!",gameOver:"Today's round-up",newBest:'New best!',sheepTotal:'{n} sheep herded',roundsCleared:'Rounds cleared: {n}',luckLine:"Wishing you {n} sheep's worth of luck in 2027!",luckLineZero:'The sheep say: see you again in the new year!',retry:'Play again',copy:'Copy result',copied:'Copied',copyFail:'Could not copy',paused:'Paused · tap to continue',soundOn:'Sound on',soundOff:'Sound off',baa:'Baa~',
 tiers:['Apprentice Shepherd','Neighborhood Shepherd','Ranch Ace','Master of the Sheep Year','Legendary Sheepdog'],
 share:'🐑 Sheep Round-Up 2027: {score} pts / {n} sheep · {rounds} rounds / Title: {tier} / play.mesisi.net',pts:' pts'}
}[lang];
var TIER_EMOJI=['🐾','🧣','🐕','🏅','🌟'];
function f(s,o){return s.replace(/\{(\w+)\}/g,function(m,k){return o&&k in o?o[k]:m;});}
document.title=D.appTitle;
var $=function(id){return document.getElementById(id);};
document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=D[e.getAttribute('data-t')];});
$('barkTxt').textContent=D.bark;$('bark').setAttribute('aria-label',D.barkBtn);$('bark').title=D.barkBtn;$('bar').setAttribute('aria-label',D.timeLabel);

/* ---------- storage ---------- */
var mem={};
function sget(k,d){try{var v=localStorage.getItem('shr:'+k);return v===null?(k in mem?mem[k]:d):v;}catch(e){return k in mem?mem[k]:d;}}
function sset(k,v){mem[k]=String(v);try{localStorage.setItem('shr:'+k,String(v));}catch(e){}}
var best=parseInt(sget('best','0'),10)||0, bestSheep=parseInt(sget('bestSheep','0'),10)||0;
var soundOn=sget('sound','1')!=='0';

/* ---------- audio ---------- */
var AC=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{var C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();}}catch(e){AC=null;}
}
function env(g,t0,dur,peak){g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(peak,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
function tone(type,f0,f1,dur,peak,delay,extra){
  if(!AC||!soundOn)return;
  try{
    var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain(),last=o;
    o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.linearRampToValueAtTime(f1,t0+dur);
    if(extra&&extra.lp){var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=extra.lp;o.connect(lp);last=lp;}
    if(extra&&extra.vib){var l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=6;lg.gain.value=8;l.connect(lg);lg.connect(o.frequency);l.start(t0);l.stop(t0+dur+0.05);}
    last.connect(g);g.connect(AC.destination);env(g,t0,dur,peak);o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sBaa(){var v=1+(Math.random()*0.16-0.08);tone('sawtooth',260*v,200*v,0.28,0.08,0,{lp:1200,vib:1});}
function sBark(){tone('square',480,320,0.07,0.07,0);tone('square',480,320,0.07,0.07,0.11);}
function sClear(){[523.25,659.25,783.99].forEach(function(n,i){tone('sine',n,n,0.09,0.06,i*0.09);});}
function sOver(){tone('sine',330,180,0.4,0.06,0);}

/* ---------- rng ---------- */
var seed=1;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

/* ---------- world ---------- */
var WW=360,WH=640,FX0=12,FX1=348,FY0=60,FY1=628;
var WALLS=[[97,77,263,83],[97,77,103,193],[257,77,263,193],[97,187,150,193],[210,187,263,193]];
var PEN=[97,77,263,193];
var cv=$('c'),ctx=cv.getContext('2d');
var W=0,H=0,dpr=1,S=1,OX=0,OY=0;
function layout(){
  W=window.innerWidth;H=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  /* reserve a strip at the bottom for the 56px bark button so it never covers the field */
  var AH=Math.max(100,H-(56+Math.max(16,$('sa').offsetHeight)+8));
  S=Math.min(W/WW,AH/WH);OX=(W-WW*S)/2;OY=(AH-WH*S)/2;
}
window.addEventListener('resize',layout);layout();
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

var G={},dog={},state='start',paused=false,demo=false;
var puffs=[],floats=[],confetti=[],snow=[],fenceFlash=0,shake=0,gateClose=0,stateT=0,barkCD=0,bubbleT=0;
var keys={},keyMode=false,lastDown={t:0,x:0,y:0};
var nSnow=reduce?15:40;
for(var i=0;i<nSnow;i++)snow.push({x:Math.random(),y:Math.random(),v:0.03+Math.random()*0.05,r:1+Math.random()*2,p:Math.random()*6.28});

function resetDog(){dog={x:180,y:520,tx:180,ty:520,vx:0,vy:0,face:1,barkT:0,jumpT:0,wag:0};keyMode=false;}
function newSheep(x,y,stub){return{x:x,y:y,vx:0,vy:0,penned:false,stub:stub,wh:rnd()*6.28,wt:1+rnd(),pop:0,face:-Math.PI/2,ph:0,pt:0,stuck:0,shrug:false,a:1};}
function nStub(n){return n<3?0:Math.min(4,1+Math.floor((n-3)/3));}
function spawnRound(n){
  var k=Math.min(3+2*n,15),st=Math.min(nStub(n),k),arr=[];
  for(var i=0;i<k;i++){
    var x=0,y=0;
    for(var t=0;t<30;t++){
      x=30+rnd()*300;y=380+rnd()*220;
      if(Math.hypot(x-dog.x,y-dog.y)<110)continue;
      var ok=true;for(var j=0;j<arr.length;j++)if(Math.hypot(x-arr[j].x,y-arr[j].y)<28){ok=false;break;}
      if(ok)break;
    }
    var s=newSheep(x,y,i<st);s.a=0;arr.push(s);
  }
  return arr;
}
function startRound(n){
  G.round=n;G.sheep=spawnRound(n);G.timeMax=Math.min(25+3*n,45);G.timeLeft=G.timeMax;
  state='intro';stateT=0;
  $('b1').textContent=f(D.roundIntro,{n:n,k:G.sheep.length});
  $('b2').textContent=(nStub(n)>nStub(n-1))?D.stubbornHint:'';
  $('banner').classList.remove('hide');
  fenceFlash=0;gateClose=0;
}
function startGame(){
  seed=Date.now();
  sset('plays',(parseInt(sget('plays','0'),10)||0)+1);
  G={score:0,herded:0,cleared:0,round:1,sheep:[],timeLeft:0,timeMax:1,newBest:false};
  resetDog();puffs=[];floats=[];confetti=[];barkCD=0;bubbleT=0;shake=0;
  $('start').classList.add('hide');$('over').classList.add('hide');
  $('hud').classList.remove('hide');$('bark').classList.remove('hide');
  startRound(1);
}
function showStart(){
  seed=Date.now();resetDog();dog.x=dog.tx=180;dog.y=dog.ty=590;
  G={score:0,herded:0,cleared:0,round:0,sheep:[],timeLeft:0,timeMax:1};
  for(var i=0;i<6;i++){var s=newSheep(40+rnd()*280,300+rnd()*250,false);G.sheep.push(s);}
  state='start';
  $('startbest').textContent=f(bestSheep?D.startBestSheep:D.startBest,{n:best,k:bestSheep});
  $('start').classList.remove('hide');
}
function setupDemo(){
  demo=true;seed=7;resetDog();dog.x=dog.tx=180;dog.y=dog.ty=400;
  G={score:300,herded:3,cleared:1,round:2,sheep:[],timeLeft:21,timeMax:31,newBest:false};
  [[140,125],[180,135],[220,120]].forEach(function(p){var s=newSheep(p[0],p[1],false);s.penned=true;G.sheep.push(s);});
  [[150,265],[188,248],[218,272],[176,298]].forEach(function(p){G.sheep.push(newSheep(p[0],p[1],false));});
  state='play';
  $('hud').classList.remove('hide');$('bark').classList.remove('hide');
}

/* ---------- physics ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function circRect(o,r,r0,r1,r2,r3,vel){
  var cx=clamp(o.x,r0,r2),cy=clamp(o.y,r1,r3),dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy,nx,ny,push;
  if(d2>=r*r)return false;
  if(d2>1e-6){var d=Math.sqrt(d2);nx=dx/d;ny=dy/d;push=r-d;}
  else{
    var l=o.x-r0,rr=r2-o.x,t=o.y-r1,b=r3-o.y,m=Math.min(l,rr,t,b);
    if(m===l){nx=-1;ny=0;}else if(m===rr){nx=1;ny=0;}else if(m===t){nx=0;ny=-1;}else{nx=0;ny=1;}
    push=m+r;
  }
  o.x+=nx*push;o.y+=ny*push;
  if(vel){var vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=vn*nx;o.vy-=vn*ny;}}
  return true;
}
function updDog(dt){
  var sp,ox=dog.x,oy=dog.y;
  var dx=0,dy=0;
  if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;
  if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;
  if(dx||dy){
    keyMode=true;var l=Math.hypot(dx,dy);dog.x+=dx/l*220*dt;dog.y+=dy/l*220*dt;dog.tx=dog.x;dog.ty=dog.y;
  }else if(!keyMode){
    var ex=dog.tx-dog.x,ey=dog.ty-dog.y,k=Math.min(1,12*dt),mx=ex*k,my=ey*k,ml=Math.hypot(mx,my),mm=520*dt;
    if(ml>mm){mx*=mm/ml;my*=mm/ml;}
    dog.x+=mx;dog.y+=my;
  }
  dog.x=clamp(dog.x,FX0,FX1);dog.y=clamp(dog.y,FY0,FY1);
  circRect(dog,10,PEN[0],PEN[1],PEN[2],PEN[3],null);
  dog.x=clamp(dog.x,FX0,FX1);dog.y=clamp(dog.y,FY0,FY1);
  if(dt>0){
    var ivx=(dog.x-ox)/dt,ivy=(dog.y-oy)/dt,a=Math.min(1,10*dt);
    dog.vx+=(ivx-dog.vx)*a;dog.vy+=(ivy-dog.vy)*a;
  }
  sp=Math.hypot(dog.vx,dog.vy);
  if(Math.abs(dog.vx)>8)dog.face=dog.vx>0?1:-1;
  dog.wag+=dt*(4+sp*0.06);
  if(dog.barkT>0)dog.barkT-=dt;
  if(dog.jumpT>0)dog.jumpT-=dt;
  if(bubbleT>0)bubbleT-=dt;
  if(barkCD>0)barkCD=Math.max(0,barkCD-dt);
}
function doBark(){
  if(paused||state!=='play'||barkCD>0)return;
  barkCD=3;dog.barkT=0.4;dog.jumpT=0.25;bubbleT=0.5;sBark();
}
function spawnPuff(x,y){var d=[],n=3+Math.floor(rnd()*3);for(var i=0;i<n;i++)d.push([(rnd()-.5)*10,(rnd()-.5)*6,1+rnd()*1.5]);puffs.push({x:x,y:y,t:0,d:d});}
function pen(s){
  s.penned=true;s.pop=0.2;G.herded++;var pts=s.stub?200:100;G.score+=pts;
  floats.push({x:s.x,y:s.y-14,t:0,txt:'+'+pts});
  fenceFlash=0.25;sBaa();
}
function updSheep(dt){
  var all=G.sheep,barking=dog.barkT>0,n=all.length,i,j,s,o;
  for(i=0;i<n;i++){
    s=all[i];
    if(s.a<1&&state==='intro')s.a=Math.min(1,stateT/0.9);else s.a=1;
    if(state==='intro')continue; /* sheep stay at spawn points until the banner leaves */
    if(s.pop>0)s.pop-=dt;
    var ax=0,ay=0;
    if(s.penned){
      s.wt-=dt;if(s.wt<=0){s.wh+=(rnd()*2-1)*0.6;s.wt=1+rnd();}
      ax+=Math.cos(s.wh)*6;ay+=Math.sin(s.wh)*6;

function updFX(dt){
  if(fenceFlash>0)fenceFlash-=dt;if(shake>0)shake-=dt;
  puffs=puffs.filter(function(p){p.t+=dt;return p.t<0.3;});
  floats=floats.filter(function(p){p.t+=dt;return p.t<0.7;});
  confetti=confetti.filter(function(c){c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=300*dt;c.vx*=Math.exp(-1.2*dt);return c.t<1.3;});
  snow.forEach(function(p){p.y+=p.v*dt;if(p.y>1.02){p.y=-0.02;p.x=Math.random();}});
}
var lastSec=-1;
function hudUpdate(){
  if(!G.sheep)return;
  var tot=G.sheep.length,pn=0;for(var i=0;i<tot;i++)if(G.sheep[i].penned)pn++;
  $('hr').textContent=f(D.hudRound,{n:G.round});$('hs').textContent=f(D.hudSheep,{p:pn,t:tot});
  var fr=clamp(G.timeLeft/G.timeMax,0,1),bf=$('barfill'),sec=Math.ceil(G.timeLeft);bf.style.width=(fr*100)+'%';bf.style.background=G.timeLeft<5?'#e0453d':'#4caf7a';
  if(sec!==lastSec){lastSec=sec;var st=f(D.secs,{n:sec}),b=$('bar');$('ht').textContent=st;b.setAttribute('aria-valuemax',G.timeMax);b.setAttribute('aria-valuenow',sec);b.setAttribute('aria-valuetext',st);}
  $('bark').style.setProperty('--cd',(barkCD/3).toFixed(3));
}
function frame(tm){
  var dt=Math.min(0.05,Math.max(0,(tm-last)/1000));last=tm;
  if(!paused){
    if(state==='start'){updDog(dt);updSheep(dt);updFX(dt);}
    else{updDog(dt);updSheep(dt);updFX(dt);if(!demo||state!=='play')nextState(dt);else{}}
    if(state!=='start')hudUpdate();
  }
  render(tm);
  requestAnimationFrame(frame);
}
if(location.hash==='#demo'){$('start').classList.add('hide');setupDemo();}else showStart();
requestAnimationFrame(function(t){last=t;frame(t);});
})();
</script>
