name: Play site (test, QA, deploy)

on:
  push:
    branches: [main]
    paths: ['play/**', '.github/workflows/play.yml']
  pull_request:
    paths: ['play/**', '.github/workflows/play.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: play/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static rules and vote logic
        run: npm test
      - name: Headless play-test of every item (blocks deploy on failure)
        run: npm run qa

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: play
      url: https://play.mesisi.net
    defaults:
      run:
        working-directory: play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: play/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --project-name daily-toybox --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
